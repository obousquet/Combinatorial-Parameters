Maximum Degree / Densest Subgraph (twice)</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/maximum_degree.html\">Maximum Degree</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/densest_subgraph_twice.html\">Densest Subgraph (twice)</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For every finite $1$-inclusion graph.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/tagged_singletons.html\">Tagged Singletons</a></p>\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Every induced subgraph has average degree at most the maximum degree of the original graph.  Maximizing its average degree over subgraphs gives the densest-subgraph parameter.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#haussler1994predicting\">[haussler1994predicting]</a></p></div>\n\n        </div>\n    </div>\n    ", "__label__31": "\n    <div class=\"table-card\" id=\"math-6\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/tagged_singletons.html\" class=\"table-title-link\">Tagged Singletons</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Tagged Singletons</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\text{Tag}\">\n            \\[\\text{Tag}\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>(see <a href=\"bibliography.html#maass1992lower\">[maass1992lower]</a>): Define the function $f(i):=\\min {\\ell: i\\le \\sum_{j=1}^\\ell n2^{-j} + \\lceil \\log n \\rceil + 1}$. The class of tagged singletons is defined as $$\n        \\mathcal{H}:={\\emptyset} \\cup {{n+\\ell\\}:\\ell \\in [\\lceil\\log n\\rceil]} \\cup {{i,n+f(i)\\}:i\\in[n]}\n        $$</p>\n<p>So we have the empty set, singletons on $[n+1, n+\\lceil\\log n\\rceil]$, and then singletons on $[n]$ with a tag such that more than half have the first tag, more than one fourth have the second tag and so on.</p></div>\n\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/recursive_teaching_dimension_tagged_singletons.html'>Recursive Teaching Dimension of Tagged Singletons</a></li><li><a href='values/star_number_tagged_singletons.html'>Star number of Tagged Singletons</a></li><li><a href='values/covc_dimension_tagged_singletons.html'>co-VC dimension of Tagged Singletons</a></li><li><a href='values/maximum_degree_tagged_singletons.html'>Maximum Degree of Tagged Singletons</a></li><li><a href='values/size_tagged_singletons.html'>Size of Tagged Singletons</a></li><li><a href='values/vc_dimension_tagged_singletons.html'>VC Dimension of Tagged Singletons</a></li><li><a href='values/hamming_radius_tagged_singletons.html'>Hamming Radius of Tagged Singletons</a></li><li><a href='values/diameter_tagged_singletons.html'>Diameter of Tagged Singletons</a></li><li><a href='values/oriented_diameter_tagged_singletons.html'>Oriented Diameter of Tagged Singletons</a></li><li><a href='values/effective_range_tagged_singletons.html'>Effective Range of Tagged Singletons</a></li><li><a href='values/threshold_dimension_tagged_singletons.html'>Threshold Dimension of Tagged Singletons</a></li><li><a href='values/littlestone_dimension_tagged_singletons.html'>Littlestone Dimension of Tagged Singletons</a></li><li><a href='values/proper_equivalence_queries_complexity_tagged_singletons.html'>Proper Equivalence Queries Complexity of Tagged Singletons</a></li><li><a href='values/log_size_tagged_singletons.html'>Log Size of Tagged Singletons</a></li><li><a href='values/log_size_ratio_tagged_singletons.html'>Log Size Ratio of Tagged Singletons</a></li><li><a href='values/largest_shattered_set_tagged_singletons.html'>Largest Shattered Set of Tagged Singletons</a></li><li><a href='values/maximum_largest_order_shattered_set_tagged_singletons.html'>Maximum Largest Order Shattered Set of Tagged Singletons</a></li><li><a href='values/projected_vc_radius_tagged_singletons.html'>Projected VC Radius of Tagged Singletons</a></li><li><a href='values/projected_strongly_shattered_dimension_tagged_singletons.html'>Projected Strongly Shattered Dimension of Tagged Singletons</a></li><li><a href='values/maximum_projected_teaching_set_size_tagged_singletons.html'>Maximum Projected Teaching-Set Size of Tagged Singletons</a></li><li><a href='values/projected_maximal_degree_tagged_singletons.html'>Projected Maximal Degree of Tagged Singletons</a></li><li><a href='values/monotonic_minimum_teaching_set_size_tagged_singletons.html'>Monotonic Minimum Teaching-Set Size of Tagged Singletons</a></li><li><a href='values/preferencebased_teaching_dimension_tagged_singletons.html'>Preference-Based Teaching Dimension of Tagged Singletons</a></li><li><a href='values/equivalence_queries_complexity_tagged_singletons.html'>Equivalence Queries Complexity of Tagged Singletons</a></li><li><a href='values/hitting_size_tagged_singletons.html'>Hitting Size of Tagged Singletons</a></li><li><a href='values/interpolation_degree_tagged_singletons.html'>Interpolation Degree of Tagged Singletons</a></li><li><a href='values/effective_vc_radius_tagged_singletons.html'>Effective VC Radius of Tagged Singletons</a></li><li><a href='values/minimum_teaching_set_size_tagged_singletons.html'>Minimum Teaching-Set Size of Tagged Singletons</a></li><li><a href='values/positive_teaching_dimension_tagged_singletons.html'>Positive Teaching Dimension of Tagged Singletons</a></li><li><a href='values/positive_recursive_teaching_dimension_tagged_singletons.html'>Positive Recursive Teaching Dimension of Tagged Singletons</a></li><li><a href='values/positive_noclashing_teaching_dimension_tagged_singletons.html'>Positive No-Clashing Teaching Dimension of Tagged Singletons</a></li><li><a href='values/noclashing_teaching_dimension_tagged_singletons.html'>No-Clashing Teaching Dimension of Tagged Singletons</a></li><li><a href='values/minimum_degree_tagged_singletons.html'>Minimum Degree of Tagged Singletons</a></li><li><a href='values/double_density_or_average_degree_tagged_singletons.html'>Double Density or Average Degree of Tagged Singletons</a></li><li><a href='values/densest_subgraph_twice_tagged_singletons.html'>Densest Subgraph (twice) of Tagged Singletons</a></li><li><a href='values/log_shattering_tagged_singletons.html'>Log Shattering of Tagged Singletons</a></li><li><a href='values/largest_strongly_shattered_set_tagged_singletons.html'>Largest Strongly Shattered Set of Tagged Singletons</a></li><li><a href='values/teaching_dimension_tagged_singletons.html'>Teaching Dimension of Tagged Singletons</a></li><li><a href='values/maximum_teaching_set_size_tagged_singletons.html'>Maximum Teaching-Set Size of Tagged Singletons</a></li><li><a href='values/relative_hitting_size_tagged_singletons.html'>Relative Hitting Size of Tagged Singletons</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/maximum_degree_double_density_or_average_degree.html'>Maximum Degree / Double Density or Average Degree</a></li><li><a href='relationships/maximum_degree_minimum_degree.html'>Maximum Degree / Minimum Degree</a></li><li><a href='relationships/maximum_degree_densest_subgraph_twice.html'>Maximum Degree / Densest Subgraph (twice)</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__32": "\n    <div class=\"table-card\" id=\"math-43\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/distinguishing_range_membership_query_complexity.html\" class=\"table-title-link\">Distinguishing Range / Membership Query Complexity</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Distinguishing Range / Membership Query Complexity</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/distinguishing_range.html\">Distinguishing Range</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/membership_query_complexity.html\">Membership Query Complexity</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>It is sufficient to query all coordinates in the distinguishing range.</p></div>\n\n<p><strong>Status:</strong> </p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Let $S$ be a smallest coordinate set on which the concepts of $\\mathcal{H}$ have pairwise distinct restrictions.  Querying the target on every coordinate in $S$ determines its restriction to $S$, and hence identifies the target.  Therefore $\\mathrm{Q}_m(\\mathcal{H})\\le |S|=\\mathrm{R}(\\mathcal{H})$.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__33": "\n    <div class=\"table-card\" id=\"math-45\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/positive_teaching_dimension_teaching_dimension.html\" class=\"table-title-link\">Positive Teaching Dimension / Teaching Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Positive Teaching Dimension / Teaching Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/positive_teaching_dimension.html\">Positive Teaching Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/teaching_dimension.html\">Teaching Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Positive teaching sets are a restricted class of ordinary teaching sets.  Therefore the minimum teaching-set size for each target, and hence its worst case, cannot decrease under the positivity restriction.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#balbach2008measuring\">[balbach2008measuring]</a> <a href=\"bibliography.html#shinohara1991teachability\">[shinohara1991teachability]</a> <a href=\"bibliography.html#goldman1995complexity\">[goldman1995complexity]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__34": "\n    <div class=\"table-card\" id=\"math-46\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/positive_noclashing_teaching_dimension_noclashing_teaching_dimension.html\" class=\"table-title-link\">Positive No-Clashing Teaching Dimension / No-Clashing Teaching Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Positive No-Clashing Teaching Dimension / No-Clashing Teaching Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/positive_noclashing_teaching_dimension.html\">Positive No-Clashing Teaching Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/noclashing_teaching_dimension.html\">No-Clashing Teaching Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>A positive non-clashing teacher mapping is a non-clashing teacher mapping with an additional restriction on its samples.  Minimizing over the restricted class cannot lower the optimum.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#KSZ2019\">[KSZ2019]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__35": "\n    <div class=\"table-card\" id=\"math-47\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/positive_recursive_teaching_dimension_recursive_teaching_dimension.html\" class=\"table-title-link\">Positive Recursive Teaching Dimension / Recursive Teaching Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Positive Recursive Teaching Dimension / Recursive Teaching Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/positive_recursive_teaching_dimension.html\">Positive Recursive Teaching Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/recursive_teaching_dimension.html\">Recursive Teaching Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>The positive recursive model requires every teaching sample used at every recursive stage to be positive.  It is therefore a restriction of the ordinary recursive model, so its optimum cannot be smaller.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#fallat2023batch\">[fallat2023batch]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__36": "\n    <div class=\"table-card\" id=\"math-48\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/positive_teaching_dimension_positive_recursive_teaching_dimension.html\" class=\"table-title-link\">Positive Teaching Dimension / Positive Recursive Teaching Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Positive Teaching Dimension / Positive Recursive Teaching Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/positive_teaching_dimension.html\">Positive Teaching Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/positive_recursive_teaching_dimension.html\">Positive Recursive Teaching Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>A positive teacher that distinguishes every target in the full class can be used at the first recursive stage.  Recursive removal can only reduce the set of competitors, so the positive recursive optimum is no larger.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#fallat2023batch\">[fallat2023batch]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__37": "\n    <div class=\"table-card\" id=\"math-49\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/positive_recursive_teaching_dimension_positive_noclashing_teaching_dimension.html\" class=\"table-title-link\">Positive Recursive Teaching Dimension / Positive No-Clashing Teaching Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Positive Recursive Teaching Dimension / Positive No-Clashing Teaching Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/positive_recursive_teaching_dimension.html\">Positive Recursive Teaching Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/positive_noclashing_teaching_dimension.html\">Positive No-Clashing Teaching Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>A positive recursive teaching plan is non-clashing: for two concepts, the one removed first has a positive teaching set that distinguishes it from the later concept, which was still present at that stage.  Thus its positive recursive plan is an admissible positive non-clashing mapping.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#fallat2023batch\">[fallat2023batch]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__38": "\n    <div class=\"table-card\" id=\"math-50\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/effective_range_distinguishing_range.html\" class=\"table-title-link\">Effective Range / Distinguishing Range</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Effective Range / Distinguishing Range</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/effective_range.html\">Effective Range</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/distinguishing_range.html\">Distinguishing Range</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Every coordinate needed to distinguish two concepts belongs to their effective range.</p></div>\n\n<p><strong>Status:</strong> </p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>A coordinate outside the effective range has the same value in every concept, so deleting it cannot merge two restrictions.  A minimum distinguishing coordinate set may therefore be chosen inside the effective range, giving $\\mathrm{R}(\\mathcal{H})\\le\\mathrm{E}(\\mathcal{H})$.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__39": "\n    <div class=\"table-card\" id=\"math-51\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/positive_noclashing_teaching_dimension_maximum_positive_degree.html\" class=\"table-title-link\">Positive No-Clashing Teaching Dimension / Maximum Positive Degree</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Positive No-Clashing Teaching Dimension / Maximum Positive Degree</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/positive_noclashing_teaching_dimension.html\">Positive No-Clashing Teaching Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/maximum_positive_degree.html\">Maximum Positive Degree</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/trivial_concepts.html\">Trivial concepts</a></p>\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>For each concept, every smaller neighbour differs on a positive-labelled instance that must occur in any positive non-clashing teaching set.  Thus its teaching set has size at least its dominance; maximize over the concepts.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#KSZ2019\">[KSZ2019]</a></p></div>\n\n        </div>\n    </div>\n    ", "__label__39": "\n    <div class=\"table-card\" id=\"math-1\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/trivial_concepts.html\" class=\"table-title-link\">Trivial concepts</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Trivial concepts</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\{\\emptyset, [n]\\}\">\n            \\[\\{\\emptyset, [n]\\}\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Class containing the empty and the full concept.</p></div>\n\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/effective_range_trivial_concepts.html'>Effective Range of Trivial concepts</a></li><li><a href='values/log_shattering_trivial_concepts.htm  href='values/positive_recursive_teaching_dimension_trivial_concepts.html'>Positive Recursive Teaching Dimension of Trivial Concepts</a></li><li><a href='values/labeled_sample_compression_trivial_concepts.html'>Labeled Sample Compression of Trivial concepts</a></li><li><a href='values/proper_labeled_sample_compression_trivial_concepts.html'>Proper Labeled Sample Compression of Trivial concepts</a></li><li><a href='values/stable_labeled_sample_compression_trivial_concepts.html'>Stable Labeled Sample Compression of Trivial concepts</a></li><li><a href='values/proper_stable_labeled_sample_compression_trivial_concepts.html'>Proper Stable Labeled Sample Compression of Trivial concepts</a></li><li><a href='values/majority_complexity_trivial_concepts.html'>Majority Complexity of Trivial concepts</a></li><li><a href='values/random_equivalence_queries_complexity_trivial_concepts.html'>Random Equivalence Queries Complexity of Trivial concepts</a></li><li><a href='values/random_proper_equivalence_queries_complexity_trivial_concepts.html'>Random Proper Equivalence Queries Complexity of Trivial concepts</a></li><li><a href='values/unlabeled_sample_compression_trivial_concepts.html'>Unlabeled Sample Compression of Trivial concepts</a></li><li><a href='values/proper_unlabeled_sample_compression_trivial_concepts.html'>Proper Unlabeled Sample Compression of Trivial concepts</a></li><li><a href='values/stable_unlabeled_complexity_trivial_concepts.html'>Stable Unlabeled Complexity of Trivial concepts</a></li><li><a href='values/proper_stable_sample_compression_trivial_concepts.html'>Proper Stable Sample Compression of Trivial concepts</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/effective_range_yang_dimension.html'>Effective Range / Yang dimension</a></li><li><a href='relationships/proper_stable_labeled_sample_compression_covc_dimension.html'>Proper Stable Labeled Sample Compression / co-VC dimension</a></li><li><a href='relationships/log_shattering_log_size.html'>Log Shattering / Log Size</a></li><li><a href='relationships/positive_noclashing_teaching_dimension_maximum_positive_degree.html'>Positive No-Clashing Teaching Dimension / Maximum Positive Degree</a></li><li><a href='relationships/noclashing_teaching_dimension_densest_subgraph_twice.html'>No-Clashing Teaching Dimension / Densest Subgraph (twice)</a></li><li><a href='relationships/noclashing_teaching_dimension_double_density_or_average_degree.html'>No-Clashing Teaching Dimension / Double Density or Average Degree</a></li><li><a href='relationships/oriented_diameter_threshold_dimension.html'>Oriented Diameter / Threshold Dimension</a></li><li><a href='relationships/diameter_path_dimension.html'>Diameter / Path Dimension</a></li><li><a href='relationships/effective_range_projected_membership_queries_complexity.html'>Effective Range / Projected Membership Queries Complexity</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__40": "\n    <div class=\"table-card\" id=\"math-52\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/littlestone_dimension_stable_unlabeled_complexity.html\" class=\"table-title-link\">Littlestone Dimension / Stable Unlabeled Complexity</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Littlestone Dimension / Stable Unlabeled Complexity</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/littlestone_dimension.html\">Littlestone Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/stable_unlabeled_complexity.html\">Stable Unlabeled Complexity</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>A conservative optimal online learner yields stable compression from its mistake examples.</p></div>\n\n<p><strong>Status:</strong> </p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Use a conservative online learner with mistake bound $\\mathrm L(\\mathcal H)$, such as the standard optimal algorithm, and cycle it through a realizable sample until a full pass is mistake-free.  Retain only the examples on which it made a mistake.  There are at most $\\mathrm L(\\mathcal H)$; their labels are recoverable from the learner's successive mistaken predictions, and removing any unretained example leaves the final predictor unchanged.  This gives a stable unlabeled compression scheme of that size.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#hanneke2021stable\">[hanneke2021stable]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__41": "\n    <div class=\"table-card\" id=\"math-53\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/worst_mistakes_vc_dimension.html\" class=\"table-title-link\">Worst Mistakes / VC Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Worst Mistakes / VC Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/worst_mistakes.html\">Worst Mistakes</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/vc_dimension.html\">VC Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>The worst-case online mistake bound dominates VC dimension.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#ben1997online\">[ben1997online]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__42": "\n    <div class=\"table-card\" id=\"math-54\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/noclashing_teaching_dimension_densest_subgraph_twice.html\" class=\"table-title-link\">No-Clashing Teaching Dimension / Densest Subgraph (twice)</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>No-Clashing Teaching Dimension / Densest Subgraph (twice)</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/noclashing_teaching_dimension.html\">No-Clashing Teaching Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/densest_subgraph_twice.html\">Densest Subgraph (twice)</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/trivial_concepts.html\">Trivial concepts</a></p>\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Apply the average-degree lower bound to every subfamily.  No-clashing teaching dimension is monotone under taking a subfamily, and the maximum average degree over those subfamilies is the densest-subgraph parameter.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#KSZ2019\">[KSZ2019]</a></p></div>\n\n        </div>\n    </div>\n    ", "__label__42": "\n    <div class=\"table-card\" id=\"math-1\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/trivial_concepts.html\" class=\"table-title-link\">Trivial concepts</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Trivial concepts</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\{\\emptyset, [n]\\}\">\n            \\[\\{\\emptyset, [n]\\}\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Class containing the empty and the full concept.</p></div>\n\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/effective_range_trivial_concepts.html'>Effective Range of Tr _concepts.html'>Positive Teaching Dimension of Trivial Concepts</a></li><li><a href='values/positive_recursive_teaching_dimension_trivial_concepts.html'>Positive Recursive Teaching Dimension of Trivial Concepts</a></li><li><a href='values/labeled_sample_compression_trivial_concepts.html'>Labeled Sample Compression of Trivial concepts</a></li><li><a href='values/proper_labeled_sample_compression_trivial_concepts.html'>Proper Labeled Sample Compression of Trivial concepts</a></li><li><a href='values/stable_labeled_sample_compression_trivial_concepts.html'>Stable Labeled Sample Compression of Trivial concepts</a></li><li><a href='values/proper_stable_labeled_sample_compression_trivial_concepts.html'>Proper Stable Labeled Sample Compression of Trivial concepts</a></li><li><a href='values/majority_complexity_trivial_concepts.html'>Majority Complexity of Trivial concepts</a></li><li><a href='values/random_equivalence_queries_complexity_trivial_concepts.html'>Random Equivalence Queries Complexity of Trivial concepts</a></li><li><a href='values/random_proper_equivalence_queries_complexity_trivial_concepts.html'>Random Proper Equivalence Queries Complexity of Trivial concepts</a></li><li><a href='values/unlabeled_sample_compression_trivial_concepts.html'>Unlabeled Sample Compression of Trivial concepts</a></li><li><a href='values/proper_unlabeled_sample_compression_trivial_concepts.html'>Proper Unlabeled Sample Compression of Trivial concepts</a></li><li><a href='values/stable_unlabeled_complexity_trivial_concepts.html'>Stable Unlabeled Complexity of Trivial concepts</a></li><li><a href='values/proper_stable_sample_compression_trivial_concepts.html'>Proper Stable Sample Compression of Trivial concepts</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/effective_range_yang_dimension.html'>Effective Range / Yang dimension</a></li><li><a href='relationships/proper_stable_labeled_sample_compression_covc_dimension.html'>Proper Stable Labeled Sample Compression / co-VC dimension</a></li><li><a href='relationships/log_shattering_log_size.html'>Log Shattering / Log Size</a></li><li><a href='relationships/positive_noclashing_teaching_dimension_maximum_positive_degree.html'>Positive No-Clashing Teaching Dimension / Maximum Positive Degree</a></li><li><a href='relationships/noclashing_teaching_dimension_densest_subgraph_twice.html'>No-Clashing Teaching Dimension / Densest Subgraph (twice)</a></li><li><a href='relationships/noclashing_teaching_dimension_double_density_or_average_degree.html'>No-Clashing Teaching Dimension / Double Density or Average Degree</a></li><li><a href='relationships/oriented_diameter_threshold_dimension.html'>Oriented Diameter / Threshold Dimension</a></li><li><a href='relationships/diameter_path_dimension.html'>Diameter / Path Dimension</a></li><li><a href='relationships/effective_range_projected_membership_queries_complexity.html'>Effective Range / Projected Membership Queries Complexity</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__43": "\n    <div class=\"table-card\" id=\"math-55\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/degeneracy_largest_strongly_shattered_set.html\" class=\"table-title-link\">Degeneracy / Largest Strongly Shattered Set</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Degeneracy / Largest Strongly Shattered Set</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/degeneracy.html\">Degeneracy</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/largest_strongly_shattered_set.html\">Largest Strongly Shattered Set</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Every contained cube gives an induced subgraph of matching minimum degree.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>A strongly shattered set of size $d$ supplies a contained $d$-cube in the $1$-inclusion graph.  That cube is an induced subgraph of minimum degree $d$, so the graph degeneracy is at least $d$.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__44": "\n    <div class=\"table-card\" id=\"math-56\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/maximum_positive_degree_largest_strongly_shattered_set.html\" class=\"table-title-link\">Maximum Positive Degree / Largest Strongly Shattered Set</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Maximum Positive Degree / Largest Strongly Shattered Set</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/maximum_positive_degree.html\">Maximum Positive Degree</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/largest_strongly_shattered_set.html\">Largest Strongly Shattered Set</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge cP_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>A top vertex of a contained cube has one lower neighbour in each cube coordinate.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>In a contained $d$-cube, its top vertex has $d$ smaller $1$-inclusion neighbours.  Hence maximum positive degree is at least the largest strongly shattered-set size.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__45": "\n    <div class=\"table-card\" id=\"math-57\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/littlestone_dimension_2littlestone_dimension.html\" class=\"table-title-link\">2-Littlestone Dimension / Littlestone Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>2-Littlestone Dimension / Littlestone Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/2littlestone_dimension.html\">2-Littlestone Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/littlestone_dimension.html\">Littlestone Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Every realizable branch is also 2-realizable.</p></div>\n\n<p><strong>Status:</strong> </p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>A tree shattered in the ordinary (realizable) sense has every branch consistent with a hypothesis in the class, hence with zero disagreements.  It is therefore 2-shattered, and taking the supremum over eligible trees gives $\\mathrm{L}_2(\\mathcal{H})\\ge\\mathrm{L}(\\mathcal{H})$.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#filmus2023randomized\">[filmus2023randomized]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__46": "\n    <div class=\"table-card\" id=\"math-58\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/2littlestone_dimension_3littlestone_dimension.html\" class=\"table-title-link\">3-Littlestone Dimension / 2-Littlestone Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>3-Littlestone Dimension / 2-Littlestone Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/3littlestone_dimension.html\">3-Littlestone Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/2littlestone_dimension.html\">2-Littlestone Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Every 2-realizable branch is also 3-realizable.</p></div>\n\n<p><strong>Status:</strong> </p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Every 2-shattered tree is 3-shattered, since a branch having at most two disagreements also has at most three.  Thus $\\mathrm{L}_3(\\mathcal{H})\\ge\\mathrm{L}_2(\\mathcal{H})$.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#filmus2023randomized\">[filmus2023randomized]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__47": "\n    <div class=\"table-card\" id=\"math-59\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/littlestone_dimension_random_equivalence_queries_complexity.html\" class=\"table-title-link\">Littlestone Dimension / Random Equivalence Queries Complexity</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Littlestone Dimension / Random Equivalence Queries Complexity</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/littlestone_dimension.html\">Littlestone Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/random_equivalence_queries_complexity.html\">Random Equivalence Queries Complexity</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Random counterexamples are a restriction of the adversarial equivalence-query model.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>An equivalence-query strategy that succeeds against every permissible counterexample also succeeds when the counterexample is selected randomly.  Thus $\\mathrm{Q}<em _mathrm_eq=\"\\mathrm{eq\">{\\mathrm{req}}(\\mathcal H)\\le\\mathrm{Q}</em>(\\mathcal H)$.}}(\\mathcal H)=\\mathrm{L</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#littlestone1988learning\">[littlestone1988learning]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__48": "\n    <div class=\"table-card\" id=\"math-62\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/vc_dimension_projected_double_density_or_projected_average_degree.html\" class=\"table-title-link\">VC Dimension / Projected Double Density or Projected Average Degree</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>VC Dimension / Projected Double Density or Projected Average Degree</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/vc_dimension.html\">VC Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/projected_double_density_or_projected_average_degree.html\">Projected Double Density or Projected Average Degree</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge cP_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Down Shifting and Monotonicity</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>For every projection, the Haussler--Littlestone--Warmuth density lemma gives $|E|/|V|\\le\\mathrm{VC}(\\mathcal H)$. Since this parameter is twice that density (the average degree), it is at most $2\\,\\mathrm{VC}(\\mathcal H)$. Thus $\\mathrm{VC}(\\mathcal H)\\ge\\tfrac12\\,\\mathrm{dens}^p(\\mathcal H)$.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#haussler1988predicting\">[haussler1988predicting]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__49": "\n    <div class=\"table-card\" id=\"math-64\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/projected_double_density_or_projected_average_degree_projected_minimum_degree.html\" class=\"table-title-link\">Projected Double Density or Projected Average Degree / Projected Minimum Degree</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Projected Double Density or Projected Average Degree / Projected Minimum Degree</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/projected_double_density_or_projected_average_degree.html\">Projected Double Density or Projected Average Degree</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/projected_minimum_degree.html\">Projected Minimum Degree</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>For every projection, average degree is at least minimum degree.  Taking maxima over projections preserves the inequality.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__50": "\n    <div class=\"table-card\" id=\"math-66\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/projected_maximal_degree_projected_double_density_or_projected_average_degree.html\" class=\"table-title-link\">Projected Maximal Degree / Projected Double Density or Projected Average Degree</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Projected Maximal Degree / Projected Double Density or Projected Average Degree</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/projected_maximal_degree.html\">Projected Maximal Degree</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/projected_double_density_or_projected_average_degree.html\">Projected Double Density or Projected Average Degree</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>For every projection, its maximum degree is at least its average degree.  Maximizing both quantities over projections preserves this inequality.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__51": "\n    <div class=\"table-card\" id=\"math-67\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/noclashing_teaching_dimension_double_density_or_average_degree.html\" class=\"table-title-link\">No-Clashing Teaching Dimension / Double Density or Average Degree</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>No-Clashing Teaching Dimension / Double Density or Average Degree</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/noclashing_teaching_dimension.html\">No-Clashing Teaching Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/double_density_or_average_degree.html\">Double Density or Average Degree</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge cP_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes, the stronger bound is $\\mathrm{NCTD} \\ge \\lceil \\mathrm{dens}/2 \\rceil$.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/trivial_concepts.html\">Trivial concepts</a></p>\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>For every edge of the $1$-inclusion graph, a non-clashing teacher mapping must use the differing instance in at least one of the two endpoint teaching sets.  Averaging over concepts gives a teaching set of size at least half the average degree.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#KSZ2019\">[KSZ2019]</a></p></div>\n\n        </div>\n    </div>\n    ", "__label__51": "\n    <div class=\"table-card\" id=\"math-1\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/trivial_concepts.html\" class=\"table-title-link\">Trivial concepts</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Trivial concepts</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\{\\emptyset, [n]\\}\">\n            \\[\\{\\emptyset, [n]\\}\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Class containing the empty and the full concept.</p></div>\n\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/effective_range_trivial_concepts.html'>Effective Range of Trivial concepts</a></li><li><a href='values/log_shattering_trivial_concepts.html'>Log Shattering of Trivial concepts</a></li><li><a href='values/membership_and_proper_equivalence_queries_complexity_trivial_concepts.html'>Membership and Proper Equivalence Queries Complexity of Trivial concepts</a></li><li><a href='values/membership_query_complexity_trivial_concepts.html'>Membership Query Complexity of Trivial concepts</a></li><li><a href='values/projected_membership_queries_complexity_trivial_concepts.html'>Projected Membership Queries Complexity of Trivial concepts</a></li><li><a href='values/recursive_teaching_dimension_trivial_concepts.html'>Recursive Teaching Dimension of Trivial concepts</a></li><li><a href='values/teaching_dimension_trivial_concepts.html'>Teaching Dimension of Trivial concepts</a></li><li><a href='values/star_number_trivial_concepts.html'>Star number of Trivial concepts</a></li><li><a href='values/covc_dimension_trivial_concepts.html'>co-VC dimension of Trivial concepts</a></li><li><a href='values/monotone_recursive_teaching_dimension_trivial_concepts.html'>Projected Recursive Teaching Dimension of Trivial concepts</a></li><li><a href='values/minimum_teaching_set_size_trivial_concepts.html'>Minimum Teaching Set Size of Trivial concepts</a></li><li><a href='values/membership_and_equivalence_queries_complexity_trivial_concepts.html'>Membership and Equivalence Queries Complexity of Trivial concepts</a></li><li><a href='values/maximum_degree_trivial_concepts.html'>Maximum Degree of Trivial concepts</a></li><li><a href='values/order_sample_com s</a></li><li><a href='values/minimum_largest_order_shattered_set_trivial_concepts.html'>Minimum Largest Order Shattered Set of Trivial Concepts</a></li><li><a href='values/maximum_projected_teaching_set_size_trivial_concepts.html'>Maximum Projected Teaching-Set Size of Trivial Concepts</a></li><li><a href='values/monotonic_minimum_teaching_set_size_trivial_concepts.html'>Monotonic Minimum Teaching-Set Size of Trivial Concepts</a></li><li><a href='values/preferencebased_teaching_dimension_trivial_concepts.html'>Preference-Based Teaching Dimension of Trivial Concepts</a></li><li><a href='values/minimum_projected_teaching_set_size_trivial_concepts.html'>Minimum Projected Teaching-Set Size of Trivial Concepts</a></li><li><a href='values/monotonic_projected_minimum_teaching_set_size_trivial_concepts.html'>Monotonic Projected Minimum Teaching-Set Size of Trivial Concepts</a></li><li><a href='values/equivalence_queries_complexity_trivial_concepts.html'>Equivalence Queries Complexity of Trivial Concepts</a></li><li><a href='values/hitting_size_trivial_concepts.html'>Hitting Size of Trivial Concepts</a></li><li><a href='values/2littlestone_dimension_trivial_concepts.html'>2-Littlestone Dimension of Trivial Concepts</a></li><li><a href='values/3littlestone_dimension_trivial_concepts.html'>3-Littlestone Dimension of Trivial Concepts</a></li><li><a href='values/klittlestone_dimension_kge3_trivial_concepts.html'>$k$-Littlestone Dimension of Trivial Concepts</a></li><li><a href='values/best_mistakes_trivial_concepts.html'>Best Mistakes of Trivial Concepts</a></li><li><a href='values/worst_mistakes_trivial_concepts.html'>Worst Mistakes of Trivial Concepts</a></li><li><a href='values/selfdirected_queries_complexity_trivial_concepts.html'>Self-Directed Queries Complexity of Trivial Concepts</a></li><li><a href='values/occasional_onesided_getback_trivial_concepts.html'>Occasional One-Sided Getback of Trivial Concepts</a></li><li><a href='values/distinguishing_range_trivial_concepts.
