    <script>
    const nodeCards = {"#parameters/1": "<div class=\"table-card\"><h3><a href=\"parameters/effective_range.html\" class=\"table-title-link\">Effective Range</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"$\\mathrm{E}$\">\n            $\\mathrm{E}$\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The <strong>effective range</strong> $E(\\mathcal{H})$ of a family $\\mathcal{H}$ is the number of elements that can be distinguished by members of $\\mathcal{H}$: $$ E(\\mathcal{H}):= |{x:x\\in\\mathcal{X|,\\, \\exists h_1,h_2\\in\\mathcal{H},\\, x\\in h_1 \\Delta h_2}} $$</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/effective_range_yang_dimension.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{Y}$</a></li><li><a href=\"relationships/log_shattering_effective_range.html\" class=\"relationship-statement\">$\\log \\mathrm{sh} \\ge c\\log \\mathrm{E}$</a></li><li><a href=\"relationships/effective_range_distinguishing_range.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{R}$</a></li><li><a href=\"relationships/effective_range_vc_dimension.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{VC}$</a></li><li><a href=\"relationships/effective_range_diameter.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{D}$</a></li><li><a href=\"relationships/effective_range_hamming_radius.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{B}$</a></li><li><a href=\"relationships/effective_range_log_shattering.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\log \\mathrm{sh}$</a></li><li><a href=\"relationships/effective_range_projected_membership_queries_complexity.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{Q}_{\\mathrm{m}}^p$</a></li></ul></p></div></div>", "#parameters/2": "<div class=\"table-card\"><h3><a href=\"parameters/size.html\" class=\"table-title-link\">Size</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"$\\mathrm{H}$\">\n            $\\mathrm{H}$\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The <strong>size</strong> of a family $\\mathcal{H}$ is simply the  cardinality, $$  |\\mathcal{H|} $$</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/log_size_size.html\" class=\"relationship-statement\">$\\log \\mathrm{H} \\ge c\\log \\mathrm{H}$</a></li><li><a href=\"relationships/size_vc_dimension.html\" class=\"relationship-statement\">$\\mathrm{H} \\ge \\mathrm{VC}$</a></li><li><a href=\"relationships/size_path_dimension.html\" class=\"relationship-statement\">$\\mathrm{H} \\ge \\mathrm{P}$</a></li><li><a href=\"relationships/size_littlestone_dimension.html\" class=\"relationship-statement\">$\\mathrm{H} \\ge \\mathrm{L}$</a></li><li><a href=\"relationships/size_yang_dimension.html\" class=\"relationship-statement\">$\\mathrm{H} \\ge \\mathrm{Y}$</a></li><li><a href=\"relationships/size_proper_equivalence_queries_complexity.html\" class=\"relationship-statement\">$\\mathrm{H} \\ge \\mathrm{Q}_{\\mathrm{peq}}$</a></li><li><a href=\"relationships/size_projected_membership_queries_complexity.html\" class=\"relationship-statement\">$\\mathrm{H} \\ge \\mathrm{Q}_{\\mathrm{m}}^p$</a></li></ul></p></div></div>", "#parameters/3": "<div class=\"table-card\"><h3><a href=\"parameters/oriented_diameter.html\" class=\"table-title-link\">Oriented Diameter</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"$\\mathrm{D}^+$\">\n            $\\mathrm{D}^+$\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The <strong>oriented diameter</strong> $\\mathrm{D}^+(\\mathcal{H})$ of a family $\\mathcal{H}$ is defined as $$ \\mathrm{D}^+(\\mathcal{H}):= \\max{|S|: {\\emptyset, S}\\subset \\mathcal{H}_{|S}} $$</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/oriented_diameter_threshold_dimension.html\" class=\"relationship-statement\">$\\mathrm{D}^+ \\ge \\mathrm{T}$</a></li><li><a href=\"relationships/diameter_oriented_diameter.html\" class=\"relationship-statement\">$\\mathrm{D} \\ge \\mathrm{D}^+$ <span class=\"relationship-variant\">(relative)</span></a></li><li><a href=\"relationships/oriented_diameter_diameter.html\" class=\"relationship-statement\">$\\mathrm{D}^+ \\ge c\\mathrm{D}$</a></li><li><a href=\"relationships/hamming_radius_oriented_diameter.html\" class=\"relationship-statement\">$\\mathrm{B} \\ge c\\mathrm{D}^+$</a></li><li><a href=\"relationships/oriented_diameter_hamming_radius.html\" class=\"relationship-statement\">$\\mathrm{D}^+ \\ge c\\mathrm{B}$</a></li></ul></p></div></div>", "#parameters/4": "<div class=\"table-card\"><h3><a href=\"parameters/diameter.html\" class=\"table-title-link\">Diameter</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"$\\mathrm{D}$\">\n            $\\mathrm{D}$\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The <strong>diameter</strong> $D(\\mathcal{H})$ of a family $\\mathcal{H}$ is the largest distance between two elements of the family, i.e. $$ D(\\mathcal{H}):= \\max_{h_1,h_2\\in\\mathcal{H}} |h_1\\Delta h_2| $$</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/diameter_path_dimension.html\" class=\"relationship-statement\">$\\mathrm{D} \\ge \\mathrm{P}$</a></li><li><a href=\"relationships/effective_range_diameter.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{D}$</a></li><li><a href=\"relationships/diameter_oriented_diameter.html\" class=\"relationship-statement\">$\\mathrm{D} \\ge \\mathrm{D}^+$ <span class=\"relationship-variant\">(relative)</span></a></li><li><a href=\"relationships/oriented_diameter_diameter.html\" class=\"relationship-statement\">$\\mathrm{D}^+ \\ge c\\mathrm{D}$</a></li><li><a href=\"relationships/hamming_radius_diameter.html\" class=\"relationship-statement\">$\\mathrm{B} \\ge c\\mathrm{D}$</a></li><li><a href=\"relationships/diameter_hamming_radius.html\" class=\"relationship-statement\">$\\mathrm{D} \\ge \\mathrm{B}$</a></li></ul></p></div></div>", "#parameters/5": "<div class=\"table-card\"><h3><a href=\"parameters/hamming_radius.html\" class=\"table-title-link\">Hamming Radius</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"$\\mathrm{B}$\">\n            $\\mathrm{B}$\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The <strong>Hamming Radius</strong> $B(\\mathcal{H})$ of a family $\\mathcal{H}$ is the smallest radius of an enclosing Hamming ball, defined as $$ B(\\mathcal{H}):= \\min{d: \\exists T\\subset \\mathcal{X},\\, \\forall h\\in \\mathcal{H},\\, |h\\Delta T|\\le d} $$</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/effective_range_hamming_radius.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{B}$</a></li><li><a href=\"relationships/hamming_radius_oriented_diameter.html\" class=\"relationship-statement\">$\\mathrm{B} \\ge c\\mathrm{D}^+$</a></li><li><a href=\"relationships/hamming_radius_diameter.html\" class=\"relationship-statement\">$\\mathrm{B} \\ge c\\mathrm{D}$</a></li><li><a href=\"relationships/diameter_hamming_radius.html\" class=\"relationship-statement\">$\\mathrm{D} \\ge \\mathrm{B}$</a></li><li><a href=\"relationships/oriented_diameter_hamming_radius.html\" class=\"relationship-statement\">$\\mathrm{D}^+ \\ge c\\mathrm{B}$</a></li></ul></p></div></div>", "#parameters/6": "<div class=\"table-card\"><h3><a href=\"parameters/threshold_dimension.html\" class=\"table-title-link\">Threshold Dimension</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"$\\mathrm{T}$\">\n            $\\mathrm{T}$\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The <strong>Threshold dimension</strong> of a family $\\mathcal{H}$, denoted by $T(\\mathcal{H})$, is the largest integer $d$ such that there exists a set $S\\subset \\mathcal{X}$, of size $d$ such that $\\mathcal{H}_{|S}$ contains thresholds, i.e. there is an ordering $x_1,\\ldots,x_d$ of the elements of $S$ such that $$ \\forall 0\\le k\\le d,\\, {x_1,\\ldots,x_k} \\in \\mathcal{H}_{|S}\\,. $$</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/threshold_dimension_vc_dimension.html\" class=\"relationship-statement\">$\\mathrm{T} \\ge \\mathrm{VC}$</a></li><li><a href=\"relationships/threshold_dimension_path_dimension.html\" class=\"relationship-statement\">$\\mathrm{T} \\ge c\\mathrm{P}$</a></li><li><a href=\"relationships/path_dimension_threshold_dimension.html\" class=\"relationship-statement\">$\\mathrm{P} \\ge \\mathrm{T}$ <span class=\"relationship-variant\">(relative)</span></a></li><li><a href=\"relationships/oriented_diameter_threshold_dimension.html\" class=\"relationship-statement\">$\\mathrm{D}^+ \\ge \\mathrm{T}$</a></li><li><a href=\"relationships/threshold_dimension_littlestone_dimension.html\" class=\"relationship-statement\">$\\mathrm{T} \\ge c\\log \\mathrm{L}$</a></li></ul></p></div></div>", "#parameters/7": "<div class=\"table-card\"><h3><a href=\"parameters/path_dimension.html\" class=\"table-title-link\">Path Dimension</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"$\\mathrm{P}$\">\n            $\\mathrm{P}$\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The <strong>Path dimension</strong> of a family $\\mathcal{H}$, denoted by $P(\\mathcal{H})$, is the largest integer $d$ such that there exists a set $S\\subset \\mathcal{X}$, of size $d$ such that $\\mathcal{H}_{|S}$ contains a full path, i.e. there is an ordering $x_1,\\ldots,x_d$ of the elements of $S$ and a subset $T\\subset S$ such that $$ \\forall 0\\le k\\le d,\\, T\\Delta {x_1,\\ldots,x_k} \\in \\mathcal{H}_{|S}\\,. $$</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/size_path_dimension.html\" class=\"relationship-statement\">$\\mathrm{H} \\ge \\mathrm{P}$</a></li><li><a href=\"relationships/threshold_dimension_path_dimension.html\" class=\"relationship-statement\">$\\mathrm{T} \\ge c\\mathrm{P}$</a></li><li><a href=\"relationships/path_dimension_threshold_dimension.html\" class=\"relationship-statement\">$\\mathrm{P} \\ge \\mathrm{T}$ <span class=\"relationship-variant\">(relative)</span></a></li><li><a href=\"relationships/diameter_path_dimension.html\" class=\"relationship-statement\">$\\mathrm{D} \\ge \\mathrm{P}$</a></li></ul></p></div></div>", "#parameters/8": "<div class=\"table-card\"><h3><a href=\"parameters/densest_subgraph_twice.html\" class=\"table-title-link\">Densest Subgraph (twice)</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"$\\mathrm{dens}^*$\">\n            $\\mathrm{dens}^*$\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The <strong>densest subgraph dimension</strong> of a concept class is equal to twice the density of the densest subgraph (a.k.a. <strong>subgraph density</strong>) of its $1$-inclusion graph.</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/densest_subgraph_twice_degeneracy.html\" class=\"relationship-statement\">$\\mathrm{dens}^* \\ge \\mathrm{d}^*_{\\min}$</a></li><li><a href=\"relationships/maximum_degree_densest_subgraph_twice.html\" class=\"relationship-statement\">$\\mathrm{d}_{\\max} \\ge \\mathrm{dens}^*$</a></li><li><a href=\"relationships/noclashing_teaching_dimension_densest_subgraph_twice.html\" class=\"relationship-statement\">$\\mathrm{NCTD} \\ge \\mathrm{dens}^*$</a></li><li><a href=\"relationships/vc_dimension_densest_subgraph_twice.html\" class=\"relationship-statement\">$\\mathrm{VC} \\ge \\mathrm{dens}^*$</a></li><li><a href=\"relationships/densest_subgraph_twice_double_density_or_average_degree.html\" class=\"relationship-statement\">$\\mathrm{dens}^* \\ge \\mathrm{dens}$ <span class=\"relationship-variant\">(monotonic)</span></a></li><li><a href=\"relationships/vc_dimension_densest_subgraph_twice.html\" class=\"relationship-statement\">$\\mathrm{VC} \\ge \\mathrm{dens}^*$</a></li></ul></p></div></div>", "#parameters/9": "<div class=\"table-card\"><h3><a href=\"parameters/double_density_or_average_degree.html\" class=\"table-title-link\">Double Density or Average Degree</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"$\\mathrm{dens}$\">\n            $\\mathrm{dens}$\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The <strong>double-density</strong> of a concept class is defined as twice the density of its $1$-inclusion graph, i.e twice the ratio of edges to vertices, or equivalently the average degree.</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/maximum_degree_double_density_or_average_degree.html\" class=\"relationship-statement\">$\\mathrm{d}_{\\max} \\ge \\mathrm{dens}$</a></li><li><a href=\"relationships/projected_double_density_or_projected_average_degree_double_density_or_average_degree.html\" class=\"relationship-statement\">$\\mathrm{dens}^p \\ge \\mathrm{dens}$ <span class=\"relationship-variant\">(p_monotonic)</span></a></li><li><a href=\"relationships/noclashing_teaching_dimension_double_density_or_average_degree.html\" class=\"relationship-statement\">$\\mathrm{NCTD} \\ge c\\mathrm{dens}$</a></li><li><a href=\"relationships/densest_subgraph_twice_double_density_or_average_degree.html\" class=\"relationship-statement\">$\\mathrm{dens}^* \\ge \\mathrm{dens}$ <span class=\"relationship-variant\">(monotonic)</span></a></li><li><a href=\"relationships/double_density_or_average_degree_minimum_degree.html\" class=\"relationship-statement\">$\\mathrm{dens} \\ge \\mathrm{d}_{\\min}$</a></li></ul></p></div></div>", "#parameters/10": "<div class=\"table-card\"><h3><a href=\"parameters/minimum_degree.html\" class=\"table-title-link\">Minimum Degree</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"$\\mathrm{d}_{\\min}$\">\n            $\\mathrm{d}_{\\min}$\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The <strong>minimum degree</strong> of a concept class is defined as the minimum degree of its $1$-inclusion graph.</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/degeneracy_minimum_degree.html\" class=\"relationship-statement\">$\\mathrm{d}^*_{\\min} \\ge \\mathrm{d}_{\\min}$ <span class=\"relationship-variant\">(monotonic)</span></a></li><li><a href=\"relationships/maximum_degree_minimum_degree.html\" class=\"relationship-statement\">$\\mathrm{d}_{\\max} \\ge \\mathrm{d}_{\\min}$</a></li><li><a href=\"relationships/projected_minimum_degree_minimum_degree.html\" class=\"relationship-statement\">$\\mathrm{d}^p_{\\min} \\ge \\mathrm{d}_{\\min}$ <span class=\"relationship-variant\">(p_monotonic)</span></a></li><li><a href=\"relationships/double_density_or_average_degree_minimum_degree.html\" class=\"relationship-statement\">$\\mathrm{dens} \\ge \\mathrm{d}_{\\min}$</a></li></ul></p></div></div>", "#parameters/11": "<div class=\"table-card\"><h3><a href=\"parameters/log_shattering.html\" class=\"table-title-link\">Log Shattering</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"$\\log \\mathrm{sh}$\">\n            $\\log \\mathrm{sh}$\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The <strong>Log Shattering</strong> of a family $\\mathcal{H}$ is the (binary) log of the number of its shattered sets, $$ \\log |sh{\\mathcal{H|}} $$</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/log_shattering_log_size.html\" class=\"relationship-statement\">$\\log \\mathrm{sh} \\ge \\log \\mathrm{H}$</a></li><li><a href=\"relationships/log_shattering_effective_range.html\" class=\"relationship-statement\">$\\log \\mathrm{sh} \\ge c\\log \\mathrm{E}$</a></li><li><a href=\"relationships/vc_dimension_log_shattering.html\" class=\"relationship-statement\">$\\mathrm{VC} \\ge \\frac{c\\log \\mathrm{sh}}{\\log n}$</a></li><li><a href=\"relationships/effective_range_log_shattering.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\log \\mathrm{sh}$</a></li><li><a href=\"relationships/log_shattering_majority_complexity.html\" class=\"relationship-statement\">$\\log \\mathrm{sh} \\ge \\mathrm{Maj}$</a></li></ul></p></div></div>", "#parameters/61": "<div class=\"table-card\"><h3><a href=\"parameters/largest_shattered_set.html\" class=\"table-title-link\">Largest Shattered Set</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"$\\mathrm{SH}$\">\n            $\\mathrm{SH}$\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>No concise summary has been recorded yet. Open the parameter page for the full catalogue entry.</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/largest_shattered_set_minimum_largest_order_shattered_set.html\" class=\"relationship-statement\">$\\mathrm{SH} \\ge \\mathrm{OSH}_{\\min}$</a></li><li><a href=\"relationships/largest_shattered_set_vc_dimension.html\" class=\"relationship-statement\">$\\mathrm{SH} = \\mathrm{VC}$</a></li></ul></p></div></div>", "#parameters/13": "<div class=\"table-card\"><h3><a href=\"parameters/effective_vc_radius.html\" class=\"table-title-link\">Effective VC Radius</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"$\\mathrm{VCR}$\">\n            $\\mathrm{VCR}$\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>For a family $\\mathcal{H}\\subset 2^\\mathcal{X}$, we define the <strong>effective VC radius</strong> as the largest integer $k$ such that all subsets of size $k$ of the effective range of $\\mathcal{H}$, i.e. $\\bigcup {h\\Delta h': h,h'\\in \\mathcal{H}}$ are shattered by $\\mathcal{H}$.</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/vc_dimension_effective_vc_radius.html\" class=\"relationship-statement\">$\\mathrm{VC} \\ge \\mathrm{VCR}$ <span class=\"relationship-variant\">(p_monotonic)</span></a></li><li><a href=\"relationships/minimum_largest_order_shattered_set_effective_vc_radius.html\" class=\"relationship-statement\">$\\mathrm{OSH}_{\\min} \\ge \\mathrm{VCR}$</a></li><li><a href=\"relationships/minimum_teaching_set_size_effective_vc_radius.html\" class=\"relationship-statement\">$\\mathrm{TS}_{\\min} \\ge \\mathrm{VCR}$</a></li><li><a href=\"relationships/projected_vc_radius_effective_vc_radius.html\" class=\"relationship-statement\">$\\mathrm{VCR}^p \\ge \\mathrm{VCR}$ <span cla r_stable_labeled_sample_compression_proper_labeled_sample_compression.html\" class=\"relationship-statement\">$\\mathrm{psLSC} \\ge \\mathrm{pLSC}$</a></li></ul></p></div></div>", "#parameters/42": "<div class=\"table-card\"><h3><a href=\"parameters/covc_dimension.html\" class=\"table-title-link\">co-VC dimension</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"$\\mathrm{coVC}$\">\n            $\\mathrm{coVC}$\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The <strong>coVC number</strong> of a family $\\mathcal{H}$, denoted by $\\covcmod(\\mathcal{H})$, is the largest integer $d$ such that there exists a set $S\\subset \\mathcal{X}$, of size $d$ such that $\\mathcal{H}_{|S}$ contains a hollow $d$-star, i.e. there is a subset $T\\subset S$ such that $$ T\\notin \\mathcal{H}_{|S} \\,\\mbox{ and }\\, \\forall x\\in S,\\, T\\Delta {x} \\in \\mathcal{H}_{|S}\\,. $$</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/proper_stable_labeled_sample_compression_covc_dimension.html\" class=\"relationship-statement\">$\\mathrm{psLSC} \\ge \\mathrm{coVC}$</a></li><li><a href=\"relationships/yang_dimension_covc_dimension.html\" class=\"relationship-statement\">$\\mathrm{Y} \\ge \\mathrm{coVC}$</a></li><li><a href=\"relationships/covc_dimension_effective_vc_radius.html\" class=\"relationship-statement\">$\\mathrm{coVC} \\ge \\mathrm{VCR}$</a></li></ul></p></div></div>", "#parameters/43": "<div class=\"table-card\"><h3><a href=\"parameters/sign_rank.html\" class=\"table-title-link\">Sign Rank</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"$\\mathrm{SR}$\">\n            $\\mathrm{SR}$\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The <strong>sign rank</strong> of a sign matrix $S$ is the     const edgeCards = {"__edge__0": "\n    <div class=\"table-card\" id=\"math-1\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/vc_dimension_effective_vc_radius.html\" class=\"table-title-link\">VC Dimension / Effective VC Radius</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>VC Dimension / Effective VC Radius</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/vc_dimension.html\">VC Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/effective_vc_radius.html\">Effective VC Radius</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> P-Monotonic</p>\n<strong>Details:</strong><div class=\"text-field\"><p>Definition</p></div>\n<p><strong>Witness: </strong><a href=\"classes/addressing.html\">Addressing</a></p>\n<p><strong>Status:</strong> </p>\n\n\n\n        </div>\n    </div>\n    ", "__label__0": "\n    <div class=\"table-card\" id=\"math-8\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/addressing.html\" class=\"table-title-link\">Addressing</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Addressing</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\text{Add}\">\n            \\text{Add}\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>(see <a href=\"bibliography.html#maass1992lower\">[maass1992lower]</a>): define the addressing function $f(S)$ that maps the characteristic vector of the set $S$ to its value as a binary number, then the Addressing family is defined as $$\\mathcal{H}:= { {f(S)+1\\}\\cup S : S \\subset {n+1,\\ldots,n+\\lfloor \\log n \\rfloor}}$$\n        In other words, we have singletons on $[n]$ followed by the index of the singleton encoded in binary. So this class has VC $\\lfloor\\log n\\rfloor$. Any parameter that is $p$-monotonic will be larg                     }
                    
                    // Check if this is an edge label node
                    if (node_id.startsWith('__edge__')) {
                        var edge_idx = parseInt(node_id.replace('__edge__', ''));
                        // Get the edge card by index
                        var edge_card = edgeCards[node_id];
                        var edge_label_key = '__label__' + edge_idx;
                        // If there's a label card, show it instead
                        if (edgeCards[edge_label_key]) {
                            edge_card = edgeCards[edge_label_key];
                        }
                        var modal = document.getElementById('node-modal');
                        var content = document.getElementById('node-modal-content');
                        content.innerHTML = edge_card || '<div class="table-card"><h3>Edge ' + edge_idx + '</h3></div>';

                        var content = document.getElementById('node-modal-content');

                // Create table rows for each legend item
                legendItems.forEach(function(item, idx) {
                    const row = document.createElement('tr');
                    row.style.borderBottom = '1px solid #eee';
                    
                    // SVG cell
                    const svgCell = document.createElement('td');
                    svgCell.style.padding = '5px';
                    svgCell.style.width = '100px';
                    svgCell.style.verticalAlign = 'middle';
                    const svgDiv = document.createElement('div');
                    svgDiv.id = 'legend-item-' + idx;
                    svgDiv.style.width = '100%';
                    svgDiv.style.height = '40px';
                    svgCell.appendChild(svgDiv);
                    
                    // Text cell
                    const textCell = document.createElement('td');
                    textCell.style.padding = '5px';
                    textCell.style.verticalAlign = 'middle';
                    textCell.style.fontSize = '0.9em';
                    textCell.textContent = item.text;
                    
                    row.appendChild(svgCell);
                    row.appendChild(textCell);
                    legendTable.appendChild(row);
                    
                    // Render the individual graph for this item (without worker to avoid conflicts)
                    d3.select('#legend-item-' + idx)
                        .graphviz({useWorker: false})
                        .width(100)
                        .height(40)
                        .fit(true)
                        .renderDot(item.dot_src);
                });
                
                legendRendered = true;
            }
        });

        document.addEventListener('mousedown', function(e) {
            var nodeModal = document.getElementById('node-modal');
            var legendModal = document.getElementById('legend-modal');

            }

            }
        });
