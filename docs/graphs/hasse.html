><p>Definition</p></div>\n\n<p><strong>Status:</strong> </p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>The identity projection is among the coordinate projections.  The maximum effective VC radius over all projections is therefore at least the effective VC radius of $\\mathcal{H}$ itself.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__7": "\n    <div class=\"table-card\" id=\"math-74\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/projected_strongly_shattered_dimension_largest_strongly_shattered_set.html\" class=\"table-title-link\">Projected Strongly Shattered Dimension / Largest Strongly Shattered Set</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Projected Strongly Shattered Dimension / Largest Strongly Shattered Set</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/projected_strongly_shattered_dimension.html\">Projected Strongly Shattered Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/largest_strongly_shattered_set.html\">Largest Strongly Shattered Set</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> P-Monotonic</p>\n<strong>Details:</strong><div class=\"text-field\"><p>Definition</p></div>\n<p><strong>Witness: </strong><a href=\"classes/warmuth_c5.html\">Warmuth's $C_5$ class</a></p>\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>The full-domain projection is among the projections optimized over by the projected parameter, so it includes every strongly shattered set of the original class.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__label__7": "\n    <div class=\"table-card\" id=\"math-10\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/warmuth_c5.html\" class=\"table-title-link\">Warmuth's $C_5$ class</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Warmuth's $C_5$ class</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"C_5\">\n            \\[C_5\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Let the domain be the cyclic group $\\mathbb{Z}/5\\mathbb{Z}$.  A binary function belongs to $C_5$ precisely when, on some four consecutive cyclic positions, its values are $1,0,0,1$ in that order.  The value on the remaining position is unrestricted, so the class has ten functions.</p></div>\n<strong>Comments:</strong><div class=\"text-field\"><p>This is also called Warmuth's example.  It is a finite separation between unlabeled sample-compression size and VC dimension.</p></div>\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/vc_dimension_warmuth_c5.html'>VC Dimension of Warmuth's $C_5$ class</a></li><li><a href='values/unlabeled_sample_compression_warmuth_c5.html'>Unlabeled Sample Compression of Warmuth's $C_5$ class</a></li><li><a href='values/size_warmuth_c5.html'>Size of Warmuth's $C_5$ class</a></li><li><a href='values/effective_range_warmuth_c5.html'>Effective Range of Warmuth's $C_5$ class</a></li><li><a href='values/log_size_warmuth_c5.html'>Log Size of Warmuth's $C_5$ class</a></li><li><a href='values/largest_shattered_set_warmuth_c5.html'>Largest Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_largest_order_shattered_set_warmuth_c5.html'>Maximum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_vc_radius_warmuth_c5.html'>Projected VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_strongly_shattered_dimension_warmuth_c5.html'>Projected Strongly Shattered Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_degree_warmuth_c5.html'>Maximum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_degree_warmuth_c5.html'>Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/double_density_or_average_degree_warmuth_c5.html'>Double Density or Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/densest_subgraph_twice_warmuth_c5.html'>Densest Subgraph (twice) of Warmuth's $C_5$ Class</a></li><li><a href='values/hamming_radius_warmuth_c5.html'>Hamming Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/oriented_diameter_warmuth_c5.html'>Oriented Diameter of Warmuth's $C_5$ Class</a></li><li><a href='values/threshold_dimension_warmuth_c5.html'>Threshold Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/path_dimension_warmuth_c5.html'>Path Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/degeneracy_warmuth_c5.html'>Degeneracy of Warmuth's $C_5$ Class</a></li><li><a href='values/largest_strongly_shattered_set_warmuth_c5.html'>Largest Strongly Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_positive_degree_warmuth_c5.html'>Maximum Positive Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_maximal_degree_warmuth_c5.html'>Projected Maximal Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_minimum_degree_warmuth_c5.html'>Projected Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_double_density_or_projected_average_degree_warmuth_c5.html'>Projected Double Density or Projected Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/effective_vc_radius_warmuth_c5.html'>Effective VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_largest_order_shattered_set_warmuth_c5.html'>Minimum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_teaching_set_size_warmuth_c5.html'>Minimum Teaching Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_teaching_set_size_warmuth_c5.html'>Maximum Teaching Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/teaching_dimension_warmuth_c5.html'>Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/recursive_teaching_dimension_warmuth_c5.html'>Recursive Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/monotone_recursive_teaching_dimension_warmuth_c5.html'>Projected Recursive Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/monotonic_minimum_teaching_set_size_warmuth_c5.html'>Monotonic Minimum Teaching-Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/preferencebased_teaching_dimension_warmuth_c5.html'>Preference-Based Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/star_number_warmuth_c5.html'>Star Number of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_projected_teaching_set_size_warmuth_c5.html'>Maximum Projected Teaching-Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/log_shattering_warmuth_c5.html'>Log Shattering of Warmuth's $C_5$ Class</a></li><li><a href='values/log_size_ratio_warmuth_c5.html'>Log Size Ratio of Warmuth's $C_5$ Class</a></li><li><a href='values/membership_query_complexity_warmuth_c5.html'>Membership Query Complexity of Warmuth's $C_5$ Class</a></li><li><a href='values/littlestone_dimension_warmuth_c5.html'>Littlestone Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/equivalence_queries_complexity_warmuth_c5.html'>Equivalence Queries Complexity of Warmuth's $C_5$ Class</a></li><li><a href='values/interpolation_degree_warmuth_c5.html'>Interpolation Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/diameter_warmuth_c5.html'>Diameter of Warmuth's $C_5$ class</a></li><li><a href='values/relative_hitting_size_warmuth_c5.html'>Relative Hitting Size of Warmuth's $C_5$ class</a></li><li><a href='values/hitting_size_warmuth_c5.html'>Hitting Size of Warmuth's $C_5$ Class</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/minimum_largest_order_shattered_set_largest_strongly_shattered_set.html'>Minimum Largest Order Shattered Set / Largest Strongly Shattered Set</a></li><li><a href='relationships/minimum_teaching_set_size_effective_vc_radius.html'>Minimum Teaching Set Size / Effective VC Radius</a></li><li><a href='relationships/projected_maximal_degree_projected_minimum_degree.html'>Projected Maximal Degree / Projected Minimum Degree</a></li><li><a href='relationships/projected_strongly_shattered_dimension_largest_strongly_shattered_set.html'>Projected Strongly Shattered Dimension / Largest Strongly Shattered Set</a></li><li><a href='relationships/maximum_teaching_set_size_largest_strongly_shattered_set.html'>Maximum Teaching Set Size / Largest Strongly Shattered Set</a></li><li><a href='relationships/vc_dimension_densest_subgraph_twice.html'>VC Dimension / Densest Subgraph (twice)</a></li><li><a href='relationships/path_dimension_threshold_dimension.html'>Path Dimension / Threshold Dimension</a></li><li><a href='relationships/recursive_teaching_dimension_interpolation_degree.html'>Recursive Teaching Dimension / Interpolation degree</a></li><li><a href='relationships/diameter_oriented_diameter.html'>Diameter / Oriented Diameter</a></li><li><a href='relationships/recursive_teaching_dimension_effective_vc_radius.html'>Recursive Teaching Dimension / Effective VC Radius</a></li><li><a href='relationships/monotone_recursive_teaching_dimension_vc_dimension.html'>Projected Recursive Teaching Dimension / VC Dimension</a></li><li><a href='relationships/hamming_radius_oriented_diameter.html'>Hamming Radius / Oriented Diameter</a></li><li><a href='relationships/diameter_hamming_radius.html'>Diameter / Hamming Radius</a></li><li><a href='relationships/unlabeled_sample_compression_vc_dimension.html'>Unlabeled Sample Compression / VC Dimension</a></li><li><a href='relationships/diameter_littlestone_dimension.html'>Diameter / Littlestone Dimension</a></li><li><a href='relationships/maximum_teaching_set_size_maximum_degree.html'>Maximum Teaching-Set Size / Maximum Degree</a></li><li><a href='relationships/minimum_teaching_set_size_minimum_degree.html'>Minimum Teaching-Set Size / Minimum Degree</a></li><li><a href='relationships/star_number_vc_dimension.html'>Star Number / VC Dimension</a></li><li><a href='relationships/effective_range_star_number.html'>Effective Range / Star Number</a></li><li><a href='relationships/size_star_number.html'>Size / Star Number</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__8": "\n    <div class=\"table-card\" id=\"math-82\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/monotonic_projected_minimum_teaching_set_size_monotonic_minimum_teaching_set_size.html\" class=\"table-title-link\">Monotonic Projected Minimum Teaching Set Size / Monotonic Minimum Teaching Set Size</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Monotonic Projected Minimum Teaching Set Size / Monotonic Minimum Teaching Set Size</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/monotonic_projected_minimum_teaching_set_size.html\">Monotonic Projected Minimum Teaching Set Size</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/monotonic_minimum_teaching_set_size.html\">Monotonic Minimum Teaching Set Size</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> P-Monotonic</p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>For each subfamily, the projected quantity includes its full-domain projection and is therefore at least its unprojected quantity.  Maximizing over subfamilies preserves the inequality.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__9": "\n    <div class=\"table-card\" id=\"math-83\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/minimum_projected_teaching_set_size_minimum_teaching_set_size.html\" class=\"table-title-link\">Minimum Projected Teaching Set Size / Minimum Teaching Set Size</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Minimum Projected Teaching Set Size / Minimum Teaching Set Size</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/minimum_projected_teaching_set_size.html\">Minimum Projected Teaching Set Size</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/minimum_teaching_set_size.html\">Minimum Teaching Set Size</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> P-Monotonic</p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>The projected minimum teaching-set parameter maximizes the corresponding quantity over projections.  The full-domain projection recovers the original class and its minimum teaching-set size.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__10": "\n    <div class=\"table-card\" id=\"math-129\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/projected_membership_queries_complexity_membership_query_complexity.html\" class=\"table-title-link\">Projected Membership Queries Complexity / Membership Query Complexity</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Projected Membership Queries Complexity / Membership Query Complexity</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/projected_membership_queries_complexity.html\">Projected Membership Queries Complexity</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/membership_query_complexity.html\">Membership Query Complexity</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> P-Monotonic</p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Projected membership-query complexity maximizes the membership-query complexity over projections.  The full-domain projection is the original class, so it supplies the ordinary membership-query complexity as a candidate.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__11": "\n    <div class=\"table-card\" id=\"math-4\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/interpolation_degree_largest_strongly_shattered_set.html\" class=\"table-title-link\">Interpolation degree / Largest Strongly Shattered Set</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Interpolation degree / Largest Strongly Shattered Set</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/interpolation_degree.html\">Interpolation degree</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/largest_strongly_shattered_set.html\">Largest Strongly Shattered Set</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Lemma</p></div>\n\n<p><strong>Status:</strong> </p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>If $\\mathcal H$ contains a $d$-cube, restrict an interpolating polynomial to that cube.  Every real-valued function on the cube must then be representable; in particular its parity function requires degree $d$.  Hence $\\mathrm{intdeg}(\\mathcal H)\\ge\\mathrm{ST}(\\mathcal H)$.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#moran2015shattered\">[moran2015shattered]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__12": "\n    <div class=\"table-card\" id=\"math-5\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/minimum_largest_order_shattered_set_effective_vc_radius.html\" class=\"table-title-link\">Minimum Largest Order Shattered Set / Effective VC Radius</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Minimum Largest Order Shattered Set / Effective VC Radius</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/minimum_largest_order_shattered_set.html\">Minimum Largest Order Shattered Set</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/effective_vc_radius.html\">Effective VC Radius</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Lemma</p></div>\n\n<p><strong>Status:</strong> </p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Work on the effective range.  If the effective VC radius is $d$, every $d$-subset is shattered.  For each coordinate order, the relevant initial $d$-set is therefore order-shattered by the downshifting characterization.  Thus every order has an order-shattered set of size $d$, and minimizing over orders gives $\\mathrm{OSH}_{\\min}(\\mathcal H)\\ge\\mathrm{VCR}(\\mathcal H)$.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#bollobas1995defect\">[bollobas1995defect]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__13": "\n    <div class=\"table-card\" id=\"math-6\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/minimum_largest_order_shattered_set_interpolation_degree.html\" class=\"table-title-link\">Minimum Largest Order Shattered Set / Interpolation degree</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Minimum Largest Order Shattered Set / Interpolation degree</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/minimum_largest_order_shattered_set.html\">Minimum Largest Order Shattered Set</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/interpolation_degree.html\">Interpolation degree</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Lemma</p></div>\n\n<p><strong>Status:</strong> </p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>For every coordinate order, the standard monomials of the vanishing ideal form a basis for functions on $\\mathcal H$, and their supports are the order-shattered sets for that order.  Their degrees are thus at most the largest order-shattered-set size.  Minimizing over orders gives $\\mathrm{intdeg}(\\mathcal H)\\le\\mathrm{OSH}_{\\min}(\\mathcal H)$.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#moran2015shattered\">[moran2015shattered]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__14": "\n    <div class=\"table-card\" id=\"math-7\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/best_mistakes_minimum_largest_order_shattered_set.html\" class=\"table-title-link\">Best Mistakes / Minimum Largest Order Shattered Set</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Best Mistakes / Minimum Largest Order Shattered Set</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/best_mistakes.html\">Best Mistakes</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/minimum_largest_order_shattered_set.html\">Minimum Largest Order Shattered Set</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes; both quantities admit a fixed-order tree-rank formulation.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>For a fixed domain order, Ben-David, Kushilevitz, and Mansour identify the optimal mistake count with the rank of the corresponding order-labeled consistency tree. An order-shattered set of size d yields a complete binary subtree of depth d in that tree, so its rank is at least d. Minimize over orders to obtain best mistakes at least the minimum largest order-shattered-set size.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#ben1997online\">[ben1997online]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__15": "\n    <div class=\"table-card\" id=\"math-8\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/effective_range_yang_dimension.html\" class=\"table-title-link\">Effective Range / Yang dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Effective Range / Yang dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/effective_range.html\">Effective Range</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/yang_dimension.html\">Yang dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Dimension bound from Yang's canonical suboplex.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/trivial_concepts.html\">Trivial concepts</a></p>\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Coordinates outside the effective range are constant on the class and may be deleted.  On the remaining $\\mathrm{E}(\\mathcal H)$ coordinates, Yang's canonical suboplex is a subcomplex of the boundary of the corresponding cross-polytope; every relevant section has dimension at most $\\mathrm{E}(\\mathcal H)-1$.  Since Yang dimension is one plus the largest possible homology dimension, $\\mathrm{Y}(\\mathcal H)\\le \\mathrm{E}(\\mathcal H)$.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#yang2018homological\">[yang2018homological]</a></p></div>\n\n        </div>\n    </div>\n    ", "__label__15": "\n    <div class=\"table-card\" id=\"math-1\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/trivial_concepts.html\" class=\"table-title-link\">Trivial concepts</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Trivial concepts</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\{\\emptyset, [n]\\}\">\n            \\[\\{\\emptyset, [n]\\}\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Class containing the empty and the full concept.</p></div>\n\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/effective_range_trivial_concepts.html'>Effective Range of Trivial concepts</a></li><li><a href='values/log_shattering_trivial_concepts.html'>Log Shattering of Trivial concepts</a></li><li><a href='values/membership_and_proper_equivalence_queries_complexity_trivial_concepts.html'>Membership and Proper Equivalence Queries Complexity of Trivial concepts</a></li><li><a href='values/membership_query_complexity_trivial_concepts.html'>Membership Query Complexity of Trivial concepts</a></li><li><a href='values/projected_membership_queries_complexity_trivial_concepts.html'>Projected Membership Queries Complexity of Trivial concepts</a></li><li><a href='values/recursive_teaching_dimension_trivial_concepts.html'>Recursive Teaching Dimension of Trivial concepts</a></li><li><a href='values/teaching_dimension_trivial_concepts.html'>Teaching Dimension of Trivial concepts</a></li><li><a href='values/star_number_trivial_concepts.html'>Star number of Trivial concepts</a></li><li><a href='values/covc_dimension_trivial_concepts.html'>co-VC dimension of Trivial concepts</a></li><li><a href='values/monotone_recursi epts</a></li><li><a href='values/best_mistakes_trivial_concepts.html'>Best Mistakes of Trivial Concepts</a></li><li><a href='values/worst_mistakes_trivial_concepts.html'>Worst Mistakes of Trivial Concepts</a></li><li><a href='values/selfdirected_queries_complexity_trivial_concepts.html'>Self-Directed Queries Complexity of Trivial Concepts</a></li><li><a href='values/occasional_onesided_getback_trivial_concepts.html'>Occasional One-Sided Getback of Trivial Concepts</a></li><li><a href='values/distinguishing_range_trivial_concepts.html'>Distinguishing Range of Trivial Concepts</a></li><li><a href='values/sign_rank_trivial_concepts.html'>Sign Rank of Trivial Concepts</a></li><li><a href='values/dual_sign_rank_trivial_concepts.html'>Dual Sign Rank of Trivial Concepts</a></li><li><a href='values/interpolation_degree_trivial_concepts.html'>Interpolation Degree of Trivial Concepts</a></li><li><a href='values/positive_teaching_dimension_trivial_concepts.html'>Positive Teaching Dimension of Trivial Concepts</a></li><li><a href='values/positive_recursive_teaching_dimension_trivial_concepts.html'>Positive Recursive Teaching Dimension of Trivial Concepts</a></li><li><a href='values/labeled_sample_compression_trivial_concepts.html'>Labeled Sample Compression of Trivial concepts</a></li><li><a href='values/proper_labeled_sample_compression_trivial_concepts.html'>Proper Labeled Sample Compression of Trivial concepts</a></li><li><a href='values/stable_labeled_sample_compression_trivial_concepts.html'>Stable Labeled Sample Compression of Trivial concepts</a></li><li><a href='values/proper_stable_labeled_sample_compression_trivial_concepts.html'>Proper Stable Labeled Sample Compression of Trivial concepts</a></li><li><a href='values/majority_complexity_trivial_concepts.html'>Majority Complexity of Trivial concepts</a></li><li><a href='values/random_equivalence_queries_complexity_trivial_concepts.html'>Random Equivalence Queries Complexity of Trivial concepts</a></li><li><a href='values/random_proper_equivalence_queries_complexity_trivial_concepts.html'>Random Proper Equivalence Queries Complexity of Trivial concepts</a></li><li><a href='values/unlabeled_sample_compression_trivial_concepts.html'>Unlabeled Sample Compression of Trivial concepts</a></li><li><a href='values/proper_unlabeled_sample_compression_trivial_concepts.html'>Proper Unlabeled Sample Compression of Trivial concepts</a></li><li><a href='values/stable_unlabeled_complexity_trivial_concepts.html'>Stable Unlabeled Complexity of Trivial concepts</a></li><li><a href='values/proper_stable_sample_compression_trivial_concepts.html'>Proper Stable Sample Compression of Trivial concepts</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/effective_range_yang_dimension.html'>Effective Range / Yang dimension</a></li><li><a href='relationships/proper_stable_labeled_sample_compression_covc_dimension.html'>Proper Stable Labeled Sample Compression / co-VC dimension</a></li><li><a href='relationships/log_shattering_log_size.html'>Log Shattering / Log Size</a></li><li><a href='relationships/positive_noclashing_teaching_dimension_maximum_positive_degree.html'>Positive No-Clashing Teaching Dimension / Maximum Positive Degree</a></li><li><a href='relationships/noclashing_teaching_dimension_densest_subgraph_twice.html'>No-Clashing Teaching Dimension / Densest Subgraph (twice)</a></li><li><a href='relationships/noclashing_teaching_dimension_double_density_or_average_degree.html'>No-Clashing Teaching Dimension / Double Density or Average Degree</a></li><li><a href='relationships/oriented_diameter_threshold_dimension.html'>Oriented Diameter / Threshold Dimension</a></li><li><a href='relationships/diameter_path_dimension.html'>Diameter / Path Dimension</a></li><li><a href='relationships/effective_range_projected_membership_queries_complexity.html'>Effective Range / Projected Membership Queries Complexity</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__16": "\n    <div class=\"table-card\" id=\"math-11\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/preferencebased_teaching_dimension_noclashing_teaching_dimension.html\" class=\"table-title-link\">Preference-Based Teaching Dimension / No-Clashing Teaching Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Preference-Based Teaching Dimension / No-Clashing Teaching Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/preferencebased_teaching_dimension.html\">Preference-Based Teaching Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/noclashing_teaching_dimension.html\">No-Clashing Teaching Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Every preference-based teaching mapping is no-clashing.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Let T_h be a preference-based teaching set for h. If two distinct concepts h,h' clashed, then h' would be consistent with T_h and h with T_h'. The first consistency forces h to be preferred to h', while the second forces h' to be preferred to h, contradicting strictness of the preference order. Thus the same mapping is no-clashing, so the preference-based teaching dimension is at least the no-clashing teaching dimension.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#KSZ2019\">[KSZ2019]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__17": "\n    <div class=\"table-card\" id=\"math-13\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/maximum_degree_double_density_or_average_degree.html\" class=\"table-title-link\">Maximum Degree / Double Density or Average Degree</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Maximum Degree / Double Density or Average Degree</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/maximum_degree.html\">Maximum Degree</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/double_density_or_average_degree.html\">Double Density or Average Degree</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For every finite $1$-inclusion graph.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/tagged_singletons.html\">Tagged Singletons</a></p>\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>The maximum vertex degree is at least the average vertex degree, which is the double-density parameter.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#haussler1988predicting\">[haussler1988predicting]</a> <a href=\"bibliography.html#haussler1994predicting\">[haussler1994predicting]</a></p></div>\n\n        </div>\n    </div>\n    ", "__label__17": "\n    <div class=\"table-card\" id=\"math-6\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/tagged_singletons.html\" class=\"table-title-link\">Tagged Singletons</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Tagged Singletons</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\text{Tag}\">\n            \\[\\text{Tag}\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>(see <a href=\"bibliography.html#maass1992lower\">[maass1992lower]</a>): Define the function $f(i):=\\min {\\ell: i\\le \\sum_{j=1}^\\ell n2^{-j} + \\lceil \\log n \\rceil + 1}$. The class of tagged singletons is defined as $$\n        \\mathcal{H}:={\\emptyset} \\cup {{n+\\ell\\}:\\ell \\in [\\lceil\\log n\\rceil]} \\cup {{i,n+f(i)\\}:i\\in[n]}\n        $$</p>\n<p>So we have the empty set, singletons on $[n+1, n+\\lceil\\log n\\rceil]$, and then singletons on $[n]$ with a tag such that more than half have the first tag, more than one fourth have the second tag and so on.</p></div>\n\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/recursive_teaching_dimension_tagged_singletons.html'>Recursive Teaching Dimension of Tagged Singletons</a></li><li><a href='values/star_number_tagged_singletons.html'>Star number of Tagged Singletons</a></li><li><a href='values/covc_dimension_tagged_singletons.html'>co-VC dimension of Tagged Singletons</a></li><li><a href='values/maximum_degree_tagged_singletons.html'>Maximum Degree of Tagged Singletons</a></li><li><a href='values/size_tagged_singletons.html'>Size of Tagged Singletons</a></li><li><a href='values/vc_dimension_tagged_singletons.html'>VC Dimension of Tagged Singletons</a></li><li><a href='values/hamming_radius_tagged_singletons.html'>Hamming Radius of Tagged Singletons</a></li><li><a href='values/diameter_tagged_singletons.html'>Diameter of Tagged Singletons</a></li><li><a href='values/oriented_diameter_tagged_singletons.html'>Oriented Diameter of Tagged Singletons</a></li><li><a href='values/effective_range_tagged_singletons.html'>Effective Range of Tagged Singletons</a></li><li><a href='values/threshold_dimension_tagged_singletons.html'>Threshold Dimension of Tagged Singletons</a></li><li><a href='values/littlestone_dimension_tagged_singletons.html'>Littlestone Dimension of Tagged Singletons</a></li><li><a href='values/proper_equivalence_queries_complexity_tagged_singletons.html'>Proper Equivalence Queries Complexity of Tagged Singletons</a></li><li><a href='values/log_size_tagged_singletons.html'>Log Size of Tagged Singletons</a></li><li><a href='values/log_size_ratio_tagged_singletons.html'>Log Size Ratio of Tagged Singletons</a></li><li><a href='values/largest_shattered_set_tagged_singletons.html'>Largest Shattered Set of Tagged Singletons</a></li><li><a href='values/maximum_largest_order_shattered_set_tagged_singletons.html'>Maximum Largest Order Shattered Set of Tagged Singletons</a></li><li><a href='values/projected_vc_radius_tagged_singletons.html'>Projected VC Radius of Tagged Singletons</a></li><li><a href='values/projected_strongly_shattered_dimension_tagged_singletons.html'>Projected Strongly Shattered Dimension of Tagged Singletons</a></li><li><a href='values/maximum_projected_teaching_set_size_tagged_singletons.html'>Maximum Projected Teaching-Set Size of Tagged Singletons</a></li><li><a href='values/projected_maximal_degree_tagged_singletons.html'>Projected Maximal Degree of Tagged Singletons</a></li><li><a href='values/monotonic_minimum_teaching_set_size_tagged_singletons.html'>Monotonic Minimum Teaching-Set Size of Tagged Singletons</a></li><li><a href='values/preferencebased_teaching_dimension_tagged_singletons.html'>Preference-Based Teaching Dimension of Tagged Singletons</a></li><li><a href='values/equivalence_queries_complexity_tagged_singletons.html'>Equivalence Queries Complexity of Tagged Singletons</a></li><li><a href='values/hitting_size_tagged_singletons.html'>Hitting Size of Tagged Singletons</a></li><li><a href='values/interpolation_degree_tagged_singletons.html'>Interpolation Degree of Tagged Singletons</a></li><li><a href='values/effective_vc_radius_tagged_singletons.html'>Effective VC Radius of Tagged Singletons</a></li><li><a href='values/minimum_teaching_set_size_tagged_singletons.html'>Minimum Teaching-Set Size of Tagged Singletons</a></li><li><a href='values/positive_teaching_dimension_tagged_singletons.html'>Positive Teaching Dimension of Tagged Singletons</a></li><li><a href='values/positive_recursive_teaching_dimension_tagged_singletons.html'>Positive Recursive Teaching Dimension of Tagged Singletons</a></li><li><a href='values/positive_noclashing_teaching_dimension_tagged_singletons.html'>Positive No-Clashing Teaching Dimension of Tagged Singletons</a></li><li><a href='values/noclashing_teaching_dimension_tagged_singletons.html'>No-Clashing Teaching Dimension of Tagged Singletons</a></li><li><a href='values/minimum_degree_tagged_singletons.html'>Minimum Degree of Tagged Singletons</a></li><li><a href='values/double_density_or_average_degree_tagged_singletons.html'>Double Density or Average Degree of Tagged Singletons</a></li><li><a href='values/densest_subgraph_twice_tagged_singletons.html'>Densest Subgraph (twice) of Tagged Singletons</a></li><li><a href='values/log_shattering_tagged_singletons.html'>Log Shattering of Tagged Singletons</a></li><li><a href='values/largest_strongly_shattered_set_tagged_singletons.html'>Largest Strongly Shattered Set of Tagged Singletons</a></li><li><a href='values/teaching_dimension_tagged_singletons.html'>Teaching Dimension of Tagged Singletons</a></li><li><a href='values/maximum_teaching_set_size_tagged_singletons.html'>Maximum Teaching-Set Size of Tagged Singletons</a></li><li><a href='values/relative_hitting_size_tagged_singletons.html'>Relative Hitting Size of Tagged Singletons</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/maximum_degree_double_density_or_average_degree.html'>Maximum Degree / Double Density or Average Degree</a></li><li><a href='relationships/maximum_degree_minimum_degree.html'>Maximum Degree / Minimum Degree</a></li><li><a href='relationships/maximum_degree_densest_subgraph_twice.html'>Maximum Degree / Densest Subgraph (twice)</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__18": "\n    <div class=\"table-card\" id=\"math-16\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/densest_subgraph_twice_degeneracy.html\" class=\"table-title-link\">Densest Subgraph (twice) / Degeneracy</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Densest Subgraph (twice) / Degeneracy</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/densest_subgraph_twice.html\">Densest Subgraph (twice)</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/degeneracy.html\">Degeneracy</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For every finite $1$-inclusion graph.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>For every induced subgraph, its average degree is at least its minimum degree.  Maximize the former over subgraphs to obtain the densest-subgraph parameter and the latter to obtain degeneracy.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#haussler1994predicting\">[haussler1994predicting]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__19": "\n    <div class=\"table-card\" id=\"math-18\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/preferencebased_teaching_dimension_recursive_teaching_dimension.html\" class=\"table-title-link\">Preference-Based Teaching Dimension / Recursive Teaching Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Preference-Based Teaching Dimension / Recursive Teaching Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/preferencebased_teaching_dimension.html\">Preference-Based Teaching Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/recursive_teaching_dimension.html\">Recursive Teaching Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1 = P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>(for finite classes)</p></div>\n\n<p><strong>Status:</strong> Established</p>\n\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#gao2017preference\">[gao2017preference]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__20": "\n    <div class=\"table-card\" id=\"math-23\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/maximum_projected_teaching_set_size_minimum_projected_teaching_set_size.html\" class=\"table-title-link\">Maximum Projected Teaching Set Size / Minimum Projected Teaching Set Size</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Maximum Projected Teaching Set Size / Minimum Projected Teaching Set Size</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/maximum_projected_teaching_set_size.html\">Maximum Projected Teaching Set Size</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/minimum_projected_teaching_set_size.html\">Minimum Projected Teaching Set Size</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>For every projected class, the largest minimum teaching-set size is at least the smallest minimum teaching-set size.  Taking the respective extrema over projections preserves this ordering.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__21": "\n    <div class=\"table-card\" id=\"math-24\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/yang_dimension_vc_dimension.html\" class=\"table-title-link\">Yang dimension / VC Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Yang dimension / VC Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/yang_dimension.html\">Yang dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/vc_dimension.html\">VC Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Theorem</p></div>\n<p><strong>Witness: </strong><a href=\"classes/singletons.html\">Singletons</a></p>\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Restricting a minimal resolution to a largest shattered coordinate set yields a resolution of the full cube on that set, whose projective dimension is its cardinality. Hence the homological/Yang dimension is at least the VC dimension.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#yang2018homological\">[yang2018homological]</a></p></div>\n\n        </div>\n    </div>\n    ", "__label__21": "\n    <div class=\"table-card\" id=\"math-2\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/singletons.html\" class=\"table-title-link\">Singletons</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Singletons</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\{\\{i\\}\\}_{1\\le i\\le n}\">\n            \\[\\{\\{i\\}\\}_{1\\le i\\le n}\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Singletons</p></div>\n\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/recursive_teaching_dimension_singletons.html'>Recursive Teaching Dimension of Singletons</a></li><li><a href='values/star_number_singletons.html'>Star number of Singletons</a></li><li><a href='values/covc_dimension_singletons.html'>co-VC dimension of Singletons</a></li><li><a href='values/oriented_diameter_singletons.html'>Oriented Diameter of Singletons</a></li><li><a href='values/maximum_degree_singletons.html'>Maximum Degree of Singletons</a></li><li><a href='values/log_shattering_singletons.ht /littlestone_dimension_singletons.html'>Littlestone Dimension of Singletons</a></li><li><a href='values/proper_equivalence_queries_complexity_singletons.html'>Proper Equivalence Queries Complexity of Singletons</a></li><li><a href='values/log_size_ratio_singletons.html'>Log Size Ratio of Singletons</a></li><li><a href='values/log_size_singletons.html'>Log Size of Singletons</a></li><li><a href='values/diameter_singletons.html'>Diameter of Singletons</a></li><li><a href='values/hamming_radius_singletons.html'>Hamming Radius of Singletons</a></li><li><a href='values/path_dimension_singletons.html'>Path Dimension of Singletons</a></li><li><a href='values/extended_teaching_dimension_singletons.html'>Extended Teaching Dimension of Singletons</a></li><li><a href='values/maximum_teaching_set_size_singletons.html'>Maximum Teaching Set Size of Singletons</a></li><li><a href='values/noclashing_teaching_dimension_singletons.html'>No-Clashing Teaching Dimension of Singletons</a></li><li><a href='values/positive_noclashing_teaching_dimension_singletons.html'>Positive No-Clashing Teaching Dimension of Singletons</a></li><li><a href='values/minimum_degree_singletons.html'>Minimum Degree of Singletons</a></li><li><a href='values/degeneracy_singletons.html'>Degeneracy of Singletons</a></li><li><a href='values/densest_subgraph_twice_singletons.html'>Densest Subgraph (twice) of Singletons</a></li><li><a href='values/double_density_or_average_degree_singletons.html'>Double Density or Average Degree of Singletons</a></li><li><a href='values/maximum_positive_degree_singletons.html'>Maximum Positive Degree of Singletons</a></li><li><a href='values/projected_maximal_degree_singletons.html'>Projected Maximal Degree of Singletons</a></li><li><a href='values/projected_double_density_or_projected_average_degree_singletons.html'>Projected Double Density or Projected Average Degree of Singletons</a></li><li><a href='values/projected_minimum_degree_singletons.html'>Projected Minimum Degree of Singletons</a></li><li><a href='values/largest_shattered_set_singletons.html'>Largest Shattered Set of Singletons</a></li><li><a href='values/relative_hitting_size_singletons.html'>Relative Hitting Size of Singletons</a></li><li><a href='values/maximum_largest_order_shattered_set_singletons.html'>Maximum Largest Order Shattered Set of Singletons</a></li><li><a href='values/projected_vc_radius_singletons.html'>Projected VC Radius of Singletons</a></li><li><a href='values/projected_strongly_shattered_dimension_singletons.html'>Projected Strongly Shattered Dimension of Singletons</a></li><li><a href='values/maximum_projected_teaching_set_size_singletons.html'>Maximum Projected Teaching-Set Size of Singletons</a></li><li><a href='values/monotonic_minimum_teaching_set_size_singletons.html'>Monotonic Minimum Teaching-Set Size of Singletons</a></li><li><a href='values/preferencebased_teaching_dimension_singletons.html'>Preference-Based Teaching Dimension of Singletons</a></li><li><a href='values/minimum_projected_teaching_set_size_singletons.html'>Minimum Projected Teaching-Set Size of Singletons</a></li><li><a href='values/equivalence_queries_complexity_singletons.html'>Equivalence Queries Complexity of Singletons</a></li><li><a href='values/hitting_size_singletons.html'>Hitting Size of Singletons</a></li><li><a href='values/distinguishing_range_singletons.html'>Distinguishing Range of Singletons</a></li><li><a href='values/minimum_largest_order_shattered_set_singletons.html'>Minimum Largest Order Shattered Set of Singletons</a></li><li><a href='values/positive_teaching_dimension_singletons.html'>Positive Teaching Dimension of Singletons</a></li><li><a href='values/positive_recursive_teaching_dimension_singletons.html'>Positive Recursive Teaching Dimension of Singletons</a></li><li><a href='values/labeled_sample_compression_singletons.html'>Labeled Sample Compression of Singletons</a></li><li><a href='values/proper_labeled_sample_compression_singletons.html'>Proper Labeled Sample Compression of Singletons</a></li><li><a href='values/majority_complexity_singletons.html'>Majority Complexity of Singletons</a></li><li><a href='values/unlabeled_sample_compression_singletons.html'>Unlabeled Sample Compression of Singletons</a></li><li><a href='values/proper_unlabeled_sample_compression_singletons.html'>Proper Unlabeled Sample Compression of Singletons</a></li><li><a href='values/stable_unlabeled_complexity_singletons.html'>Stable Unlabeled Complexity of Singletons</a></li><li><a href='values/stable_labeled_sample_compression_singletons.html'>Stable Labeled Sample Compression of Singletons</a></li><li><a href='values/interpolation_degree_singletons.html'>Interpolation Degree of Singletons</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/projected_maximal_degree_maximum_degree.html'>Projected Maximal Degree / Maximum Degree</a></li><li><a href='relationships/yang_dimension_vc_dimension.html'>Yang dimension / VC Dimension</a></li><li><a href='relationships/proper_ordered_sample_compression_order_sample_compression.html'>Proper Ordered Sample Compression / Order Sample Compression</a></li><li><a href='relationships/projected_minimum_degree_minimum_degree.html'>Projected Minimum Degree / Minimum Degree</a></li><li><a href='relationships/projected_double_density_or_projected_average_degree_double_density_or_average_degree.html'>Projected Double Density or Projected Average Degree / Double Density or Average Degree</a></li><li><a href='relationships/yang_dimension_covc_dimension.html'>Yang dimension / co-VC dimension</a></li><li><a href='relationships/effective_range_vc_dimension.html'>Effective Range / VC Dimension</a></li><li><a href='relationships/effective_range_diameter.html'>Effective Range / Diameter</a></li><li><a href='relationships/effective_range_hamming_radius.html'>Effective Range / Hamming Radius</a></li><li><a href='relationships/size_littlestone_dimension.html'>Size / Littlestone Dimension</a></li><li><a href='relationships/size_yang_dimension.html'>Size / Yang dimension</a></li><li><a href='relationships/effective_range_log_shattering.html'>Effective Range / Log Shattering</a></li><li><a href='relationships/membership_query_complexity_log_size.html'>Membership Query Complexity / Log Size</a></li><li><a href='relationships/membership_and_proper_equivalence_queries_complexity_membership_and_equivalence_queries_complexity.html'>Membership and Proper Equivalence Queries Complexity / Membership and Equivalence Queries Complexity</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__22": "\n    <div class=\"table-card\" id=\"math-25\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/random_equivalence_queries_complexity_vc_dimension.html\" class=\"table-title-link\">Random Equivalence Queries Complexity / VC Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Random Equivalence Queries Complexity / VC Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/random_equivalence_queries_complexity.html\">Random Equivalence Queries Complexity</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/vc_dimension.html\">VC Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes in the random-counterexample equivalence-query model.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Angluin and Dohrn prove that the VC dimension lower-bounds the expected number of equivalence queries when each counterexample is sampled at random from the disagreement set (their Theorem 25).</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#angluin2017random\">[angluin2017random]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__23": "\n    <div class=\"table-card\" id=\"math-26\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/minimum_teaching_set_size_effective_vc_radius.html\" class=\"table-title-link\">Minimum Teaching Set Size / Effective VC Radius</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Minimum Teaching Set Size / Effective VC Radius</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/minimum_teaching_set_size.html\">Minimum Teaching Set Size</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/effective_vc_radius.html\">Effective VC Radius</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite classes, by the definition of effective VC radius.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/warmuth_c5.html\">Warmuth's $C_5$ class</a></p>\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Let $d=\\mathrm{VCR}(\\mathcal H)$ and let $T$ be a teaching set of size less than $d$; coordinates outside the effective range may be discarded.  Extend $T$ to a $d$-subset $S$ of the effective range.  Since $S$ is shattered, there is a concept other than the target that agrees with it on $T$ and differs on a point of $S\\setminus T$, contradicting that $T$ teaches the target.  Thus every teaching set has size at least $d$.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__label__23": "\n    <div class=\"table-card\" id=\"math-10\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/warmuth_c5.html\" class=\"table-title-link\">Warmuth's $C_5$ class</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Warmuth's $C_5$ class</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"C_5\">\n            \\[C_5\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Let the domain be the cyclic group $\\mathbb{Z}/5\\mathbb{Z}$.  A binary function belongs to $C_5$ precisely when, on some four consecutive cyclic positions, its values are $1,0,0,1$ in that order.  The value on the remaining position is unrestricted, so the class has ten functions.</p></div>\n<strong>Comments:</strong><div class=\"text-field\"><p>This is also called Warmuth's example.  It is a finite separation between unlabeled sample-compression size and VC dimension.</p></div>\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/vc_dimension_warmuth_c5.html'>VC Dimension of Warmuth's $C_5$ class</a></li><li><a href='values/unlabeled_sample_compression_warmuth_c5.html'>Unlabeled Sample Compression of Warmuth's $C_5$ class</a></li><li><a href='values/size_warmuth_c5.html'>Size of Warmuth's $C_5$ class</a></li><li><a href='values/effective_range_warmuth_c5.html'>Effective Range of Warmuth's $C_5$ class</a></li><li><a href='values/log_size_warmuth_c5.html'>Log Size of Warmuth's $C_5$ class</a></li><li><a href='values/largest_shattered_set_warmuth_c5.html'>Largest Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_largest_order_shattered_set_warmuth_c5.html'>Maximum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_vc_radius_warmuth_c5.html'>Projected VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_strongly_shattered_dimension_warmuth_c5.html'>Projected Strongly Shattered Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_degree_warmuth_c5.html'>Maximum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_degree_warmuth_c5.html'>Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/double_density_or_average_degree_warmuth_c5.html'>Double Density or Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/densest_subgraph_twice_warmuth_c5.html'>Densest Subgraph (twice) of Warmuth's $C_5$ Class</a></li><li><a href='values/hamming_radius_warmuth_c5.html'>Hamming Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/oriented_diameter_warmuth_c5.html'>Oriented Diameter of Warmuth's $C_5$ Class</a></li><li><a href='values/threshold_dimension_warmuth_c5.html'>Threshold Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/path_dimension_warmuth_c5.html'>Path Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/degeneracy_warmuth_c5.html'>Degeneracy of Warmuth's $C_5$ Class</a></li><li><a href='values/largest_strongly_shattered_set_warmuth_c5.html'>Largest Strongly Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_positive_degree_warmuth_c5.html'>Maximum Positive Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_maximal_degree_warmuth_c5.html'>Projected Maximal Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_minimum_degree_warmuth_c5.html'>Projected Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_double_density_or_projected_average_degree_warmuth_c5.html'>Projected Double Density or Projected Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/effective_vc_radius_warmuth_c5.html'>Effective VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_largest_order_shattered_set_warmuth_c5.html'>Minimum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_teaching_set_size_warmuth_c5.html'>Minimum Teaching Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_teaching_set_size_warmuth_c5.html'>Maximum Teaching Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/teaching_dimension_warmuth_c5.html'>Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/recursive_teaching_dimension_warmuth_c5.html'>Recursive Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/monotone_recursive_teaching_dimension_warmuth_c5.html'>Projected Recursive Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/monotonic_minimum_teaching_set_size_warmuth_c5.html'>Monotonic Minimum Teaching-Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/preferencebased_teaching_dimension_warmuth_c5.html'>Preference-Based Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/star_number_warmuth_c5.html'>Star Number of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_projected_teaching_set_size_warmuth_c5.html'>Maximum Projected Teaching-Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/log_shattering_warmuth_c5.html'>Log Shattering of Warmuth's $C_5$ Class</a></li><li><a href='values/log_size_ratio_warmuth_c5.html'>Log Size Ratio of Warmuth's $C_5$ Class</a></li><li><a href='values/membership_query_complexity_warmuth_c5.html'>Membership Query Complexity of Warmuth's $C_5$ Class</a></li><li><a href='values/littlestone_dimension_warmuth_c5.html'>Littlestone Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/equivalence_queries_complexity_warmuth_c5.html'>Equivalence Queries Complexity of Warmuth's $C_5$ Class</a></li><li><a href='values/interpolation_degree_warmuth_c5.html'>Interpolation Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/diameter_warmuth_c5.html'>Diameter of Warmuth's $C_5$ class</a></li><li><a href='values/relative_hitting_size_warmuth_c5.html'>Relative Hitting Size of Warmuth's $C_5$ class</a></li><li><a href='values/hitting_size_warmuth_c5.html'>Hitting Size of Warmuth's $C_5$ Class</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/minimum_largest_order_shattered_set_largest_strongly_shattered_set.html'>Minimum Largest Order Shattered Set / Largest Strongly Shattered Set</a></li><li><a href='relationships/minimum_teaching_set_size_effective_vc_radius.html'>Minimum Teaching Set Size / Effective VC Radius</a></li><li><a href='relationships/projected_maximal_degree_projected_minimum_degree.html'>Projected Maximal Degree / Projected Minimum Degree</a></li><li><a href='relationships/projected_strongly_shattered_dimension_largest_strongly_shattered_set.html'>Projected Strongly Shattered Dimension / Largest Strongly Shattered Set</a></li><li><a href='relationships/maximum_teaching_set_size_largest_strongly_shattered_set.html'>Maximum Teaching Set Size / Largest Strongly Shattered Set</a></li><li><a href='relationships/vc_dimension_densest_subgraph_twice.html'>VC Dimension / Densest Subgraph (twice)</a></li><li><a href='relationships/path_dimension_threshold_dimension.html'>Path Dimension / Threshold Dimension</a></li><li><a href='relationships/recursive_teaching_dimension_interpolation_degree.html'>Recursive Teaching Dimension / Interpolation degree</a></li><li><a href='relationships/diameter_oriented_diameter.html'>Diameter / Oriented Diameter</a></li><li><a href='relationships/recursive_teaching_dimension_effective_vc_radius.html'>Recursive Teaching Dimension / Effective VC Radius</a></li><li><a href='relationships/monotone_recursive_teaching_dimension_vc_dimension.html'>Projected Recursive Teaching Dimension / VC Dimension</a></li><li><a href='relationships/hamming_radius_oriented_diameter.html'>Hamming Radius / Oriented Diameter</a></li><li><a href='relationships/diameter_hamming_radius.html'>Diameter / Hamming Radius</a></li><li><a href='relationships/unlabeled_sample_compression_vc_dimension.html'>Unlabeled Sample Compression / VC Dimension</a></li><li><a href='relationships/diameter_littlestone_dimension.html'>Diameter / Littlestone Dimension</a></li><li><a href='relationships/maximum_teaching_set_size_maximum_degree.html'>Maximum Teaching-Set Size / Maximum Degree</a></li><li><a href='relationships/ _labeled_sample_compression_halfintervals.html'>Proper Stable Labeled Sample Compression of Half-intervals</a></li><li><a href='values/monotone_recursive_teaching_dimension_halfintervals.html'>Projected Recursive Teaching Dimension of Half-intervals</a></li><li><a href='values/extended_teaching_dimension_halfintervals.html'>Extended Teaching Dimension of Half-intervals</a></li><li><a href='values/projected_minimum_degree_halfintervals.html'>Projected Minimum Degree of Half-intervals</a></li><li><a href='values/projected_double_density_or_projected_average_degree_halfintervals.html'>Projected Double Density or Projected Average Degree of Half-intervals</a></li><li><a href='values/order_sample_compression_halfintervals.html'>Order Sample Compression of Half-intervals</a></li><li><a href='values/proper_ordered_sample_compression_halfintervals.html'>Proper Ordered Sample Compression of Half-intervals</a></li><li><a href='values/unlabeled_sample_compression_halfintervals.html'>Unlabeled Sample Compression of Half-intervals</a></li><li><a href='values/proper_unlabeled_sample_compression_halfintervals.html'>Proper Unlabeled Sample Compression of Half-intervals</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/teaching_dimension_recursive_teaching_dimension.html'>Teaching Dimension / Recursive Teaching Dimension</a></li><li><a href='relationships/threshold_dimension_vc_dimension.html'>Threshold Dimension / VC Dimension</a></li><li><a href='relationships/log_shattering_effective_range.html'>Log Shattering / Effective Range</a></li><li><a href='relationships/vc_dimension_log_shattering.html'>VC Dimension / Log Shattering</a></li><li><a href='relationships/maximum_degree_degeneracy.html'>Maximum Degree / Degeneracy</a></li><li><a href='relationships/maximum_degree_maximum_positive_degree.html'>Maximum Degree / Maximum Positive Degree</a></li><li><a href='relationships/log_size_size.html'>Log Size / Size</a></li><li><a href='relationships/littlestone_dimension_vc_dimension.html'>Littlestone Dimension / VC Dimension</a></li><li><a href='relationships/size_proper_equivalence_queries_complexity.html'>Size / Proper Equivalence Queries Complexity</a></li><li><a href='relationships/threshold_dimension_littlestone_dimension.html'>Threshold Dimension / Littlestone Dimension</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__25": "\n    <div class=\"table-card\" id=\"math-28\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/order_sample_compression_monotonic_projected_minimum_teaching_set_size.html\" class=\"table-title-link\">Order Sample Compression / Monotonic Projected Minimum Teaching Set Size</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Order Sample Compression / Monotonic Projected Minimum Teaching Set Size</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/order_sample_compression.html\">Order Sample Compression</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/monotonic_projected_minimum_teaching_set_size.html\">Monotonic Projected Minimum Teaching Set Size</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes. The order-compression lower bound is preserved under both subclasses and coordinate projections.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Darnstadt, Kiss, Simon, and Zilles prove that order-compression number lower-bounds projected recursive teaching dimension, by projecting a maximal teaching plan (Theorem 4). Applying the same statement to every subclass, together with restriction of an order scheme to a subclass and its projection, gives the max-over-subclasses-and-projections minimum-teaching-set formulation.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#darnstadt2016order\">[darnstadt2016order]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__26": "\n    <div class=\"table-card\" id=\"math-29\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/littlestone_dimension_monotonic_projected_minimum_teaching_set_size.html\" class=\"table-title-link\">Littlestone Dimension / Monotonic Projected Minimum Teaching Set Size</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Littlestone Dimension / Monotonic Projected Minimum Teaching Set Size</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/littlestone_dimension.html\">Littlestone Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/monotonic_projected_minimum_teaching_set_size.html\">Monotonic Projected Minimum Teaching Set Size</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes; the right-hand side maximizes minimum teaching-set size over subclasses and coordinate projections.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Doliwa, Fan, Simon, and Zilles cite Kuhlmann's bound from minimum teaching-set size to self-directed learning, and prove that the optimal online mistake bound is twofold monotone (Corollary 8). The optimal online mistake bound is Littlestone dimension. Apply the bound to every subclass and projection, then take the maximum.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#doliwa2014recursive\">[doliwa2014recursive]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__27": "\n    <div class=\"table-card\" id=\"math-31\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/prop tive_teaching_dimension_singletons.html'>Positive Teaching Dimension of Singletons</a></li><li><a href='values/positive_recursive_teaching_dimension_singletons.html'>Positive Recursive Teaching Dimension of Singletons</a></li><li><a href='values/labeled_sample_compression_singletons.html'>Labeled Sample Compression of Singletons</a></li><li><a href='values/proper_labeled_sample_compression_singletons.html'>Proper Labeled Sample Compression of Singletons</a></li><li><a href='values/majority_complexity_singletons.html'>Majority Complexity of Singletons</a></li><li><a href='values/unlabeled_sample_compression_singletons.html'>Unlabeled Sample Compression of Singletons</a></li><li><a href='values/proper_unlabeled_sample_compression_singletons.html'>Proper Unlabeled Sample Compression of Singletons</a></li><li><a href='values/stable_unlabeled_complexity_singletons.html'>Stable Unlabeled Complexity of Singletons</a></li><li><a href='values/stable_labeled_sample_compression_singletons.html'>Stable Labeled Sample Compression of Singletons</a></li><li><a href='values/interpolation_degree_singletons.html'>Interpolation Degree of Singletons</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/projected_maximal_degree_maximum_degree.html'>Projected Maximal Degree / Maximum Degree</a></li><li><a href='relationships/yang_dimension_vc_dimension.html'>Yang dimension / VC Dimension</a></li><li><a href='relationships/proper_ordered_sample_compression_order_sample_compression.html'>Proper Ordered Sample Compression / Order Sample Compression</a></li><li><a href='relationships/projected_minimum_degree_minimum_degree.html'>Projected Minimum Degree / Minimum Degree</a></li><li><a href='relationships/projected_double_density_or_projected_average_degree_double_density_or_average_degree.html'>Projected Double Density or Projected Average Degree / Double Density or Average Degree</a></li><li><a hr t classes; proper ordered compression is a restricted form of proper labeled compression.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Every proper order sample-compression scheme is, after forgetting its order requirement, a proper labeled sample-compression scheme. Minimizing over the smaller class of ordered schemes cannot give a smaller value.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#darnstadt2016order\">[darnstadt2016order]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__29": "\n    <div class=\"table-card\" id=\"math-33\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/threshold_dimension_vc_dimension.html\" class=\"table-title-link\">Threshold Dimension / VC Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Threshold Dimension / VC Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/threshold_dimension.html\">Threshold Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/vc_dimension.html\">VC Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes, threshold dimension dominates VC dimension.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/halfintervals.html\">Half-intervals</a></p>\n<p><strong>Status:</strong> </p>\n\n<strong>Full Proof:</strong><div class=\"text-field\"><p>Full proof in the LaTeX survey: Lemma <code>lem:elementary-parameter-hierarchy</code>.</p></div>\n\n\n\n        </div>\n    </div>\n    ", "__label__29": "\n    <div class=\"table-card\" id=\"math-5\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/halfintervals.html\" class=\"table-title-link\">Half-intervals</a></h3>\n        <div class=\"table-details\">\n
