alf-intervals</a></li><li><a href='values/noclashing_teaching_dimension_halfintervals.html'>No-Clashing Teaching Dimension of Half-intervals</a></li><li><a href='values/labeled_sample_compression_halfintervals.html'>Labeled Sample Compression of Half-intervals</a></li><li><a href='values/proper_labeled_sample_compression_halfintervals.html'>Proper Labeled Sample Compression of Half-intervals</a></li><li><a href='values/stable_labeled_sample_compression_halfintervals.html'>Stable Labeled Sample Compression of Half-intervals</a></li><li><a href='values/proper_stable_labeled_sample_compression_halfintervals.html'>Proper Stable Labeled Sample Compression of Half-intervals</a></li><li><a href='values/monotone_recursive_teaching_dimension_halfintervals.html'>Projected Recursive Teaching Dimension of Half-intervals</a></li><li><a href='values/extended_teaching_dimension_halfintervals.html'>Extended Teaching Dimension of Half-intervals</a></li><li><a href='values/projected_minimum_degree_halfintervals.html'>Projected Minimum Degree of Half-intervals</a></li><li><a href='values/projected_double_density_or_projected_average_degree_halfintervals.html'>Projected Double Density or Projected Average Degree of Half-intervals</a></li><li><a href='values/order_sample_compression_halfintervals.html'>Order Sample Compression of Half-intervals</a></li><li><a href='values/proper_ordered_sample_compression_halfintervals.html'>Proper Ordered Sample Compression of Half-intervals</a></li><li><a href='values/unlabeled_sample_compression_halfintervals.html'>Unlabeled Sample Compression of Half-intervals</a></li><li><a href='values/proper_unlabeled_sample_compression_halfintervals.html'>Proper Unlabeled Sample Compression of Half-intervals</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/teaching_dimension_recursive_teaching_dimension.html'>Teaching Dimension / Recursive Teaching Dimension</a></li><li><a href='relationships/threshold_dimension_vc_dimension.html'>Threshold Dimension / VC Dimension</a></li><li><a href='relationships/log_shattering_effective_range.html'>Log Shattering / Effective Range</a></li><li><a href='relationships/vc_dimension_log_shattering.html'>VC Dimension / Log Shattering</a></li><li><a href='relationships/maximum_degree_degeneracy.html'>Maximum Degree / Degeneracy</a></li><li><a href='relationships/maximum_degree_maximum_positive_degree.html'>Maximum Degree / Maximum Positive Degree</a></li><li><a href='relationships/log_size_size.html'>Log Size / Size</a></li><li><a href='relationships/littlestone_dimension_vc_dimension.html'>Littlestone Dimension / VC Dimension</a></li><li><a href='relationships/size_proper_equivalence_queries_complexity.html'>Size / Proper Equivalence Queries Complexity</a></li><li><a href='relationships/threshold_dimension_littlestone_dimension.html'>Threshold Dimension / Littlestone Dimension</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__136": "\n    <div class=\"table-card\" id=\"math-44\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/positive_teaching_dimension_positive_noclashing_teaching_dimension.html\" class=\"table-title-link\">Positive Teaching Dimension / Positive No-Clashing Teaching Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Positive Teaching Dimension / Positive No-Clashing Teaching Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/positive_teaching_dimension.html\">Positive Teaching Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/positive_noclashing_teaching_dimension.html\">Positive No-Clashing Teaching Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>A positive teaching set uniquely identifies its target among all concepts, hence is in particular non-clashing with every other assigned teaching set.  Minimizing over positive teacher mappings yields the inequality.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#KSZ2019\">[KSZ2019]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__137": "\n    <div class=\"table-card\" id=\"math-60\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/distinguishing_range_log_size.html\" class=\"table-title-link\">Distinguishing Range / Log Size</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Distinguishing Range / Log Size</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/distinguishing_range.html\">Distinguishing Range</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/log_size.html\">Log Size</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Lemma</p></div>\n\n<p><strong>Status:</strong> </p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>On a distinguishing coordinate set $S$, the $|\\mathcal{H}|$ concepts have pairwise distinct binary restrictions.  There are only $2^{|S|}$ such restrictions, so $|\\mathcal{H}|\\le2^{|S|}$.  Minimizing over $S$ gives $\\mathrm{R}(\\mathcal{H})\\ge\\log|\\mathcal{H}|$.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__138": "\n    <div class=\"table-card\" id=\"math-65\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/projected_maximal_degree_projected_minimum_degree.html\" class=\"table-title-link\">Projected Maximal Degree / Projected Minimum Degree</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Projected Maximal Degree / Projected Minimum Degree</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/projected_maximal_degree.html\">Projected Maximal Degree</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/projected_minimum_degree.html\">Projected Minimum Degree</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/warmuth_c5.html\">Warmuth's $C_5$ class</a></p>\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>For every projection, maximum degree is at least minimum degree.  Taking maxima over projections preserves the inequality.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__label__138": "\n    <div class=\"table-card\" id=\"math-10\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/warmuth_c5.html\" class=\"table-title-link\">Warmuth's $C_5$ class</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Warmuth's $C_5$ class</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"C_5\">\n            \\[C_5\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Let the domain be the cyclic group $\\mathbb{Z}/5\\mathbb{Z}$.  A binary function belongs to $C_5$ precisely when, on some four consecutive cyclic positions, its values are $1,0,0,1$ in that order.  The value on the remaining position is unrestricted, so the class has ten functions.</p></div>\n<strong>Comments:</strong><div class=\"text-field\"><p>This is also called Warmuth's example.  It is a finite separation between unlabeled sample-compression size and VC dimension.</p></div>\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/vc_dimension_warmuth_c5.html'>VC Dimension of Warmuth's $C_5$ class</a></li><li><a href='values/unlabeled_sample_compression_warmuth_c5.html'>Unlabeled Sample Compression of Warmuth's $C_5$ class</a></li><li><a href='values/size_warmuth_c5.html'>Size of Warmuth's $C_5$ class</a></li><li><a href='values/effective_range_warmuth_c5.html'>Effective Range of Warmuth's $C_5$ class</a></li><li><a href='values/log_size_warmuth_c5.html'>Log Size of Warmuth's $C_5$ class</a></li><li><a href='values/largest_shattered_set_warmuth_c5.html'>Largest Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_largest_order_shattered_set_warmuth_c5.html'>Maximum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_vc_radius_warmuth_c5.html'>Projected VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_strongly_shattered_dimension_warmuth_c5.html'>Projected Strongly Shattered Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_degree_warmuth_c5.html'>Maximum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_degree_warmuth_c5.html'>Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/double_density_or_average_degree_warmuth_c5.html'>Double Density or Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/densest_subgraph_twice_warmuth_c5.html'>Densest Subgraph (twice) of Warmuth's $C_5$ Class</a></li><li><a href='values/hamming_radius_warmuth_c5.html'>Hamming Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/oriented_diameter_warmuth_c5.html'>Oriented Diameter of Warmuth's $C_5$ Class</a></li><li><a href='values/threshold_dimension_warmuth_c5.html'>Threshold Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/path_dimension_warmuth_c5.html'>Path Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/degeneracy_warmuth_c5.html'>Degeneracy of Warmuth's $C_5$ Class</a></li><li><a href='values/largest_strongly_shattered_set_warmuth_c5.html'>Largest Strongly Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_positive_degree_warmuth_c5.html'>Maximum Positive Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_maximal_degree_warmuth_c5.html'>Projected Maximal Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_minimum_degree_warmuth_c5.html'>Projected Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_double_density_or_projected_average_degree_warmuth_c5.html'>Projected Double Density or Projected Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/effective_vc_radius_warmuth_c5.html'>Effective VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_largest_order_shattered_set_warmuth_c5.html'>Minimum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_teaching_set_size_warmuth_c5.html'>Minimum Teaching Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_teaching_set_size_warmuth_c5.html'>Maximum Teaching Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/teaching_dimension_warmuth_c5.html'>Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/recursive_teaching_dimension_warmuth_c5.html'>Recursive Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/monotone_recursive_teaching_dimension_warmuth_c5.html'>Projected Recursive Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/monotonic_minimum_teaching_set_size_warmuth_c5.html'>Monotonic Minimum Teaching-Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/preferencebased_teaching_dimension_warmuth_c5.html'>Preference-Based Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/star_number_warmuth_c5.html'>Star Number of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_projected_teaching_set_size_warmuth_c5.html'>Maximum Projected Teaching-Set Size of Warmuth's $C_5$ Class</a></li><li><a le-details\">\n        <p><strong>Name: </strong>Maximum Largest Order Shattered Set / Minimum Largest Order Shattered Set</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/maximum_largest_order_shattered_set.html\">Maximum Largest Order Shattered Set</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/minimum_largest_order_shattered_set.html\">Minimum Largest Order Shattered Set</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Definition</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Both parameters optimize the largest order-shattered-set size over the same set of domain orders; a maximum is at least the corresponding minimum.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__140": "\n    <div class=\"table-card\" id=\"math-77\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/maximum_degree_largest_strongly_shattered_set.html\" class=\"table-title-link\">Maximum Degree / Largest Strongly Shattered Set</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Maximum Degree / Largest Strongly Shattered Set</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/maximum_degree.html\">Maximum Degree</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/largest_strongly_shattered_set.html\">Largest Strongly Shattered Set</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Every contained cube has a vertex with one neighbour in each cube coordinate.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/singletons_plus_empty_set.html\">Singletons plus empty set</a></p>\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>A strongly shattered set of size $d$ gives a contained $d$-cube.  Each cube vertex has $d$ cube neighbours in the $1$-inclusion graph, so the ambient maximum degree is at least $d$.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__label__140": "\n    <div class=\"table-card\" id=\"math-4\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/singletons_plus_empty_set.html\" class=\"table-title-link\">Singletons plus empty set</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Singletons plus empty set</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\{\\{i\\}\\}_{1\\le i\\le n}\\cup\\{\\emptyset\\}\">\n            \\[\\{\\{i\\}\\}_{1\\le i\\le n}\\cup\\{\\emptyset\\}\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>All singletons and the empty set</p></div>\n\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/recursive_teaching_dimension_singletons_plus_empty_set.html'>Recursive Teaching Dimension of Singletons plus empty set</a></li><li><a href='values/star_number_singletons_plus_empty_set.html'>Star number of Singletons plus empty set</a></li><li><a href='values/covc_dimension_singletons_plus_empty_set.html'>co-VC dimension of Singletons plus empty set</a></li><li><a href='values/oriented_diameter_singletons_plus_empty_set.html'>Oriented Diameter of Singletons plus empty set</a></li><li><a href='values/maximum_degree_singletons_plus_empty_set.html'>Maximum Degree of Singletons plus empty set</a></li><li><a href='values/largest_strongly_shattered_set_singletons_plus_empty_set.html'>Largest Strongly Shattered Set of Singletons plus empty set</a></li><li><a href='values/size_singletons_plus_empty_set.html'>Size of Singletons plus empty set</a></li><li><a href='values/effective_range_singletons_plus_empty_set.html'>Effective Range of Singleto _set.html'>Majority Complexity of Singletons plus empty set</a></li><li><a href='values/random_equivalence_queries_complexity_singletons_plus_empty_set.html'>Random Equivalence Queries Complexity of Singletons plus empty set</a></li><li><a href='values/random_proper_equivalence_queries_complexity_singletons_plus_empty_set.html'>Random Proper Equivalence Queries Complexity of Singletons plus empty set</a></li><li><a href='values/monotone_recursive_teaching_dimension_singletons_plus_empty_set.html'>Projected Recursive Teaching Dimension of Singletons plus empty set</a></li><li><a href='values/projected_membership_queries_complexity_singletons_plus_empty_set.html'>Projected Membership Queries Complexity of Singletons plus empty set</a></li><li><a href='values/membership_and_equivalence_queries_complexity_singletons_plus_empty_set.html'>Membership and Equivalence Queries Complexity of Singletons plus empty set</a></li><li><a href='values/membership_and_proper_equivalence_queries_complexity_singletons_plus_empty_set.html'>Membership and Proper Equivalence Queries Complexity of Singletons plus empty set</a></li><li><a href='values/partial_equivalence_queries_complexity_singletons_plus_empty_set.html'>Partial Equivalence Queries Complexity of Singletons plus empty set</a></li><li><a href='values/unlabeled_sample_compression_singletons_plus_empty_set.html'>Unlabeled Sample Compression of Singletons plus Empty Set</a></li><li><a href='values/proper_unlabeled_sample_compression_singletons_plus_empty_set.html'>Proper Unlabeled Sample Compression of Singletons plus Empty Set</a></li><li><a href='values/stable_unlabeled_complexity_singletons_plus_empty_set.html'>Stable Unlabeled Complexity of Singletons plus Empty Set</a></li><li><a href='values/proper_stable_sample_compression_singletons_plus_empty_set.html'>Proper Stable Sample Compression of Singletons plus Empty Set</a></li><li><a href='values/stable_labeled_sample_compression_singletons_plus_empty_set.html'>Stable Labeled Sample Compression of Singletons plus Empty Set</a></li><li><a href='values/proper_stable_labeled_sample_compression_singletons_plus_empty_set.html'>Proper Stable Labeled Sample Compression of Singletons plus Empty Set</a></li><li><a href='values/distinguishing_range_singletons_plus_empty_set.html'>Distinguishing Range of Singletons plus Empty Set</a></li><li><a href='values/interpolation_degree_singletons_plus_empty_set.html'>Interpolation Degree of Singletons plus Empty Set</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/maximum_degree_largest_strongly_shattered_set.html'>Maximum Degree / Largest Strongly Shattered Set</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__141": "\n    <div class=\"table-card\" id=\"math-79\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/maximum_teaching_set_size_largest_strongly_shattered_set.html\" class=\"table-title-link\">Maximum Teaching Set Size / Largest Strongly Shattered Set</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Maximum Teaching Set Size / Largest Strongly Shattered Set</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/maximum_teaching_set_size.html\">Maximum Teaching Set Size</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/largest_strongly_shattered_set.html\">Largest Strongly Shattered Set</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>A corner of a contained cube must be distinguished on every cube coordinate.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/warmuth_c5.html\">Warmuth's $C_5$ class</a></p>\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>For a contained $d$-cube, choose any corner.  For each of the $d$ cube coordinates there is a neighbouring concept differing only there, so every teaching set for that corner must include all $d$ coordinates.  Thus the maximum teaching-set size is at least $d$.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#shinohara1991teachability\">[shinohara1991teachability]</a> <a href=\"bibliography.html#goldman1995complexity\">[goldman1995complexity]</a></p></div>\n\n        </div>\n    </div>\n    ", "__label__141": "\n    <div class=\"table-card\" id=\"math-10\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/warmuth_c5.html\" class=\"table-title-link\">Warmuth's $C_5$ class</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Warmuth's $C_5$ class</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"C_5\">\n            \\[C_5\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Let the domain be the cyclic group $\\mathbb{Z}/5\\mathbb{Z}$.  A binary function belongs to $C_5$ precisely when, on some four consecutive cyclic positions, its values are $1,0,0,1$ in that order.  The value on the remaining position is unrestricted, so the class has ten functions.</p></div>\n<strong>Comments:</strong><div class=\"text-field\"><p>This is also called Warmuth's example.  It is a finite separation between unlabeled sample-compression size and VC dimension.</p></div>\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/vc_dimension_warmuth_c5.html'>VC Dimension of Warmuth's $C_5$ class</a></li><li><a href='values/unlabeled_sample_compression_warmuth_c5.html'>Unlabeled Sample Compression of Warmuth's $C_5$ class</a></li><li><a href='values/size_warmuth_c5.html'>Size of Warmuth's $C_5$ class</a></li><li><a href='values/effective_range_warmuth_c5.html'>Effective Range of Warmuth's $C_5$ class</a> Yang dimension / VC Dimension</a></li><li><a href='relationships/proper_ordered_sample_compression_order_sample_compression.html'>Proper Ordered Sample Compression / Order Sample Compression</a></li><li><a href='relationships/projected_minimum_degree_minimum_degree.html'>Projected Minimum Degree / Minimum Degree</a></li><li><a href='relationships/projected_double_density_or_projected_average_degree_double_density_or_average_degree.html'>Projected Double Density or Projected Average Degree / Double Density or Average Degree</a></li><li><a href='relationships/yang_dimension_covc_dimension.html'>Yang dimension / co-VC dimension</a></li><li><a href='relationships/effective_range_vc_dimension.html'>Effective Range / VC Dimension</a></li><li><a href='relationships/effective_range_diameter.html'>Effective Range / Diameter</a></li><li><a href='relationships/effective_range_hamming_radius.html'>Effective Range / Hamming Radius</a></li><li><a href='relationships/size_littlestone_dimension.html'>Size / Littlestone Dimension</a></li><li><a href='relationships/size_yang_dimension.html'>Size / Yang dimension</a></li><li><a href='relationships/effective_range_log_shattering.html'>Effective Range / Log Shattering</a></li><li><a href='relationships/membership_query_complexity_log_size.html'>Membership Query Complexity / Log Size</a></li><li><a href='relationships/membership_and_proper_equivalence_queries_complexity_membership_and_equivalence_queries_complexity.html'>Membership and Proper Equivalence Queries Complexity / Membership and Equivalence Queries Complexity</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__147": "\n    <div class=\"table-card\" id=\"math-115\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/log_shattering_majority_complexity.html\" class=\"table-title-link\">Log Shattering / Majority Complexity</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Log Shattering / Majority Complexity</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/log_shattering.html\">Log Shattering</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/majority_complexity.html\">Majority Complexity</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Pajor's sandwich theorem bounds log size by log shattering, and halving uses at most log size.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>The sandwich theorem gives $|\\mathcal H|\\leq |\\operatorname{sh}(\\mathcal H)|$.  Taking binary logarithms yields $\\log|\\mathcal H|\\leq\\log|\\operatorname{sh}(\\mathcal H)|$.  The pointwise-majority halving algorithm uses at most $\\log|\\mathcal H|$ queries, so its complexity is at most log shattering.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#bollobas1995defect\">[bollobas1995defect]</a> <a href=\"bibliography.html#maass1992lower\">[maass1992lower]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__148": "\n    <div class=\"table-card\" id=\"math-127\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/vc_dimension_log_size_ratio.html\" class=\"table-title-link\">VC Dimension / Log Size Ratio</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>VC Dimension / Log Size Ratio</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/vc_dimension.html\">VC Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/log_size_ratio.html\">Log Size Ratio</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge cP_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Theorem</p></div>\n<p><strong>Witness: </strong><a href=\"classes/full_cube.html\">Full Cube</a></p>\n<p><strong>Status:</strong> </p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Let $d=\\mathrm{VC}(\\mathcal H)$ and let $n$ be the domain size.  Sauer--Shelah gives $|\\mathcal H|\\le\\sum_{i=0}^{d}\\binom ni\\le(n+1)^d$.  Therefore $d\\ge\\log(|\\mathcal H|)/\\log(n+1)$, which is the asserted bound up to the harmless $-1$ normalization in Log Size Ratio.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#vapnik1971uniform\">[vapnik1971uniform]</a></p></div>\n\n        </div>\n    </div>\n    ", "__label__148": "\n    <div class=\"table-card\" id=\"math-3\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/full_cube.html\" class=\"table-title-link\">Full Cube</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Full Cube</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\{S:S\\subset [n]\\}\">\n            \\[\\{S:S\\subset [n]\\}\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>All concepts, i.e. the powerset of the range.</p></div>\n\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/recursive_teaching_dimension_full_cube.html'>Recursive Teaching Dimension of Full Cube</a></li><li><a href='values/star_number_full_cube.html'>Star number of Full Cube</a></li><li><a href='values/covc_dimension_full_cube.html'>co-VC dimension of Full Cube</a></li><li><a href='values/maximum_degree_full_cube.html'>Maximum Degree of Full Cube</a></li><li><a href='values/largest_strongly_shattered_set_full_cube.html'>Largest Strongly Shattered Set of Full Cube</a></li><li><a href='values/size_full_cube.html'>Size of Full Cube</a></li><li><a href='values/effective_range_full_cube.html'>Effective Range of Full Cube</a></li><li><a href='values/vc_dimension_full_cube.html'>VC Dimension of Full Cube</a></li><li><a href='values/threshold_dimensi onic_projected_minimum_teaching_set_size_full_cube.html'>Monotonic Projected Minimum Teaching-Set Size of the Full Cube</a></li><li><a href='values/equivalence_queries_complexity_full_cube.html'>Equivalence Queries Complexity of Full Cube</a></li><li><a href='values/hitting_size_full_cube.html'>Hitting Size of Full Cube</a></li><li><a href='values/distinguishing_range_full_cube.html'>Distinguishing Range of Full Cube</a></li><li><a href='values/dual_sign_rank_full_cube.html'>Dual Sign Rank of Full Cube</a></li><li><a href='values/interpolation_degree_full_cube.html'>Interpolation Degree of Full Cube</a></li><li><a href='values/positive_teaching_dimension_full_cube.html'>Positive Teaching Dimension of Full Cube</a></li><li><a href='values/positive_recursive_teaching_dimension_full_cube.html'>Positive Recursive Teaching Dimension of Full Cube</a></li><li><a href='values/majority_complexity_full_cube.html'>Majority Complexity of Full Cube</a></li><li><a href='values/monotone_recursive_teaching_dimension_full_cube.html'>Projected Recursive Teaching Dimension of Full Cube</a></li><li><a href='values/projected_membership_queries_complexity_full_cube.html'>Projected Membership Queries Complexity of Full Cube</a></li><li><a href='values/unlabeled_sample_compression_full_cube.html'>Unlabeled Sample Compression of Full Cube</a></li><li><a href='values/proper_unlabeled_sample_compression_full_cube.html'>Proper Unlabeled Sample Compression of Full Cube</a></li><li><a href='values/stable_unlabeled_complexity_full_cube.html'>Stable Unlabeled Complexity of Full Cube</a></li><li><a href='values/proper_stable_sample_compression_full_cube.html'>Proper Stable Sample Compression of Full Cube</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/covc_dimension_effective_vc_radius.html'>co-VC dimension / Effective VC Radius</a></li><li><a href='relationships/size_vc_dimension.html'>Size / VC Dimension</a></li><li><a href='relationships/size_path_dimension.html'>Size / Path Dimension</a></li><li><a href='relationships/vc_dimension_log_size_ratio.html'>VC Dimension / Log Size Ratio</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__149": "\n    <div class=\"table-card\" id=\"math-142\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/membership_query_complexity_relative_hitting_size.html\" class=\"table-title-link\">Membership Query Complexity / Relative Hitting Size</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Membership Query Complexity / Relative Hitting Size</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/membership_query_complexity.html\">Membership Query Complexity</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/relative_hitting_size.html\">Relative Hitting Size</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>The query transcript identifying a fixed target is a teaching set for that target.</p></div>\n\n<p><strong>Status:</strong> </p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Fix a target $h$ and run any membership-query learner that identifies it.  The coordinates queried on the path leading to $h$ must distinguish $h$ from every other concept; otherwise that concept gives the same transcript and the learner cannot identify the target.  Thus they form a teaching set for $h$, of size at most $\\mathrm{Q}_m(\\mathcal{H})$.  Maximizing over $h$ yields $\\mathrm{RHT}(\\mathcal{H})\\le\\mathrm{Q}_m(\\mathcal{H})$.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__150": "\n    <div class=\"table-card\" id=\"math-164\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/klittlestone_dimension_kge3_vc_dimension.html\" class=\"table-title-link\">$k$-Littlestone Dimension ($k\\ge3$) / VC Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>$k$-Littlestone Dimension ($k\\ge3$) / VC Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/klittlestone_dimension_kge3.html\">$k$-Littlestone Dimension ($k\\ge3$)</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/vc_dimension.html\">VC Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>A shattered set yields a realizable decision tree, hence a $k$-shattered tree.</p></div>\n\n<p><strong>Status:</strong> </p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>If a set of size $d$ is VC-shattered, place its points in the same order on every level of a complete binary tree of depth $d$.  Each branch is realized exactly by a hypothesis from the class, so the tree is 0-shattered and therefore $k$-shattered.  Thus $\\mathrm{L}_k(\\mathcal{H})\\ge\\mathrm{VC}(\\mathcal{H})$.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#filmus2023randomized\">[filmus2023randomized]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__151": "\n    <div class=\"table-card\" id=\"math-170\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/diameter_littlestone_dimension.html\" class=\"table-title-link\">Diameter / Littlestone Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Diameter / Littlestone Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/diameter.html\">Diameter</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/littlestone_dimension.html\">Littlestone Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes, diameter dominates Littlestone dimension.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/warmuth_c5.html\">Warmuth's $C_5$ class</a></p>\n<p><strong>Status:</strong> Established</p>\n\n<strong>Full Proof:</strong><div class=\"text-field\"><p>LaTeX survey, Littlestone/diameter lemma (lem:littlestone-diameter).</p></div>\n\n\n\n        </div>\n    </div>\n    ", "__label__151": "\n    <div class=\"table-card\" id=\"math-10\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/warmuth_c5.html\" class=\"table-title-link\">Warmuth's $C_5$ class</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Warmuth's $C_5$ class</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"C_5\">\n            \\[C_5\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Let the domain be the cyclic group $\\mathbb{Z}/5\\mathbb{Z}$.  A binary function belongs to $C_5$ precisely when, on some four consecutive cyclic positions, its values are $1,0,0,1$ in that order.  The value on the remaining position is unrestricted, so the class has ten functions.</p></div>\n<strong>Comments:</strong><div class=\"text-field\"><p>This is also called Warmuth's example.  It is a finite separation between unlabeled sample-compression size and VC dimension.</p></div>\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/vc_dimension_warmuth_c5.html'>VC Dimension of Warmuth's $C_5$ class</a></li><li><a href='values/unlabeled_sample_compression_warmuth_c5.html'>Unlabeled Sample Compression of Warmuth's $C_5$ class</a></li><li><a href='values/size_warmuth_c5.html'>Size of Warmuth's $C_5$ class</a></li><li><a href='values/effective_range_warmuth_c5.html'>Effective Range of Warmuth's $C_5$ class</a></li><li><a href='values/log_size_warmuth_c5.html'>Log Size of Warmuth's $C_5$ class</a></li><li><a href='values/largest_shattered_set_warmuth_c5.html'>Largest Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_largest_order_shattered_set_warmuth_c5.html'>Maximum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_vc_radius_warmuth_c5.html'>Projected VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_strongly_shattered_dimension_warmuth_c5.html'>Projected Strongly Shattered Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_degree_warmuth_c5.html'>Maximum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_degree_warmuth_c5.html'>Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/double_density_or_average_degree_warmuth_c5.html'>Double Density or Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/densest_subgraph_twice_warmuth_c5.html'>Densest Subgraph (twice) of Warmuth's $C_5$ Class</a></li><li><a href='values/hamming_radius_warmuth_c5.html'>Hamming Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/oriented_diameter_warmuth_c5.html'>Oriented Diameter of Warmuth's $C_5$ Class</a></li><li><a href='values/threshold_dimension_warmuth_c5.html'>Threshold Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/path_dimension_warmuth_c5.html'>Path Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/degeneracy_warmuth_c5.html'>Degeneracy of Warmuth's $C_5$ Class</a></li><li><a href='values/largest_strongly_shattered_set_warmuth_c5.html'>Largest Strongly Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_positive_degree_warmuth_c5.html'>Maximum Positive Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_maximal_degree_warmuth_c5.html'>Projected Maximal Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_minimum_degree_warmuth_c5.html'>Projected Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_double_density_or_projected_average_degree_warmuth_c5.html'>Projected Double Density or Projected Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/effective_vc_radius_warmuth_c5.html'>Effective VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_largest_order_shattered_set_warmuth_c5.html'>Minimum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_teaching_set_size_warmuth_c5.html'>Minimum Teaching Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_teaching_set_size_warmuth_c5.html'>Maximum Teaching Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/teaching_dimension_warmuth_c5.html'>Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/recursive_teaching_dimension_warmuth_c5.html'>Recursive Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/monotone_recursive_teaching_dimension_warmuth_c5.html'>Projected Recursive Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/monotonic_minimum_teaching_set_size_warmuth_c5.html'>Monotonic Minimum Teaching-Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/preferencebased_teaching_dimension_warmuth_c5.html'>Preference-Based Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/star_number_warmuth_c5.html'>Star Number of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_projected_teaching_set_size_warmuth_c5.html'>Maximum Projected Teaching-Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/log_shattering_warmuth_c5.html'>Log Shattering of Warmuth's $C_5$ Class</a></li><li><a href='values/log_size_ratio_warmuth_c5.html'>Log Size Ratio of Warmuth's $C_5$ Class</a></li><li><a href='values/membership_query_complexity_warmuth_c5.html'>Membership Query Complexity of Warmuth's $C_5$ Class</a></li><li><a href='values/littlestone_dimension_warmuth_c5.html'>Littlestone Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/equivalence_queries_complexity_warmuth_c5.html'>Equivalence Queries Complexity of Warmuth's $C_5$ Class</a></li><li><a href='values/interpolation_degree_warmuth_c5.html'>Interpolation Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/diameter_warmuth_c5.html'>Diameter of Warmuth's $C_5$ class</a></li><li><a href='values/relative_hitting_size_warmuth_c5.html'>Relative Hitting Size of Warmuth's $C_5$ class</a></li><li><a href='values/hitting_size_warmuth_c5.html'>Hitting Size of Warmuth's $C_5$ Class</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/minimum_largest_order_shattered_set_largest_strongly_shattered_set.html'>Minimum Largest Order Shattered Set / Largest Strongly Shattered Set</a></li><li><a href='relationships/minimum_teaching_set_size_effective_vc_radius.html'>Minimum Teaching Set Size / Effective VC Radius</a></li><li><a href='relationships/projected_maximal_degree_projected_minimum_degree.html'>Projected Maximal Degree / Projected Minimum Degree</a></li><li><a href='relationships/projected_strongly_shattered_dimension_largest_strongly_shattered_set.html'>Projected Strongly Shattered Dimension / Largest Strongly Shattered Set</a></li><li><a href='relationships/maximum_teaching_set_size_largest_strongly_shattered_set.html'>Maximum Teaching Set Size / Largest Strongly Shattered Set</a></li><li><a href='relationships/vc_dimension_densest_subgraph_twice.html'>VC Dimension / Densest Subgraph (twice)</a></li><li><a href='relationships/path_dimension_threshold_dimension.html'>Path Dimension / Threshold Dimension</a></li><li><a href='relationships/recursive_teaching_dimension_interpolation_degree.html'>Recursive Teaching Dimension / Interpolation degree</a></li><li><a href='relationships/diameter_oriented_diameter.html'>Diameter / Oriented Diameter</a></li><li><a href='relationships/recursive_teaching_dimension_effective_vc_radius.html'>Recursive Teaching Dimension / Effective VC Radius</a></li><li><a href='relationships/monotone_recursive_teaching_dimension_vc_dimension.html'>Projected Recursive Teaching Dimension / VC Dimension</a></li><li><a href='relationships/hamming_radius_oriented_diameter.html'>Hamming Radius / Oriented Diameter</a></li><li><a href='relationships/diameter_hamming_radius.html'>Diameter / Hamming Radius</a></li><li><a href='relationships/unlabeled_sample_compression_vc_dimension.html'>Unlabeled Sample Compression / VC Dimension</a></li><li><a href='relationships/diameter_littlestone_dimension.html'>Diameter / Littlestone Dimension</a></li><li><a href='relationships/maximum_teaching_set_size_maximum_degree.html'>Maximum Teaching-Set Size / Maximum Degree</a></li><li><a href='relationships/minimum_teaching_set_size_minimum_degree.html'>Minimum Teaching-Set Size / Minimum Degree</a></li><li><a href='relationships/star_number_vc_dimension.html'>Star Number / VC Dimension</a></li><li><a href='relationships/effective_range_star_number.html'>Effective Range / Star Number</a></li><li><a href='relationships/size_star_number.html'>Size / Star Number</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__152": "\n    <div class=\"table-card\" id=\"math-173\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/log_size_littlestone_dimension.html\" class=\"table-title-link\">Log Size / Littlestone Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Log Size / Littlestone Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/log_size.html\">Log Size</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/littlestone_dimension.html\">Littlestone Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes, log-size dominates Littlestone dimension.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n\n<strong>Full Proof:</strong><div class=\"text-field\"><p>Full proof in the LaTeX survey: Lemma <code>lem:elementary-parameter-hierarchy</code>.</p></div>\n\n\n\n        </div>\n    </div>\n    ", "__edge__153": "\n    <div class=\"table-card\" id=\"math-174\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/star_number_vc_dimension.html\" class=\"table-title-link\">Star Number / VC Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Star Number / VC Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/star_number.html\">Star number</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/vc_dimension.html\">VC Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>A shattered set of size $d$ contains a realizable star of size $d$ after projection.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/warmuth_c5.html\">Warmuth's $C_5$ class</a></p>\n<p><strong>Status:</strong> Established</p>\n\n<strong>Full Proof:</strong><div class=\"text-field\"><p>Full proof in the LaTeX survey: Lemma <code>lem:elementary-parameter-hierarchy</code>.</p></div>\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#hanneke2015minimax\">[hanneke2015minimax]</a></p></div>\n\n        </div>\n    </div>\n    ", "__label__153": "\n    <div class=\"table-card\" id=\"math-10\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/warmuth_c5.html\" class=\"table-title-link\">Warmuth's $C_5$ class</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Warmuth's $C_5$ class</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"C_5\">\n            \\[C_5\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Let the domain be the cyclic group $\\mathbb{Z}/5\\mathbb{Z}$.  A binary function belongs to $C_5$ precisely when, on some four consecutive cyclic positions, its values are $1,0,0,1$ in that order.  The value on the remaining position is unrestricted, so the class has ten functions.</p></div>\n<strong>Comments:</strong><div class=\"text-field\"><p>This is also called Warmuth's example.  It is a finite separation between unlabeled sample-compression size and VC dimension.</p></div>\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/vc_dimension_warmuth_c5.html'>VC Dimension of Warmuth's $C_5$ class</a></li><li><a href='values/unlabeled_sample_compression_warmuth_c5.html'>Unlabeled Sample Compression of Warmuth's $C_5$ class</a></li><li><a href='values/size_warmuth_c5.html'>Size of Warmuth's $C_5$ class</a></li><li><a href='values/effective_range_warmuth_c5.html'>Effective Range of Warmuth's $C_5$ class</a></li><li><a href='values/log_size_warmuth_c5.html'>Log Size of Warmuth's $C_5$ class</a></li><li><a href='values/largest_shattered_set_warmuth_c5.html'>Largest Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_largest_order_shattered_set_warmuth_c5.html'>Maximum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_vc_radius_warmuth_c5.html'>Projected VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_strongly_shattered_dimension_warmuth_c5.html'>Projected Strongly Shattered Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_degree_warmuth_c5.html'>Maximum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_degree_warmuth_c5.html'>Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/double_density_or_average_degree_warmuth_c5.html'>Double Density or Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/densest_subgraph_twice_warmuth_c5.html'>Densest Subgraph ( domain be the cyclic group $\\mathbb{Z}/5\\mathbb{Z}$.  A binary function belongs to $C_5$ precisely when, on some four consecutive cyclic positions, its values are $1,0,0,1$ in that order.  The value on the remaining position is unrestricted, so the class has ten functions.</p></div>\n<strong>Comments:</strong><div class=\"text-field\"><p>This is also called Warmuth's example.  It is a finite separation between unlabeled sample-compression size and VC dimension.</p></div>\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/vc_dimension_warmuth_c5.html'>VC Dimension of Warmuth's $C_5$ class</a></li><li><a href='values/unlabeled_sample_compression_warmuth_c5.html'>Unlabeled Sample Compression of Warmuth's $C_5$ class</a></li><li><a href='values/size_warmuth_c5.html'>Size of Warmuth's $C_5$ class</a></li><li><a href='values/effective_range_warmuth_c5.html'>Effective Range of Warmuth's $C_5$ class</a></li><li><a href='values/log_size_warmuth_c5.html'>Log Size of Warmuth's $C_5$ class</a></li><li><a href='values/largest_shattered_set_warmuth_c5.html'>Largest Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_largest_order_shattered_set_warmuth_c5.html'>Maximum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_vc_radius_warmuth_c5.html'>Projected VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_strongly_shattered_dimension_warmuth_c5.html'>Projected Strongly Shattered Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_degree_warmuth_c5.html'>Maximum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_degree_warmuth_c5.html'>Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/double_density_or_average_degree_warmuth_c5.html'>Double Density or Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/densest_subgraph_twice_warmuth_c5.html'>Densest Subgraph (twice) of Warmuth's $C_5$ Class</a></li><li><a href='values/hamming_radius_warmuth_c5.html'>Hamming Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/oriented_diameter_warmuth_c5.html'>Oriented Diameter of Warmuth's $C_5$ Class</a></li><li><a href='values/threshold_dimension_warmuth_c5.html'>Threshold Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/path_dimension_warmuth_c5.html'>Path Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/degeneracy_warmuth_c5.html'>Degeneracy of Warmuth's $C_5$ Class</a></li><li><a href='values/largest_strongly_shattered_set_warmuth_c5.html'>Largest Strongly Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_positive_degree_warmuth_c5.html'>Maximum Positive Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_maximal_degree_warmuth_c5.html'>Projected Maximal Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_minimum_degree_warmuth_c5.html'>Projected Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_double_density_or_projected_average_degree_warmuth_c5.html'>Projected Double Density or Projected Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/effective_vc_radius_warmuth_c5.html'>Effective VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_largest_order_shattered_set_warmuth_c5.html'>Minimum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_teaching_set_size_warmuth_c5.html'>Minimum Teaching Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_teaching_set_size_warmuth_c5.html'>Maximum Teaching Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/teaching_dimension_warmuth_c5.html'>Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/recursive_teaching_dimension_warmuth_c5.html'>Recursive Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/monotone_recursive_teaching_dimension_warmuth_c5.html'>Projected Recursive Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/monotonic_minimum_teaching_set_size_warmuth_c5.html'>Monotonic Minimum Teaching-Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/preferencebased_teaching_dimension_warmuth_c5.html'>Preference-Based Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/star_number_warmuth_c5.html'>Star Number of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_projected_teaching_set_size_warmuth_c5.html'>Maximum Projected Teaching-Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/log_shattering_warmuth_c5.html'>Log Shattering of Warmuth's $C_5$ Class</a></li><li><a href='values/log_size_ratio_warmuth_c5.html'>Log Size Ratio of Warmuth's $C_5$ Class</a></li><li><a href='values/membership_query_complexity_warmuth_c5.html'>Membership Query Complexity of Warmuth's $C_5$ Class</a></li><li><a href='values/littlestone_dimension_warmuth_c5.html'>Littlestone Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/equivalence_queries_complexity_warmuth_c5.html'>Equivalence Queries Complexity of Warmuth's $C_5$ Class</a></li><li><a href='values/interpolation_degree_warmuth_c5.html'>Interpolation Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/diameter_warmuth_c5.html'>Diameter of Warmuth's $C_5$ class</a></li><li><a href='values/relative_hitting_size_warmuth_c5.html'>Relative Hitting Size of Warmuth's $C_5$ class</a></li><li><a href='values/hitting_size_warmuth_c5.html'>Hitting Size of Warmuth's $C_5$ Class</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/minimum_largest_order_shattered_set_largest_strongly_shattered_set.html'>Minimum Largest Order Shattered Set / Largest Strongly Shattered Set</a></li><li><a href='relationships/minimum_teaching_set_size_effective_vc_radius.html'>Minimum Teaching Set Size / Effective VC Radius</a></li><li><a href='relationships/projected_maximal_degree_projected_minimum_degree.html'>Projected Maximal Degree / Projected Minimum Degree</a></li><li><a href='relationships/projected_strongly_shattered_dimension_largest_strongly_shattered_set.html'>Projected Strongly Shattered Dimension / Largest Strongly Shattered Set</a></li><li><a href='relationships/maximum_teaching_set_size_largest_strongly_shattered_set.html'>Maximum Teaching Set Size / Largest Strongly Shattered Set</a></li><li><a href='relationships/vc_dimension_densest_subgraph_twice.html'>VC Dimension / Densest Subgraph (twice)</a></li><li><a href='relationships/path_dimension_threshold_dimension.html'>Path Dimension / Threshold Dimension</a></li><li><a href='relationships/recursive_teaching_dimension_interpolation_degree.html'>Recursive Teaching Dimension / Interpolation degree</a></li><li><a href='relationships/diameter_oriented_diameter.html'>Diameter / Oriented Diameter</a></li><li><a href='relationships/recursive_teaching_dimension_effective_vc_radius.html'>Recursive Teaching Dimension / Effective VC Radius</a></li><li><a href='relationships/monotone_recursive_teaching_dimension_vc_dimension.html'>Projected Recursive Teaching Dimension / VC Dimension</a></li><li><a href='relationships/hamming_radius_oriented_diameter.html'>Hamming Radius / Oriented Diameter</a></li><li><a href='relationships/diameter_hamming_radius.html'>Diameter / Hamming Radius</a></li><li><a href='relationships/unlabeled_sample_compression_vc_dimension.html'>Unlabeled Sample Compression / VC Dimension</a></li><li><a href='relationships/diameter_littlestone_dimension.html'>Diameter / Littlestone Dimension</a></li><li><a href='relationships/maximum_teaching_set_size_maximum_degree.html'>Maximum Teaching-Set Size / Maximum Degree</a></li><li><a href='relationships/minimum_teaching_set_size_minimum_degree.html'>Minimum Teaching-Set Size / Minimum Degree</a></li><li><a href='relationships/star_number_vc_dimension.html'>Star Number / VC Dimension</a></li><li><a href='relationships/effective_range_star_number.html'>Effective Range / Star Number</a></li><li><a href='relationships/size_star_number.html'>Size / Star Number</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__156": "\n    <div class=\"table-card\" id=\"math-185\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/effective_range_threshold_dimension.html\" class=\"table-title-link\">Effective Range / Threshold Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Effective Range / Threshold Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/effective_range.html\">Effective Range</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/threshold_dimension.html\">Threshold Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Every coordinate of a nontrivial threshold trace is active.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>A threshold trace on S contains concepts with different labels at every coordinate of S. Hence every coordinate of S belongs to the effective range, so (\\mathrm E(\\mathcal H)\\ge\\mathrm T(\\mathcal H)).</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__157": "\n    <div class=\"table-card\" id=\"math-186\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/effective_range_monotone_recursive_teaching_dimension.html\" class=\"table-title-link\">Effective Range / Projected Recursive Teaching Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Effective Range / Projected Recursive Teaching Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/effective_range.html\">Effective Range</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/monotone_recursive_teaching_dimension.html\">Projected Recursive Teaching Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Every coordinate projection has at most (\\mathrm E(\\mathcal H)) active coordinates. In every nonempty subfamily of such a projection, the full active-coordinate sample teaches any chosen concept, so each recursive teaching stage has a teaching set of size at most (\\mathrm E(\\mathcal H)). Taking the maximum over projections proves the bound.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__158": "\n    <div class=\"table-card\" id=\"math-187\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/effective_range_order_sample_compression.html\" class=\"table-title-link\">Effective Range / Order Sample Compression</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Effective Range / Order Sample Compression</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/effective_range.html\">Effective Range</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/order_sample_compression.html\">Order Sample Compression</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Fix an order of the class. Retain every example of the input sample whose coordinate is active, and decode to the least class member consistent with the retained sample. Inactive examples have the same label in every class member, so this remains consistent with the original sample. At most (\\mathrm E(\\mathcal H)) examples are retained.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__159": "\n    <div class=\"table-card\" id=\"math-189\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/effective_range_proper_unlabeled_sample_compression.html\" class=\"table-title-link\">Effective Range / Proper Unlabeled Sample Compression</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Effective Range / Proper Unlabeled Sample Compression</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/effective_range.html\">Effective Range</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/proper_unlabeled_sample_compression.html\">Proper Unlabeled Sample Compression</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Retain all active-coordinate examples and reconstruct a fixed least class member consistent with them. The retained examples include their observed labels, so the reconstruction is proper and consistent; inactive examples are irrelevant. The retained size is at most (\\mathrm E(\\mathcal H)).</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__160": "\n    <div class=\"table-card\" id=\"math-190\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/effective_range_proper_labeled_sample_compression.html\" class=\"table-title-link\">Effective Range / Proper Labeled Sample Compression</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Effective Range / Proper Labeled Sample Compression</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/effective_range.html\">Effective Range</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/proper_labeled_sample_compression.html\">Proper Labeled Sample Compression</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Retain the labeled examples on every active coordinate and reconstruct a fixed least consistent member of the class. Inactive examples are common to all class members, so this is consistent with the original sample and proper. Its size is at most (\\mathrm E(\\mathcal H)).</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__161": "\n    <div class=\"table-card\" id=\"math-191\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/effective_range_proper_stable_labeled_sample_compression.html\" class=\"table-title-link\">Effective Range / Proper Stable Labeled Sample Compression</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Effective Range / Proper Stable Labeled Sample Compression</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/effective_range.html\">Effective Range</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/proper_stable_labeled_sample_compression.html\">Proper Stable Labeled Sample Compression</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>The active-coordinate retention scheme is proper and consistent. It retains every active example, so removing an unretained (necessarily inactive) example does not change the retained sample or reconstruction; hence it is stable. Its size is at most (\\mathrm E(\\mathcal H)).</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__162": "\n    <div class=\"table-card\" id=\"math-194\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/size_dual_sign_rank.html\" class=\"table-title-link\">Size / Dual Sign Rank</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Size / Dual Sign Rank</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/size.html\">Size</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/dual_sign_rank.html\">Dual Sign Rank</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>A linearly independent column set has size at most the number of rows.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Every realizing matrix for the incidence sign matrix has (|\\mathcal H|) rows. A set of linearly independent columns in such a matrix has size at most its rank, hence at most (|\\mathcal H|). This applies to the fixed column set in the definition of dual sign rank.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__163": "\n    <div class=\"table-card\" id=\"math-195\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/effective_range_maximum_positive_degree.html\" class=\"table-title-link\">Effective Range / Maximum Positive Degree</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Effective Range / Maximum Positive Degree</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/effective_range.html\">Effective Range</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/maximum_positive_degree.html\">Maximum Positive Degree</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Every edge of the 1-inclusion graph uses an active coordinate.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>A smaller neighbor counted by the dominance of a concept differs from it on one coordinate. Such a coordinate is active. Therefore the positive degree of every vertex, and hence its maximum, is at most (\\mathrm E(\\mathcal H)).</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__164": "\n    <div class=\"table-card\" id=\"math-196\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/effective_range_positive_noclashing_teaching_dimension.html\" class=\"table-title-link\">Effective Range / Positive No-Clashing Teaching Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Effective Range / Positive No-Clashing Teaching Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/effective_range.html\">Effective Range</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/positive_noclashing_teaching_dimension.html\">Positive No-Clashing Teaching Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Assign each concept all of its positive active coordinates.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Assign h the positive examples on all active coordinates in h. For two distinct concepts, one has an active coordinate absent from the other; the positive sample of that concept is inconsistent with the other. Hence this assignment is non-clashing and has size at most (\\mathrm E(\\mathcal H)).</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__165": "\n    <div class=\"table-card\" id=\"math-35\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/log_shattering_effective_range.html\" class=\"table-title-link\">Log Shattering / Effective Range</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Log Shattering / Effective Range</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/log_shattering.html\">Log Shattering</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/effective_range.html\">Effective Range</a></p>\n<p><strong>Relationship Type:</strong> $P_1 \\ge c\\log P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Effective range is the number of shattered singletons</p></div>\n<p><strong>Witness: </strong><a href=\"classes/halfintervals.html\">Half-intervals</a></p>\n<p><strong>Status:</strong> </p>\n\n<strong>Full Proof:</strong><div class=\"text-field\"><p>LaTeX survey, effective-range/log-shattering lemma (lem:effective-range-log-shattering).</p></div>\n\n\n\n        </div>\n    </div>\n    ", "__label__165": "\n    <div class=\"table-card\" id=\"math-5\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/halfintervals.html\" class=\"table-title-link\">Half-intervals</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Half-intervals</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\{[i]\\}_{1\\le i\\le n}\">\n            \\[\\{[i]\\}_{1\\le i\\le n}\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Initial segments or thresholds.</p></div>\n\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/recursive_teaching_dimension_halfintervals.html'>Recursive Teaching Dimension of Half-intervals</a></li><li><a href='values/covc_dimension_halfintervals.html'>co-VC dimension of Half-intervals</a></li><li><a href='values/largest_strongly_shattered_set_halfintervals.html'>Largest Strongly Shattered Set of Half-intervals</a></li><li><a href='v e-details\">\n        <p><strong>Name: </strong>VC Dimension / Projected Recursive Teaching Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/vc_dimension.html\">VC Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/monotone_recursive_teaching_dimension.html\">Projected Recursive Teaching Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1 \\ge c\\sqrt{P_2}$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Equivalently, $\\mathrm{RTD}^p(\\mathcal H)=O(\\mathrm{VC}(\\mathcal H)^2)$.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#hu2017quadratic\">[hu2017quadratic]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__167": "\n    <div class=\"table-card\" id=\"math-37\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/vc_dimension_log_shattering.html\" class=\"table-title-link\">VC Dimension / Log Shattering</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>VC Dimension / Log Shattering</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/vc_dimension.html\">VC Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/log_shattering.html\">Log Shattering</a></p>\n<p><strong>Relationship Type:</strong> $P_1 \\ge \\frac{cP_2}{\\log n}$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Sauer--Shelah counting bound.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/halfintervals.html\">Half-intervals</a></p>\n<p><strong>Status:</strong> </p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>If $d=\\mathrm{VC}(\\mathcal H)$ on a domain of size $n$, every shattered set has size at most $d$.  Thus $|\\operatorname{sh}(\\mathcal H)|\\le\\sum_{i=0}^{d}\\binom ni\\le(en/d)^d$.  Taking logarithms gives $d=\\Omega(\\log\\operatorname{sh}(\\mathcal H)/\\log n)$, with the small-$n$ cases absorbed in the universal constant.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#vapnik1971uniform\">[vapnik1971uniform]</a></p></div>\n\n        </div>\n    </div>\n    ", "__label__167": "\n    <div class=\"table-card\" id=\"math-5\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/halfintervals.html\" class=\"table-title-link\">Half-intervals</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Half-intervals</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\{[i]\\}_{1\\le i\\le n}\">\n            \\[\\{[i]\\}_{1\\le i\\le n}\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Initial segments or thresholds.</p></div>\n\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/recursive_teaching_dimension_halfintervals.html'>Recursive Teaching Dimension of Half-intervals</a></li><li><a href='values/covc_dimension_halfintervals.html'>co-VC dimension of Half-intervals</a></li><li><a href='values/largest_strongly_shattered_set_halfintervals.html'>Largest Strongly Shattered Set of Half-intervals</a></li><li><a href='values/star_number_halfintervals.html'>Star number of Half-intervals</a></li><li><a href='values/maximum_degree_halfintervals.html'>Maximum Degree of Half-intervals</a></li><li><a href='values/size_halfintervals.html'>Size of Half-intervals</a></li><li><a href='values/effective_range_halfintervals.html'>Effective Range of Half-intervals</a></li><li><a href='values/littlestone_dimension_halfintervals.html'>Littlestone Dimension of Half-intervals</a></li><li><a href='values/proper_equivalence_queries_complexity_halfintervals.html'>Proper Equivalence Queries Complexity of Half-intervals</a></li><li><a href='values/log_size_halfinte
