/a></li><li><a href='values/proper_stable_sample_compression_trivial_concepts.html'>Proper Stable Sample Compression of Trivial concepts</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/effective_range_yang_dimension.html'>Effective Range / Yang dimension</a></li><li><a href='relationships/proper_stable_labeled_sample_compression_covc_dimension.html'>Proper Stable Labeled Sample Compression / co-VC dimension</a></li><li><a href='relationships/log_shattering_log_size.html'>Log Shattering / Log Size</a></li><li><a href='relationships/positive_noclashing_teaching_dimension_maximum_positive_degree.html'>Positive No-Clashing Teaching Dimension / Maximum Positive Degree</a></li><li><a href='relationships/noclashing_teaching_dimension_densest_subgraph_twice.html'>No-Clashing Teaching Dimension / Densest Subgraph (twice)</a></li><li><a href='relationships/noclashing_teaching_dimension_double_density_or_average_degree.html'>No-Clashing Teaching Dimension / Double Density or Average Degree</a></li><li><a href='relationships/oriented_diameter_threshold_dimension.html'>Oriented Diameter / Threshold Dimension</a></li><li><a href='relationships/diameter_path_dimension.html'>Diameter / Path Dimension</a></li><li><a href='relationships/effective_range_projected_membership_queries_complexity.html'>Effective Range / Projected Membership Queries Complexity</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__52": "\n    <div class=\"table-card\" id=\"math-68\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/dual_sign_rank_vc_dimension.html\" class=\"table-title-link\">Dual Sign Rank / VC Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Dual Sign Rank / VC Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/dual_sign_rank.html\">Dual Sign Rank</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/vc_dimension.html\">VC Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For every sign matrix, $\\mathrm{VC}\\leq\\mathrm{DSR}\\leq2\\mathrm{VC}+1$.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>This is the first inequality of Proposition 1, which identifies dual sign rank with the VC dimension of the matrix obtained by adjoining the negated rows.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#alon2016sign\">[alon2016sign]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__53": "\n    <div class=\"table-card\" id=\"math-69\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/vc_dimension_dual_sign_rank.html\" class=\"table-title-link\">VC Dimension / Dual Sign Rank</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>VC Dimension / Dual Sign Rank</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/vc_dimension.html\">VC Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/dual_sign_rank.html\">Dual Sign Rank</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge cP_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For sign matrices with $\\mathrm{VC}\\geq1$; more precisely, $\\mathrm{DSR}\\leq2\\mathrm{VC}+1$.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Proposition 1 gives $\\mathrm{DSR}\\leq2\\mathrm{VC}+1$.  When $\\mathrm{VC}\\geq1$, this implies $\\mathrm{DSR}\\leq3\\mathrm{VC}$, i.e. the displayed constant-factor relationship.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#alon2016sign\">[alon2016sign]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__54": "\n    <div class=\"table-card\" id=\"math-70\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/sign_rank_dual_sign_rank.html\" class=\"table-title-link\">Sign Rank / Dual Sign Rank</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Sign Rank / Dual Sign Rank</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/sign_rank.html\">Sign Rank</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/dual_sign_rank.html\">Dual Sign Rank</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For every sign matrix.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>If a fixed set of $k$ columns is linearly independent in every realizing matrix, then every realizing matrix has rank at least $k$.  Thus the maximum such fixed $k$ (dual sign rank) is at most sign rank.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#alon2016sign\">[alon2016sign]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__55": "\n    <div class=\"table-card\" id=\"math-71\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/projected_vc_radius_vc_dimension.html\" class=\"table-title-link\">Projected VC Radius / VC Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Projected VC Radius / VC Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/projected_vc_radius.html\">Projected VC Radius</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/vc_dimension.html\">VC Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1 = P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Taking the largest effective VC radius over projections is exactly VC dimension.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>If $S$ is VC-shattered, the projection to $S$ is the full cube on $S$, so its effective VC radius is $|S|$; hence $\\mathrm{VCR}^p\\ge\\mathrm{VC}$.  Conversely, effective VC radius at least $d$ in a projection supplies a shattered $d$-set in that projection, and thus in the original class.  Hence $\\mathrm{VCR}^p=\\mathrm{VC}$.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__56": "\n    <div class=\"table-card\" id=\"math-73\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/projected_strongly_shattered_dimension_vc_dimension.html\" class=\"table-title-link\">Projected Strongly Shattered Dimension / VC Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Projected Strongly Shattered Dimension / VC Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/projected_strongly_shattered_dimension.html\">Projected Strongly Shattered Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/vc_dimension.html\">VC Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1 = P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>A set is shattered exactly when it becomes strongly shattered in its coordinate projection.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>A set $S$ is shattered by $\\mathcal H$ exactly when the projection $\\mathcal H_{|S}$ contains the full $S$-cube. In that projection, $S$ is strongly shattered. Conversely, a strongly shattered set in any projection is shattered by the original class on the same coordinates. Taking maxima yields equality.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#bollobas1995defect\">[bollobas1995defect]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__57": "\n    <div class=\"table-card\" id=\"math-75\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/maximum_largest_order_shattered_set_vc_dimension.html\" class=\"table-title-link\">Maximum Largest Order Shattered Set / VC Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Maximum Largest Order Shattered Set / VC Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/maximum_largest_order_shattered_set.html\">Maximum Largest Order Shattered Set</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/vc_dimension.html\">VC Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1 = P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Sandwich Theorem</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>For every domain order, the order-shattered sets are shattered, giving the upper bound by VC dimension. The order-shattering sandwich theorem supplies an order for which a maximum shattered set is order-shattered, giving the reverse bound.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#bollobas1995defect\">[bollobas1995defect]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__58": "\n    <div class=\"table-card\" id=\"math-78\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/projected_minimum_degree_vc_dimension.html\" class=\"table-title-link\">Projected Minimum Degree / VC Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Projected Minimum Degree / VC Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/projected_minimum_degree.html\">Projected Minimum Degree</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/vc_dimension.html\">VC Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Project on the largest shattered set. The reverse inequality is false in general.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>If $S$ is shattered with $|S|=d$, the projection to $S$ is the full $d$-cube and has minimum degree $d$. Hence projected minimum degree is at least VC dimension. Equality cannot be asserted in general: there are classes with VC dimension $10$ and minimum degree $11$, and the full projection is one candidate in the projected maximum.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#rubinstein2007shifting\">[rubinstein2007shifting]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__59": "\n    <div class=\"table-card\" id=\"math-80\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/vc_dimension_densest_subgraph_twice.html\" class=\"table-title-link\">VC Dimension / Densest Subgraph (twice)</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>VC Dimension / Densest Subgraph (twice)</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/vc_dimension.html\">VC Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/densest_subgraph_twice.html\">Densest Subgraph (twice)</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge cP_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Down shifting lemma and Monotonicity</p></div>\n<p><strong>Witness: </strong><a href=\"classes/warmuth_c5.html\">Warmuth's $C_5$ class</a></p>\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>The one-inclusion density lemma applies to every subfamily: each induced subgraph has density at most $\\mathrm{VC}(\\mathcal H)$. The densest-subgraph-twice parameter is twice this maximum density, so it is at most $2\\,\\mathrm{VC}(\\mathcal H)$.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#haussler1988predicting\">[haussler1988predicting]</a></p></div>\n\n        </div>\n    </div>\n    ", "__label__59": "\n    <div class=\"table-card\" id=\"math-10\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/warmuth_c5.html\" class=\"table-title-link\">Warmuth's $C_5$ class</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Warmuth's $C_5$ class</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"C_5\">\n            \\[C_5\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Let the domain be the cyclic group $\\mathbb{Z}/5\\mathbb{Z}$.  A binary function belongs to $C_5$ precisely when, on some four consecutive cyclic positions, its values are $1,0,0,1$ in that order.  The value on the remaining position is unrestricted, so the class has ten functions.</p></div>\n<strong>Comments:</strong><div class=\"text-field\"><p>This is also called Warmuth's example.  It is a finite separation between unlabeled sample-compression size and VC dimension.</p></div>\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/vc_dimension_warmuth_c5.html'>VC Dimension of Warmuth's $C_5$ class</a></li><li><a href='values/unlabeled_sample_compression_warmuth_c5.html'>Unlabeled Sample Compression of Warmuth's $C_5$ class</a></li><li><a href='values/size_warmuth_c5.html'>Size of Warmuth's $C_5$ class</a></li><li><a href='values/effective_range_warmuth_c5.html'>Effective Range of Warmuth's $C_5$ class</a></li><li><a href='values/log_size_warmuth_c5.html'>Log Size of Warmuth's $C_5$ class</a></li><li><a href='values/largest_shattered_set_warmuth_c5.html'>Largest Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_largest_order_shattered_set_warmuth_c5.html'>Maximum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_vc_radius_warmuth_c5.html'>Projected VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_strongly_shattered_dimension_warmuth_c5.html'>Projected Strongly Shattered Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_degree_warmuth_c5.html'>Maximum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_degree_warmuth_c5.html'>Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/double_density_or_average_degree_warmuth_c5.html'>Double Density or Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/densest_subgraph_twice_warmuth_c5.html'>Densest Subgraph (twice) of Warmuth's $C_5$ Class</a></li><li><a href='values/hamming_radius_warmuth_c5.html'>Hamming Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/oriented_diameter_warmuth_c5.html'>Oriented Diameter of Warmuth's $C_5$ Class</a></li><li><a href='values/threshold_dimension_warmuth_c5.html'>Threshold Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/path_dimension_warmuth_c5.html'>Path Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/degeneracy_warmuth_c5.html'>Degeneracy of Warmuth's $C_5$ Class</a></li><li><a href='values/largest_strongly_shattered_set_warmuth_c5.html'>Largest Strongly Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_positive_degree_warmuth_c5.html'>Maximum Positive Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_maximal_degree_warmuth_c5.html'>Projected Maximal Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_minimum_degree_warmuth_c5.html'>Projected Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_double_density_or_projected_average_degree_warmuth_c5.html'>Projected Double Density or Projected Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/effective_vc_radius_warmuth_c5.html'>Effective VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_largest_order_shattered_set_warmuth_c5.html'>Minimum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_teaching_set_size_warmuth_c5.html'>Minimum Teaching Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_teaching_set_size_warmuth_c5.html'>Maximum Teaching Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/teaching_dimension_warmuth_c5.html'>Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/recursive_teaching_dimension_warmuth_c5.html'>Recursive Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/monotone_recursive_teaching_dimension_warmuth_c5.html'>Projected Recursive Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/monotonic_minimum_teaching_set_size_warmuth_c5.html'>Monotonic Minimum Teaching-Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/preferencebased_teaching_dimension_warmuth_c5.html'>Preference-Based Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/star_number_warmuth_c5.html'>Star Number of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_projected_teaching_set_size_warmuth_c5.html'>Maximum Projected Teaching-Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/log_shattering_warmuth_c5.html'>Log Shattering of Warmuth's $C_5$ Class</a></li><li><a href='values/log_size_ratio_warmuth_c5.html'>Log Size Ratio of Warmuth's $C_5$ Class</a></li><li><a href='values/membership_query_complexity_warmuth_c5.html'>Membership Query Complexity of Warmuth's $C_5$ Class</a></li><li><a href='values/littlestone_dimension_warmuth_c5.html'>Littlestone Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/equivalence_queries_complexity_warmuth_c5.html'>Equivalence Queries Complexity of Warmuth's $C_5$ Class</a></li><li><a href='values/interpolation_degree_warmuth_c5.html'>Interpolation Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/diameter_warmuth_c5.html'>Diameter of Warmuth's $C_5$ class</a></li><li><a href='values/relative_hitting_size_warmuth_c5.html'>Relative Hitting Size of Warmuth's $C_5$ class</a></li><li><a href='values/hitting_size_warmuth_c5.html'>Hitting Size of Warmuth's $C_5$ Class</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/minimum_largest_order_shattered_set_largest_strongly_shattered_set.html'>Minimum Largest Order Shattered Set / Largest Strongly Shattered Set</a></li><li><a href='relationships/minimum_teaching_set_size_effective_vc_radius.html'>Minimum Teaching Set Size / Effective VC Radius</a></li><li><a href='relationships/projected_maximal_degree_projected_minimum_degree.html'>Projected Maximal Degree / Projected Minimum Degree</a></li><li><a href='relationships/projected_strongly_shattered_dimension_largest_strongly_shattered_set.html'>Projected Strongly Shattered Dimension / Largest Strongly Shattered Set</a></li><li><a href='relationships/maximum_teaching_set_size_largest_strongly_shattered_set.html'>Maximum Teaching Set Size / Largest Strongly Shattered Set</a></li><li><a href='relationships/vc_dimension_densest_subgraph_twice.html'>VC Dimension / Densest Subgraph (twice)</a></li><li><a href='relationships/path_dimension_threshold_dimension.html'>Path Dimension / Threshold Dimension</a></li><li><a href='relationships/recursive_teaching_dimension_interpolation_degree.html'>Recursive Teaching Dimension / Interpolation degree</a></li><li><a href='relationships/diameter_oriented_diameter.html'>Diameter / Oriented Diameter</a></li><li><a href='relationships/recursive_teaching_dimension_effective_vc_radius.html'>Recursive Teaching Dimension / Effective VC Radius</a></li><li><a href='relationships/monotone_recursive_teaching_dimension_vc_dimension.html'>Projected Recursive Teaching Dimension / VC Dimension</a></li><li><a href='relationships/hamming_radius_oriented_diameter.html'>Hamming Radius / Oriented Diameter</a></li><li><a href='relationships/diameter_hamming_radius.html'>Diameter / Hamming Radius</a></li><li><a href='relationships/unlabeled_sample_compression_vc_dimension.html'>Unlabeled Sample Compression / VC Dimension</a></li><li><a href='relationships/diameter_littlestone_dimension.html'>Diameter / Littlestone Dimension</a></li><li><a href='relationships/maximum_teaching_set_size_maximum_degree.html'>Maximum Teaching-Set Size / Maximum Degree</a></li><li><a href='relationships/minimum_teaching_set_size_minimum_degree.html'>Minimum Teaching-Set Size / Minimum Degree</a></li><li><a href='relationships/star_number_vc_dimension.html'>Star Number / VC Dimension</a></li><li><a href='relationships/effective_range_star_number.html'>Effective Range / Star Number</a></li><li><a href='relationships/size_star_number.html'>Size / Star Number</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__60": "\n    <div class=\"table-card\" id=\"math-84\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/stable_unlabeled_complexity_unlabeled_sample_compression.html\" class=\"table-title-link\">Stable Unlabeled Complexity / Unlabeled sample compression</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Stable Unlabeled Complexity / Unlabeled sample compression</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/stable_unlabeled_complexity.html\">Stable Unlabeled Complexity</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/unlabeled_sample_compression.html\">Unlabeled sample compression</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes; stability is an additional constraint on an unlabeled compression scheme.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Stable unlabeled compression schemes are unlabeled compression schemes with an additional stability requirement. Minimizing over the restricted class of stable schemes cannot improve the optimum.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#hanneke2021stable\">[hanneke2021stable]</a> <a href=\"bibliography.html#bousquet2020proper\">[bousquet2020proper]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__61": "\n    <div class=\"table-card\" id=\"math-85\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/stable_unlabeled_complexity_stable_labeled_sample_compression.html\" class=\"table-title-link\">Stable Unlabeled Complexity / Stable Labeled Sample Compression</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Stable Unlabeled Complexity / Stable Labeled Sample Compression</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/stable_unlabeled_complexity.html\">Stable Unlabeled Complexity</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/stable_labeled_sample_compression.html\">Stable Labeled Sample Compression</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes; unlabeled stable compression is a restricted form of labeled stable compression.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Forgetting labels from a compression set is an additional restriction. Thus every stable unlabeled scheme is a stable labeled scheme, and the minimum stable-unlabeled size is at least the stable-labeled one.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#hanneke2021stable\">[hanneke2021stable]</a> <a href=\"bibliography.html#bousquet2020proper\">[bousquet2020proper]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__62": "\n    <div class=\"table-card\" id=\"math-86\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/majority_complexity_littlestone_dimension.html\" class=\"table-title-link\">Majority Complexity / Littlestone Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Majority Complexity / Littlestone Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/majority_complexity.html\">Majority Complexity</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/littlestone_dimension.html\">Littlestone Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>The pointwise-majority (halving) learner is one particular equivalence-query strategy.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>The halving/majority procedure is one particular equivalence-query learner. Its query count is therefore at least the optimal equivalence-query complexity, which equals Littlestone dimension.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#littlestone1988learning\">[littlestone1988learning]</a> <a href=\"bibliography.html#maass1992lower\">[maass1992lower]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__63": "\n    <div class=\"table-card\" id=\"math-87\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/littlestone_dimension_membership_and_equivalence_queries_complexity.html\" class=\"table-title-link\">Littlestone Dimension / Membership and Equivalence Queries Complexity</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Littlestone Dimension / Membership and Equivalence Queries Complexity</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/littlestone_dimension.html\">Littlestone Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/membership_and_equivalence_queries_complexity.html\">Membership and Equivalence Queries Complexity</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Allowing membership queries in addition to arbitrary equivalence queries can only help the learner.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Equivalence-query complexity equals Littlestone dimension. Allowing membership queries in addition to arbitrary equivalence queries enlarges the learner's permitted query family, so it cannot require more queries.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#littlestone1988learning\">[littlestone1988learning]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__64": "\n    <div class=\"table-card\" id=\"math-88\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/membership_and_equivalence_queries_complexity_partial_equivalence_queries_complexity.html\" class=\"table-title-link\">Membership and Equivalence Queries Complexity / Partial Equivalence Queries Complexity</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Membership and Equivalence Queries Complexity / Partial Equivalence Queries Complexity</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/membership_and_equivalence_queries_complexity.html\">Membership and Equivalence Queries Complexity</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/partial_equivalence_queries_complexity.html\">Partial Equivalence Queries Complexity</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Partial equivalence queries include both total equivalence and one-point membership queries.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>An arbitrary equivalence query is a total partial equivalence query, and a membership query is a partial query defined at one point. Thus partial equivalence queries include every query available in the membership-and-equivalence model.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#maass1992lower\">[maass1992lower]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__65": "\n    <div class=\"table-card\" id=\"math-89\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/partial_equivalence_queries_complexity_selfdirected_queries_complexity.html\" class=\"table-title-link\">Partial Equivalence Queries Complexity / Self-Directed Queries Complexity</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Partial Equivalence Queries Complexity / Self-Directed Queries Complexity</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/partial_equivalence_queries_complexity.html\">Partial Equivalence Queries Complexity</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/selfdirected_queries_complexity.html\">Self-Directed Queries Complexity</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes, $\\mathrm{LC}_{\\mathrm{partial}}(\\mathcal H)\\ge\\mathrm{SDC}(\\mathcal H)$.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#doliwa2014recursive\">[doliwa2014recursive]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__66": "\n    <div class=\"table-card\" id=\"math-91\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/unlabeled_sample_compression_labeled_sample_compression.html\" class=\"table-title-link\">Unlabeled sample compression / Labeled Sample Compression</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Unlabeled sample compression / Labeled Sample Compression</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/unlabeled_sample_compression.html\">Unlabeled sample compression</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/labeled_sample_compression.html\">Labeled Sample Compression</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Unlabeled compression is the more restrictive model because retained labels are not stored.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>An unlabeled compression scheme is a labeled compression scheme with the additional restriction that retained labels are not stored. Minimizing over the more restrictive unlabeled schemes cannot improve the optimum.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#chalopin2022unlabeled\">[chalopin2022unlabeled]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__67": "\n    <div class=\"table-card\" id=\"math-95\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/size_path_dimension.html\" class=\"table-title-link\">Size / Path Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Size / Path Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/size.html\">Size</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/path_dimension.html\">Path Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Definition</p></div>\n<p><strong>Witness: </strong><a href=\"classes/full_cube.html\">Full Cube</a></p>\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>A full path on a set of size $d$ contains $d+1$ distinct projected concepts. Each is the projection of a distinct member of $\\mathcal H$, so $|\\mathcal H|\\ge d+1\\ge d$.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__label__67": "\n    <div class=\"table-card\" id=\"math-3\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/full_cube.html\" class=\"table-title-link\">Full Cube</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Full Cube</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\{S:S\\subset [n]\\}\">\n            \\[\\{S:S\\subset [n]\\}\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>All concepts, i.e. the powerset of the range.</p></div>\n\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/recursive_teaching_dimension_full_cube.html'>Recursive Teaching Dimension of Full Cube</a></li><li><a href='values/star_number_full_cube.html'>Star number of Full Cube</a></li><li><a href='values/covc_dimension_full_cube.html'>co-VC dimension of Full Cube</a></li><li><a href='values/maximum_degree_full_cube.html'>Maximum Degree of Full Cube</a></li><li><a href='values/largest_strongly_shattered_set_full_cube.html'>Largest Strongly Shattered Set of Full Cube</a></li><li><a href='values/size_full_cube.html'>Size of Full Cube</a></li><li><a href='values/effective_range_full_cube.html'>Effective Range of Full Cube</a></li><li><a href='values/vc_dimension_full_cube.html'>VC Dimension of Full Cube</a></li><li><a href='values/threshold_dimension_full_cube.html'>Threshold Dimension of Full Cube</a></li><li><a href='values/oriented_diameter_full_cube.html'>Oriented Diameter of Full Cube</a></li><li><a href='values/littlestone_dimension_full_cube.html'>Littlestone Dimension of Full Cube</a></li><li><a href='values/proper_equivalence_queries_complexity_full_cube.html'>Proper Equivalence Queries Complexity of Full Cube</a></li><li><a href='values/noclashing_teaching_dimension_full_cube.html'>No-Clashing Teaching Dimension of Full Cube</a></li><li><a href='values/log_size_ratio_full_cube.html'>Log Size Ratio of Full Cube</a></li><li><a href='values/log_size_full_cube.html'>Log Size of Full Cube</a></li><li><a href='values/diameter_full_cube.html'>Diameter of Full Cube</a></li><li><a href='values/hamming_radius_full_cube.html'>Hamming Radius of Full Cube</a></li><li><a href='values/path_dimension_full_cube.html'>Path Dimension of Full Cube</a></li><li><a href='values/log_shattering_full_cube.html'>Log Shattering of Full Cube</a></li><li><a href='values/effective_vc_radius_full_cube.html'>Effective VC Radius of Full Cube</a></li><li><a href='values/extended_teaching_dimension_full_cube.html'>Extended Teaching Dimension of Full Cube</a></li><li><a href='values/membership_query_complexity_full_cube.html'>Membership Query Complexity of Full Cube</a></li><li><a href='values/teaching_dimension_full_cube.html'>Teaching Dimension of Full Cube</a></li><li><a href='values/minimum_teaching_set_size_full_cube.html'>Minimum Teaching Set Size of Full Cube</a></li><li><a href='values/maximum_teaching_set_size_full_cube.html'>Maximum Teaching Set Size of Full Cube</a></li><li><a href='values/positive_noclashing_teaching_dimension_full_cube.html'>Positive No-Clashing Teaching Dimension of Full Cube</a></li><li><a href='values/minimum_degree_full_cube.html'>Minimum Degree of Full Cube</a></li><li><a href='values/degeneracy_full_cube.html'>Degeneracy of Full Cube</a></li><li><a href='values/densest_subgraph_twice_full_cube.html'>Densest Subgraph (twice) of Full Cube</a></li><li><a href='values/double_density_or_average_degree_full_cube.html'>Double Density or Average Degree of Full Cube</a></li><li><a href='values/maximum_positive_degree_full_cube.html'>Maximum Positive Degree of Full Cube</a></li><li><a href='values/projected_maximal_degree_full_cube.html'>Projected Maximal Degree of Full Cube</a></li><li><a href='values/projected_double_density_or_projected_average_degree_full_cube.html'>Projected Double Density or Projected Average Degree of Full Cube</a></li><li><a href='values/projected_minimum_degree_full_cube.html'>Projected Minimum Degree of Full Cube</a></li><li><a href='values/largest_shattered_set_full_cube.html'>Largest Shattered Set of the Full Cube</a></li><li><a href='values/relative_hitting_size_full_cube.html'>Relative Hitting Size of the Full Cube</a></li><li><a href='values/maximum_largest_order_shattered_set_full_cube.html'>Maximum Largest Order Shattered Set of the Full Cube</a></li><li><a href='values/projected_vc_radius_full_cube.html'>Projected VC Radius of the Full Cube</a></li><li><a href='values/projected_strongly_shattered_dimension_full_cube.html'>Projected Strongly Shattered Dimension of the Full Cube</a></li><li><a href='values/sign_rank_full_cube.html'>Sign Rank of Full Cube</a></li><li><a href='values/minimum_largest_order_shattered_set_full_cube.html'>Minimum Largest Order Shattered Set of the Full Cube</a></li><li><a href='values/maximum_projected_teaching_set_size_full_cube.html'>Maximum Projected Teaching-Set Size of the Full Cube</a></li><li><a href='values/monotonic_minimum_teaching_set_size_full_cube.html'>Monotonic Minimum Teaching-Set Size of the Full Cube</a></li><li><a href='values/preferencebased_teaching_dimension_full_cube.html'>Preference-Based Teaching Dimension of the Full Cube</a></li><li><a href='values/minimum_projected_teaching_set_size_full_cube.html'>Minimum Projected Teaching-Set Size of the Full Cube</a></li><li><a href='values/monotonic_projected_minimum_teaching_set_size_full_cube.html'>Monotonic Projected Minimum Teaching-Set Size of the Full Cube</a></li><li><a href='values/equivalence_queries_complexity_full_cube.html'>Equivalence Queries Complexity of Full Cube</a></li><li><a href='values/hitting_size_full_cube.html'>Hitting Size of Full Cube</a></li><li><a href='values/distinguishing_range_full_cube.html'>Distinguishing Range of Full Cube</a></li><li><a href='values/dual_sign_rank_full_cube.html'>Dual Sign Rank of Full Cube</a></li><li><a href='values/interpolation_degree_full_cube.html'>Interpolation Degree of Full Cube</a></li><li><a href='values/positive_teaching_dimension_full_cube.html'>Positive Teaching Dimension of Full Cube</a></li><li><a href='values/positive_recursive_teaching_dimension_full_cube.html'>Positive Recursive Teaching Dimension of Full Cube</a></li><li><a href='values/majority_complexity_full_cube.html'>Majority Complexity of Full Cube</a></li><li><a href='values/monotone_recursive_teaching_dimension_full_cube.html'>Projected Recursive Teaching Dimension of Full Cube</a></li><li><a href='values/projected_membership_queries_complexity_full_cube.html'>Projected Membership Queries Complexity of Full Cube</a></li><li><a href='values/unlabeled_sample_compression_full_cube.html'>Unlabeled Sample Compression of Full Cube</a></li><li><a href='values/proper_unlabeled_sample_compression_full_cube.html'>Proper Unlabeled Sample Compression of Full Cube</a></li><li><a href='values/stable_unlabeled_complexity_full_cube.html'>Stable Unlabeled Complexity of Full Cube</a></li><li><a href='values/proper_stable_sample_compression_full_cube.html'>Proper Stable Sample Compression of Full Cube</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/covc_dimension_effective_vc_radius.html'>co-VC dimension / Effective VC Radius</a></li><li><a href='relationships/size_vc_dimension.html'>Size / VC Dimension</a></li><li><a href='relationships/size_path_dimension.html'>Size / Path Dimension</a></li><li><a href='relationships/vc_dimension_log_size_ratio.html'>VC Dimension / Log Size Ratio</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__68": "\n    <div class=\"table-card\" id=\"math-96\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/threshold_dimension_path_dimension.html\" class=\"table-title-link\">Threshold Dimension / Path Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Threshold Dimension / Path Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/threshold_dimension.html\">Threshold Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/path_dimension.html\">Path Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge cP_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes, threshold dimension is at least one half of path dimension.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n\n<strong>Full Proof:</strong><div class=\"text-field\"><p>LaTeX survey, threshold/path lemma (lem:threshold-path).</p></div>\n\n\n\n        </div>\n    </div>\n    ", "__edge__69": "\n    <div class=\"table-card\" id=\"math-98\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/oriented_diameter_threshold_dimension.html\" class=\"table-title-link\">Oriented Diameter / Threshold Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Oriented Diameter / Threshold Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/oriented_diameter.html\">Oriented Diameter</a></p>\n<p><strong>Parameter 2: </strong><a h  1: </strong><a href=\"parameters/recursive_teaching_dimension.html\">Recursive Teaching Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/interpolation_degree.html\">Interpolation degree</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>A recursive teaching plan yields a triangular interpolation basis.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/warmuth_c5.html\">Warmuth's $C_5$ class</a></p>\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Order the concepts by a recursive teaching plan of width $r=\\mathrm{RTD}(\\mathcal H)$.  For the teaching set $S_i$ of its $i$th concept $h_i$ among the remaining concepts, the product of literals agreeing with $h_i$ on $S_i$ has degree at most $r$, is nonzero at $h_i$, and vanishes at every later $h_j$.  These polynomials give an invertible triangular evaluation matrix, hence a degree-at-most-$r$ interpolation basis.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#moran2015shattered\">[moran2015shattered]</a></p></div>\n\n        </div>\n    </div>\n    ", "__label__71": "\n    <div class=\"table-card\" id=\"math-10\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/warmuth_c5.html\" class=\"table-title-link\">Warmuth's $C_5$ class</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Warmuth's $C_5$ class</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"C_5\">\n            \\[C_5\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Let the domain be the cyclic group $\\mathbb{Z}/5\\mathbb{Z}$.  A binary function belongs to $C_5$ precisely when, on some four consecutive cyclic positions, its values are $1,0,0,1$ in that order.  The value on the remaining position is unrestricted, so the class has ten functions.</p></div>\n<strong>Comments:</strong><div class=\"text-field\"><p>This is also called Warmuth's example.  It is a finite separation between unlabeled sample-compression size and VC dimension.</p></div>\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/vc_dimension_warmuth_c5.html'>VC Dimension of Warmuth's $C_5$ class</a></li><li><a href='values/unlabeled_sample_compression_warmuth_c5.html'>Unlabeled Sample Compression of Warmuth's $C_5$ class</a></li><li><a href='values/size_warmuth_c5.html'>Size of Warmuth's $C_5$ class</a></li><li><a href='values/effective_range_warmuth_c5.html'>Effective Range of Warmuth's $C_5$ class</a></li><li><a href='values/log_size_warmuth_c5.html'>Log Size of Warmuth's $C_5$ class</a></li><li><a href='values/largest_shattered_set_warmuth_c5.html'>Largest Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_largest_order_shattered_set_warmuth_c5.html'>Maximum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_vc_radius_warmuth_c5.html'>Projected VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_strongly_shattered_dimension_warmuth_c5.html'>Projected Strongly Shattered Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_degree_warmuth_c5.html'>Maximum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_degree_warmuth_c5.html'>Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/double_density_or_average_degree_warmuth_c5.html'>Double Density or Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/densest_subgraph_twice_warmuth_c5.html'>Densest Subgraph (twice) of Warmuth's $C_5$ Class</a></li><li><a href='values/hamming_radius_warmuth_c5.html'>Hamming Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/oriented_diameter_warmuth_c5.html'>Oriented Diameter of Warmuth's $C_5$ Class</a></li><li><a href='values/threshold_dimension_warmuth_c5.html'>Threshold Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/path_dimension_warmuth_c5.html'>Path Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/degeneracy_warmuth_c5.html'>Degeneracy of Warmuth's $C_5$ Class</a></li><li><a href='values/largest_strongly_shattered_set_warmuth_c5.html'>Largest Strongly Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_positive_degree_warmuth_c5.html'>Maximum Positive Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_maximal_degree_warmuth_c5.html'>Projected Maximal Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_minimum_degree_warmuth_c5.html'>Projected Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_double_density_or_projected_average_degree_warmuth_c5.html'>Projected Double Density or Projected Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/effective_vc_radius_warmuth_c5.html'>Effective VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_largest_order_shattered_set_warmuth_c5.html'>Minimum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_teaching_set_size_warmuth_c5.html'>Minimum Teaching Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_teaching_set_size_warmuth_c5.html'>Maximum Teaching Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/teaching_dimension_warmuth_c5.html'>Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/recursive_teaching_dimension_warmuth_c5.html'>Recursive Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/monotone_recursive_teaching_dimension_warmuth_c5.html'>Projected Recursive Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/monotonic_minimum_teaching_set_size_warmuth_c5.html'>Monotonic Minimum Teaching-Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/preferencebased_teaching_dimension_warmuth_c5.html'>Preference-Based Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/star_number_warmuth_c5.html'>Star Number of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_projected_teaching_set_size_warmuth_c5.html'>Maximum Projected Teaching-Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/log_shattering_warmuth_c5.html'>Log Shattering of Warmuth's $C_5$ Class</a></li><li><a href='values/log_size_ratio_warmuth_c5.html'>Log Size Ratio of Warmuth's $C_5$ Class</a></li><li><a href='values/membership_query_complexity_warmuth_c5.html'>Membership Query Complexity of Warmuth's $C_5$ Class</a></li><li><a href='values/littlestone_dimension_warmuth_c5.html'>Littlestone Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/equivalence_queries_complexity_warmuth_c5.html'>Equivalence Queries Complexity of Warmuth's $C_5$ Class</a></li><li><a href='values/interpolation_degree_warmuth_c5.html'>Interpolation Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/diameter_warmuth_c5.html'>Diameter of Warmuth's $C_5$ class</a></li><li><a href='values/relative_hitting_size_warmuth_c5.html'>Relative Hitting Size of Warmuth's $C_5$ class</a></li><li><a href='values/hitting_size_warmuth_c5.html'>Hitting Size of Warmuth's $C_5$ Class</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/minimum_largest_order_shattered_set_largest_strongly_shattered_set.html'>Minimum Largest Order Shattered Set / Largest Strongly Shattered Set</a></li><li><a href='relationships/minimum_teaching_set_size_effective_vc_radius.html'>Minimum Teaching Set Size / Effective VC Radius</a></li><li><a href='relationships/projected_maximal_degree_projected_minimum_degree.html'>Projected Maximal Degree / Projected Minimum Degree</a></li><li><a href='relationships/projected_strongly_shattered_dimension_largest_strongly_shattered_set.html'>Projected Strongly Shattered Dimension / Largest Strongly Shattered Set</a></li><li><a href='relationships/maximum_teaching_set_size_largest_strongly_shattered_set.html'>Maximum Teaching Set Size / Largest Strongly Shattered Set</a></li><li><a href='relationships/vc_dimension_densest_subgraph_twice.html'>VC Dimension / Densest Subgraph (twice)</a></li><li><a href='relationships/path_dimension_threshold_dimension.html'>Path Dimension / Threshold Dimension</a></li><li><a href='relationships/recursive_teaching_dimension_interpolation_degree.html'>Recursive Teaching Dimension / Interpolation degree</a></li><li><a href='relationships/diameter_oriented_diameter.html'>Diameter / Oriented Diameter</a></li><li><a href='relationships/recursive_teaching_dimension_effective_vc_radius.html'>Recursive Teaching Dimension / Effective VC Radius</a></li><li><a href='relationships/monotone_recursive_teaching_dimension_vc_dimension.html'>Projected Recursive Teaching Dimension / VC Dimension</a></li><li><a href='relationships/hamming_radius_oriented_diameter.html'>Hamming Radius / Oriented Diameter</a></li><li><a href='relationships/diameter_hamming_radius.html'>Diameter / Hamming Radius</a></li><li><a href='relationships/unlabeled_sample_compression_vc_dimension.html'>Unlabeled Sample Compression / VC Dimension</a></li><li><a href='relationships/diameter_littlestone_dimension.html'>Diameter / Littlestone Dimension</a></li><li><a href='relationships/maximum_teaching_set_size_maximum_degree.html'>Maximum Teaching-Set Size / Maximum Degree</a></li><li><a href='relationships/minimum_teaching_set_size_minimum_degree.html'>Minimum Teaching-Set Size / Minimum Degree</a></li><li><a href='relationships/star_number_vc_dimension.html'>Star Number / VC Dimension</a></li><li><a href='relationships/effective_range_star_number.html'>Effective Range / Star Number</a></li><li><a href='relationships/size_star_number.html'>Size / Star Number</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__72": "\n    <div class=\"table-card\" id=\"math-102\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/selfdirected_queries_complexity_recursive_teaching_dimension.html\" class=\"table-title-link\">Self-Directed Queries Complexity / Recursive Teaching Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Self-Directed Queries Complexity / Recursive Teaching Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/selfdirected_queries_complexity.html\">Self-Directed Queries Complexity</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/recursive_teaching_dimension.html\">Recursive Teaching Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes, $\\mathrm{SDC}(\\mathcal H)\\ge\\mathrm{RTD}(\\mathcal H)$.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#doliwa2014recursive\">[doliwa2014recursive]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__73": "\n    <div class=\"table-card\" id=\"math-103\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/best_mistakes_selfdirected_queries_complexity.html\" class=\"table-title-link\">Best Mistakes / Self-Directed Queries Complexity</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Best Mistakes / Self-Directed Queries Complexity</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/best_mistakes.html\">Best Mistakes</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/selfdirected_queries_complexity.html\">Self-Directed Queries Complexity</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Self-directed learning permits adaptive choice of the next instance.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>A self-directed learner can emulate any learner and favorable presentation sequence used for $\\mathrm{M}<em _mathrm_sd=\"\\mathrm{sd\">{\\mathrm{best}}$ by choosing the same next instance itself.  It may additionally adapt that choice to earlier feedback.  Thus $\\mathrm{M}</em>(\\mathcal H)$.}}(\\mathcal H)\\le\\mathrm{M}_{\\mathrm{best}</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#ben1997online\">[ben1997online]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__74": "\n    <div class=\"table-card\" id=\"math-106\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/effective_range_diameter.html\" class=\"table-title-link\">Effective Range / Diameter</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Effective Range / Diameter</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/effective_range.html\">Effective Range</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/diameter.html\">Diameter</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes, effective range dominates diameter.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/singletons.html\">Singletons</a></p>\n<p><strong>Status:</strong> Established</p>\n\n<strong>Full Proof:</strong><div class=\"text-field\"><p>Full proof in the LaTeX survey: Lemma <code>lem:elementary-parameter-hierarchy</code>.</p></div>\n\n\n\n        </div>\n    </div>\n    ", "__label__74": "\n    <div class=\"table-card\" id=\"math-2\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/singletons.html\" class=\"table-title-link\">Singletons</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Singletons</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\{\\{i\\}\\}_{1\\le i\\le n}\">\n            \\[\\{\\{i\\}\\}_{1\\le i\\le n}\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Singletons</p></div>\n\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/recursive_teaching_dimension_singletons.html'>Recursive Teaching Dimension of Singletons</a></li><li><a href='values/star_number_singletons.html'>Star number of Singletons</a></li><li><a href='values/covc_dimension_singletons.html'>co-VC dimension of Singletons</a></li><li><a href='values/oriented_diameter_singletons.html'>Oriented Diameter of Singletons</a></li><li><a href='values/maximum_degree_singletons.html'>Maximum Degree of Singletons</a></li><li><a href='values/log_shattering_singletons.html'>Log Shattering of Singletons</a></li><li><a href='values/order_sample_compression_singletons.html'>Order Sample Compression of Singletons</a></li><li><a href='values/proper_ordered_sample_compression_singletons.html'>Proper Ordered Sample Compression of Singletons</a></li><li><a href='values/effective_vc_radius_singletons.html'>Effective VC Radius of Singletons</a></li><li><a href='values/yang_dimension_singletons.html'>Yang dimension of Singletons</a></li><li><a href='values/partial_equivalence_queries_complexity_singletons.html'>Partial Equivalence Queries Complexity of Singletons</a></li><li><a href='values/membership_and_equivalence_queries_complexity_singletons.html'>Membership and Equivalence Queries Complexity of Singletons</a></li><li><a href='values/minimum_teaching_set_size_singletons.html'>Minimum Teaching Set Size of Singletons</a></li><li><a href='values/monotone_recursive_teaching_dimension_single aximal Degree / Maximum Degree</a></li><li><a href='relationships/yang_dimension_vc_dimension.html'>Yang dimension / VC Dimension</a></li><li><a href='relationships/proper_ordered_sample_compression_order_sample_compression.html'>Proper Ordered Sample Compression / Order Sample Compression</a></li><li><a href='relationships/projected_minimum_degree_minimum_degree.html'>Projected Minimum Degree / Minimum Degree</a></li><li><a href='relationships/projected_double_density_or_projected_average_degree_double_density_or_average_degree.html'>Projected Double Density or Projected Average Degree / Double Density or Average Degree</a></li><li><a href='relationships/yang_dimension_covc_dimension.html'>Yang dimension / co-VC dimension</a></li><li><a href='relationships/effective_range_vc_dimension.html'>Effective Range / VC Dimension</a></li><li><a href='relationships/effective_range_diameter.html'>Effective Range / Diameter</a></li><li><a href='relationships/effective_range_hamming_radius.html'>Effective Range / Hamming Radius</a></li><li><a href='relationships/size_littlestone_dimension.html'>Size / Littlestone Dimension</a></li><li><a href='relationships/size_yang_dimension.html'>Size / Yang dimension</a></li><li><a href='relationships/effective_range_log_shattering.html'>Effective Range / Log Shattering</a></li><li><a href='relationships/membership_query_complexity_log_size.html'>Membership Query Complexity / Log Size</a></li><li><a href='relationships/membership_and_proper_equivalence_queries_complexity_membership_and_equivalence_queries_complexity.html'>Membership and Proper Equivalence Queries Complexity / Membership and Equivalence Queries Complexity</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__75": "\n    <div class=\"table-card\" id=\"math-109\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/recursive_teaching_dimension_effective_vc_radius.html\" class=\"table-title-link\">Recursive Teaching Dimension / Effective VC Radius</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Recursive Teaching Dimension / Effective VC Radius</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/recursive_teaching_dimension.html\">Recursive Teaching Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/effective_vc_radius.html\">Effective VC Radius</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite classes, through minimum teaching-set size.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/warmuth_c5.html\">Warmuth's $C_5$ class</a></p>\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>The first layer in the recursive teaching process is $\\mathcal H$ itself, so $\\mathrm{RTD}(\\mathcal H)\\ge\\mathrm{TS}_{\\min}(\\mathcal H)$.  Every minimum teaching set has size at least $\\mathrm{VCR}(\\mathcal H)$, because a smaller one extends to a shattered set of size $\\mathrm{VCR}(\\mathcal H)$; see the proof of the minimum-teaching-set relation.  Combining the two inequalities gives the claim.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__label__75": "\n    <div class=\"table-card\" id=\"math-10\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/warmuth_c5.html\" class=\"table-title-link\">Warmuth's $C_5$ class</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Warmuth's $C_5$ class</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"C_5\">\n            \\[C_5\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Let the domain be the cyclic group $\\mathbb{Z}/5\\mathbb{Z}$.  A binary function belongs to $C_5$ precisely when, on some four consecutive cyclic positions, its values are $1,0,0,1$ in that order.  The value on the remaining position is unrestricted, so the class has ten functions.</p></div>\n<strong>Comments:</strong><div class=\"text-field\"><p>This is also called Warmuth's example.  It is a finite separation between unlabeled sample-compression size and VC dimension.</p></div>\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/vc_dimension_warmuth_c5.html'>VC Dimension of Warmuth's $C_5$ class</a></li><li><a href='values/unlabeled_sample_compression_warmuth_c5.html'>Unlabeled Sample Compression of Warmuth's $C_5$ class</a></li><li><a href='values/size_warmuth_c5.html'>Size of Warmuth's $C_5$ class</a></li><li><a href='values/effective_range_warmuth_c5.html'>Effective Range of Warmuth's $C_5$ class</a></li><li><a href='values/log_size_warmuth_c5.html'>Log Size of Warmuth's $C_5$ class</a></li><li><a href='values/largest_shattered_set_warmuth_c5.html'>Largest Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_largest_order_shattered_set_warmuth_c5.html'>Maximum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_vc_radius_warmuth_c5.html'>Projected VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_strongly_shattered_dimension_warmuth_c5.html'>Projected Strongly Shattered Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_degree_warmuth_c5.html'>Maximum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_degree_warmuth_c5.html'>Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/double_density_or_average_degree_warmuth_c5.html'>Double Density or Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/densest_subgraph_twice_warmuth_c5.html'>Densest Subgraph (twice) of Warmuth's $C_5$ Class</a></li><li><a href='values/hamming_radius_warmuth_c5.html'>Hamming Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/oriented_diameter_warmu  Teaching-Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/preferencebased_teaching_dimension_warmuth_c5.html'>Preference-Based Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/star_number_warmuth_c5.html'>Star Number of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_projected_teaching_set_size_warmuth_c5.html'>Maximum Projected Teaching-Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/log_shattering_warmuth_c5.html'>Log Shattering of Warmuth's $C_5$ Class</a></li><li><a href='values/log_size_ratio_warmuth_c5.html'>Log Size Ratio of Warmuth's $C_5$ Class</a></li><li><a href='values/membership_query_complexity_warmuth_c5.html'>Membership Query Complexity of Warmuth's $C_5$ Class</a></li><li><a href='values/littlestone_dimension_warmuth_c5.html'>Littlestone Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/equivalence_queries_complexity_warmuth_c5.html'>Equivalence Queries Complexity of Warmuth's $C_5$ Class</a></li><li><a href='values/interpolation_degree_warmuth_c5.html'>Interpolation Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/diameter_warmuth_c5.html'>Diameter of Warmuth's $C_5$ class</a></li><li><a href='values/relative_hitting_size_warmuth_c5.html'>Relative Hitting Size of Warmuth's $C_5$ class</a></li><li><a href='values/hitting_size_warmuth_c5.html'>Hitting Size of Warmuth's $C_5$ Class</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/minimum_largest_order_shattered_set_largest_strongly_shattered_set.html'>Minimum Largest Order Shattered Set / Largest Strongly Shattered Set</a></li><li><a href='relationships/minimum_teaching_set_size_effective_vc_radius.html'>Minimum Teaching Set Size / Effective VC Radius</a></li><li><a href='relationships/projected_maximal_degree_projected_minimum_degree.html'>Projected Maximal Degree / Projected Minimum Degree</a></li><li><a href='relationships/projected_strongly_shattered_dimension_largest_strongly_shattered_set.html'>Projected Strongly Shattered Dimension / Largest Strongly Shattered Set</a></li><li><a href='relationships/maximum_teaching_set_size_largest_strongly_shattered_set.html'>Maximum Teaching Set Size / Largest Strongly Shattered Set</a></li><li><a href='relationships/vc_dimension_densest_subgraph_twice.html'>VC Dimension / Densest Subgraph (twice)</a></li><li><a href='relationships/path_dimension_threshold_dimension.html'>Path Dimension / Threshold Dimension</a></li><li><a href='relationships/recursive_teaching_dimension_interpolation_degree.html'>Recursive Teaching Dimension / Interpolation degree</a></li><li><a href='relationships/diameter_oriented_diameter.html'>Diameter / Oriented Diameter</a></li><li><a href='relationships/recursive_teaching_dimension_effective_vc_radius.html'>Recursive Teaching Dimension / Effective VC Radius</a></li><li><a href='relationships/monotone_recursive_teaching_dimension_vc_dimension.html'>Projected Recursive Teaching Dimension / VC Dimension</a></li><li><a href='relationships/hamming_radius_oriented_diameter.html'>Hamming Radius / Oriented Diameter</a></li><li><a href='relationships/diameter_hamming_radius.html'>Diameter / Hamming Radius</a></li><li><a href='relationships/unlabeled_sample_compression_vc_dimension.html'>Unlabeled Sample Compression / VC Dimension</a></li><li><a href='relationships/diameter_littlestone_dimension.html'>Diameter / Littlestone Dimension</a></li><li><a href='relationships/maximum_teaching_set_size_maximum_degree.html'>Maximum Teaching-Set Size / Maximum Degree</a></li><li><a href='relationships/minimum_teaching_set_size_minimum_degree.html'>Minimum Teaching-Set Size / Minimum Degree</a></li><li><a href='relationships/star_number_vc_dimension.html'>Star Number / VC Dimension</a></li><li><a href='relationships/effective_range_star_number.html'>Effective Range / Star Number</a></li><li><a href='relationships/size_star_number.html'>Size / Star Number</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__76": "\n    <div class=\"table-card\" id=\"math-112\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/size_yang_dimension.html\" class=\"table-title-link\">Size / Yang dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Size / Yang dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/size.html\">Size</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/yang_dimension.html\">Yang dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Generator-count bound for Yang's canonical ideal.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/singletons.html\">Singletons</a></p>\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Yang's canonical ideal $I_{\\mathcal H}^\\star$ has exactly one minimal monomial generator for each $h\\in\\mathcal H$.  For a nonempty class, the Taylor resolution on these $|\\mathcal H|$ generators has length at most $|\\mathcal H|-1$, so its projective dimension (Yang dimension) is at most $|\\mathcal H|-1$.  The empty class has Yang dimension $0$ by convention.  Thus $\\mathrm Y(\\mathcal H)\\le |\\mathcal H|$ in all cases.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#yang2018homological\">[yang2018homological]</a></p></div>\n\n        </div>\n    </div>\n    ", "__label__76": "\n    <div class=\"table-card\" id=\"math-2\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/singletons.html\" class=\"table-title-link\">Singletons</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Singletons</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-e
