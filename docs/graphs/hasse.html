/ VC Dimension</a></li><li><a href='relationships/effective_range_star_number.html'>Effective Range / Star Number</a></li><li><a href='relationships/size_star_number.html'>Size / Star Number</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__101": "\n    <div class=\"table-card\" id=\"math-149\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/double_density_or_average_degree_minimum_degree.html\" class=\"table-title-link\">Double Density or Average Degree / Minimum Degree</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Double Density or Average Degree / Minimum Degree</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/double_density_or_average_degree.html\">Double Density or Average Degree</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/minimum_degree.html\">Minimum Degree</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For every finite $1$-inclusion graph.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>The average vertex degree of a finite graph is at least its minimum vertex degree.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__102": "\n    <div class=\"table-card\" id=\"math-151\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/proper_stable_sample_compression_proper_stable_labeled_sample_compression.html\" class=\"table-title-link\">Proper Stable Sample Compression / Proper Stable Labeled Sample Compression</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Proper Stable Sample Compression / Proper Stable Labeled Sample Compression</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/proper_stable_sample_compression.html\">Proper Stable Sample Compression</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/proper_stable_labeled_sample_compression.html\">Proper Stable Labeled Sample Compression</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Definition</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Every proper stable unlabeled scheme is a proper stable labeled scheme after allowing the retained labels to be stored. The latter model is less restrictive.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#hanneke2021stable\">[hanneke2021stable]</a> <a href=\"bibliography.html#bousquet2020proper\">[bousquet2020proper]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__103": "\n    <div class=\"table-card\" id=\"math-152\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/proper_unlabeled_sample_compression_proper_labeled_sample_compression.html\" class=\"table-title-link\">Proper Unlabeled Sample Compression / Proper Labeled Sample Compression</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Proper Unlabeled Sample Compression / Proper Labeled Sample Compression</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/proper_unlabeled_sample_compression.html\">Proper Unlabeled Sample Compression</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/proper_labeled_sample_compression.html\">Proper Labeled Sample Compression</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Definition</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Every proper unlabeled scheme is a proper labeled scheme after allowing the retained labels to be stored. The latter model is less restrictive.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#bousquet2020proper\">[bousquet2020proper]</a> <a href=\"bibliography.html#chalopin2022unlabeled\">[chalopin2022unlabeled]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__104": "\n    <div class=\"table-card\" id=\"math-153\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/proper_unlabeled_sample_compression_unlabeled_sample_compression.html\" class=\"table-title-link\">Proper Unlabeled Sample Compression / Unlabeled sample compression</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Proper Unlabeled Sample Compression / Unlabeled sample compression</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/proper_unlabeled_sample_compression.html\">Proper Unlabeled Sample Compression</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/unlabeled_sample_compression.html\">Unlabeled sample compression</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Definition</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Proper unlabeled compression requires the reconstruction to belong to $\\mathcal H$, an additional restriction beyond ordinary unlabeled compression. Restricting the allowed schemes cannot decrease the minimum size.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#bousquet2020proper\">[bousquet2020proper]</a> <a href=\"bibliography.html#chalopin2022unlabeled\">[chalopin2022unlabeled]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__105": "\n    <div class=\"table-card\" id=\"math-154\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/proper_stable_sample_compression_stable_unlabeled_complexity.html\" class=\"table-title-link\">Proper Stable Sample Compression / Stable Unlabeled Complexity</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Proper Stable Sample Compression / Stable Unlabeled Complexity</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/proper_stable_sample_compression.html\">Proper Stable Sample Compression</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/stable_unlabeled_complexity.html\">Stable Unlabeled Complexity</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Definition</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Proper stable unlabeled compression adds properness to stable unlabeled compression. Restricting the allowed reconstruction functions cannot decrease the minimum size.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#hanneke2021stable\">[hanneke2021stable]</a> <a href=\"bibliography.html#bousquet2020proper\">[bousquet2020proper]</a> <a href=\"bibliography.html#chalopin2022unlabeled\">[chalopin2022unlabeled]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__106": "\n    <div class=\"table-card\" id=\"math-155\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/proper_stable_labeled_sample_compression_stable_labeled_sample_compression.html\" class=\"table-title-link\">Proper Stable Labeled Sample Compression / Stable Labeled Sample Compression</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Proper Stable Labeled Sample Compression / Stable Labeled Sample Compression</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/proper_stable_labeled_sample_compression.html\">Proper Stable Labeled Sample Compression</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/stable_labeled_sample_compression.html\">Stable Labeled Sample Compression</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Definition</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Proper stable labeled compression adds properness to stable labeled compression. Restricting the allowed reconstruction functions cannot decrease the minimum size.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#hanneke2021stable\">[hanneke2021stable]</a> <a href=\"bibliography.html#bousquet2020proper\">[bousquet2020proper]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__107": "\n    <div class=\"table-card\" id=\"math-156\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/proper_stable_labeled_sample_compression_proper_labeled_sample_compression.html\" class=\"table-title-link\">Proper Stable Labeled Sample Compression / Proper Labeled Sample Compression</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Proper Stable Labeled Sample Compression / Proper Labeled Sample Compression</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/proper_stable_labeled_sample_compression.html\">Proper Stable Labeled Sample Compression</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/proper_labeled_sample_compression.html\">Proper Labeled Sample Compression</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Definition</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Proper stable labeled compression adds stability to proper labeled compression. Restricting the allowed compression functions cannot decrease the minimum size.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#hanneke2021stable\">[hanneke2021stable]</a> <a href=\"bibliography.html#bousquet2020proper\">[bousquet2020proper]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__108": "\n    <div class=\"table-card\" id=\"math-157\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/proper_stable_sample_compression_proper_unlabeled_sample_compression.html\" class=\"table-title-link\">Proper Stable Sample Compression / Proper Unlabeled Sample Compression</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Proper Stable Sample Compression / Proper Unlabeled Sample Compression</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/proper_stable_sample_compression.html\">Proper Stable Sample Compression</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/proper_unlabeled_sample_compression.html\">Proper Unlabeled Sample Compression</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Definition</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Proper stable unlabeled compression adds stability to proper unlabeled compression. Restricting the allowed compression functions cannot decrease the minimum size.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#hanneke2021stable\">[hanneke2021stable]</a> <a href=\"bibliography.html#bousquet2020proper\">[bousquet2020proper]</a> <a href=\"bibliography.html#chalopin2022unlabeled\">[chalopin2022unlabeled]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__109": "\n    <div class=\"table-card\" id=\"math-158\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/stable_labeled_sample_compression_labeled_sample_compression.html\" class=\"table-title-link\">Stable Labeled Sample Compression / Labeled Sample Compression</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Stable Labeled Sample Compression / Labeled Sample Compression</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/stable_labeled_sample_compression.html\">Stable Labeled Sample Compression</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/labeled_sample_compression.html\">Labeled Sample Compression</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Definition</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Stable labeled compression adds stability to labeled compression. Restricting the allowed compression functions cannot decrease the minimum size.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#hanneke2021stable\">[hanneke2021stable]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__110": "\n    <div class=\"table-card\" id=\"math-160\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/proper_labeled_sample_compression_labeled_sample_compression.html\" class=\"table-title-link\">Proper Labeled Sample Compression / Labeled Sample Compression</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Proper Labeled Sample Compression / Labeled Sample Compression</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/proper_labeled_sample_compression.html\">Proper Labeled Sample Compression</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/labeled_sample_compression.html\">Labeled Sample Compression</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Definition</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Proper labeled compression adds properness to labeled compression. Restricting the allowed reconstruction functions cannot decrease the minimum size.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#bousquet2020proper\">[bousquet2020proper]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__111": "\n    <div class=\"table-card\" id=\"math-161\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/occasional_onesided_getback_best_mistakes.html\" class=\"table-title-link\">Occasional One-Sided Getback / Best Mistakes</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Occasional One-Sided Getback / Best Mistakes</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/occasional_onesided_getback.html\">Occasional One-Sided Getback</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/best_mistakes.html\">Best Mistakes</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>O1G has optional mistake-only feedback, while the favorable mistake model supplies full labels.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Any favorable-sequence full-feedback strategy can be used in the best-mistakes model, whereas an O1G learner must operate when feedback may be withheld and every supplied signal only identifies a mistake.  The full-feedback model can simulate O1G and may reveal strictly more information, so $\\mathrm{M}<em _mathrm_o1g=\"\\mathrm{o1g\">{\\mathrm{best}}(\\mathcal H)\\le\\mathrm{M}</em>(\\mathcal H)$.}</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#ben1997online\">[ben1997online]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__112": "\n    <div class=\"table-card\" id=\"math-162\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/occasional_onesided_getback_unlabeled_sample_compression.html\" class=\"table-title-link\">Occasional One-Sided Getback / Unlabeled sample compression</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Occasional One-Sided Getback / Unlabeled sample compression</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/occasional_onesided_getback.html\">Occasional One-Sided Getback</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/unlabeled_sample_compression.html\">Unlabeled sample compression</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes, an OOG learner induces an unlabeled sample-compression scheme of no greater size.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n\n<strong>Full Proof:</strong><div class=\"text-field\"><p>LaTeX survey, OOG/compression lemma (lem:oog-compression).</p></div>\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#ben1997online\">[ben1997online]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__113": "\n    <div class=\"table-card\" id=\"math-163\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/membership_query_complexity_membership_and_proper_equivalence_queries_complexity.html\" class=\"table-title-link\">Membership Query Complexity / Membership and Proper Equivalence Queries Complexity</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Membership Query Complexity / Membership and Proper Equivalence Queries Complexity</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/membership_query_complexity.html\">Membership Query Complexity</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/membership_and_proper_equivalence_queries_complexity.html\">Membership and Proper Equivalence Queries Complexity</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>A membership-only learner is a valid learner in the model that also permits proper equivalence queries.  The additional query type cannot increase the optimum, so membership-only complexity is at least the mixed-model complexity.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__114": "\n    <div class=\"table-card\" id=\"math-166\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/extended_teaching_dimension_teaching_dimension.html\" class=\"table-title-link\">Extended Teaching Dimension / Teaching Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Extended Teaching Dimension / Teaching Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/extended_teaching_dimension.html\">Extended Teaching Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/teaching_dimension.html\">Teaching Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Definition: the maximization defining $\\mathrm{XTD}$ includes targets in the class, for which specifying sets are teaching sets.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>For every target $h\\in\\mathcal H$, a specifying set for $h$ among all labelings is in particular a teaching set for $h$ within $\\mathcal H$. Since $\\mathrm{XTD}$ maximizes over a superset of targets, it is at least $\\mathrm{TD}$.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#hegedHus1995generalized\">[hegedHus1995generalized]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__115": "\n    <div class=\"table-card\" id=\"math-167\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/membership_query_complexity_extended_teaching_dimension.html\" class=\"table-title-link\">Membership Query Complexity / Extended Teaching Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Membership Query Complexity / Extended Teaching Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/membership_query_complexity.html\">Membership Query Complexity</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/extended_teaching_dimension.html\">Extended Teaching Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>A membership-query decision tree supplies a specifying set for every labeling. For finite classes with more than two concepts, Heged\u00fcs also proves $Q_m\\leq \\mathrm{XTD}\\log_2|\\mathcal{H}|$.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Fix a target labeling. Along a membership-query decision-tree path identifying it, the queried coordinates and their answers distinguish that labeling from every other member of the class, so they form a specifying set. The worst path length is therefore at least $\\mathrm{XTD}(\\mathcal H)$.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#hegedHus1995generalized\">[hegedHus1995generalized]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__116": "\n    <div class=\"table-card\" id=\"math-168\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/unlabeled_sample_compression_vc_dimension.html\" class=\"table-title-link\">Unlabeled Sample Compression / VC Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Unlabeled Sample Compression / VC Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/unlabeled_sample_compression.html\">Unlabeled sample compression</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/vc_dimension.html\">VC Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>The inequality can be strict: Warmuth's $C_5$ class has $\\mathrm{USC}=3$ and $\\mathrm{VC}=2$.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/warmuth_c5.html\">Warmuth's $C_5$ class</a></p>\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>If a set of $d$ points is shattered, its $2^d$ full labelings must compress to distinct unlabeled subsets: a single subset has only one reconstruction.  Fewer than $d$ retained points offer only $\\sum_{i=0}^{d-1}\\binom di&lt;2^d$ subsets, so every unlabeled scheme has size at least $d$.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#palvolgyi2021unlabeled\">[palvolgyi2021unlabeled]</a></p></div>\n\n        </div>\n    </div>\n    ", "__label__116": "\n    <div class=\"table-card\" id=\"math-10\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/warmuth_c5.html\" class=\"table-title-link\">Warmuth's $C_5$ class</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Warmuth's $C_5$ class</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"C_5\">\n            \\[C_5\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Let the domain be the cyclic group $\\mathbb{Z}/5\\mathbb{Z}$.  A binary function belongs to $C_5$ precisely when, on some four consecutive cyclic positions, its values are $1,0,0,1$ in that order.  The value on the remaining position is unrestricted, so the class has ten functions.</p></div>\n<strong>Comments:</strong><div class=\"text-field\"><p>This is also called Warmuth's example.  It is a finite separation between unlabeled sample-compression size and VC dimension.</p></div>\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/vc_dimension_warmuth_c5.html'>VC Dimension of Warmuth's $C_5$ class</a></li><li><a href='values/unlabeled_sample_compression_warmuth_c5.html'>Unlabeled Sample Compression of Warmuth's $C_5$ class</a></li><li><a href='values/size_warmuth_c5.html'>Size of Warmuth's $C_5$ class</a></li><li><a href='values/effective_range_warmuth_c5.html'>Effective Range of Warmuth's $C_5$ class</a></li><li><a href='values/log_size_warmuth_c5.html'>Log Size of Warmuth's $C_5$ class</a></li><li><a href='values/largest_shattered_set_warmuth_c5.html'>Largest Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_largest_order_shattered_set_warmuth_c5.html'>Maximum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_vc_radius_warmuth_c5.html'>Projected VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_strongly_shattered_dimension_warmuth_c5.html'>Projected Strongly Shattered Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_degree_warmuth_c5.html'>Maximum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_degree_warmuth_c5.html'>Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/double_density_or_average_degree_warmuth_c5.html'>Double Density or Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/densest_subgraph_twice_warmuth_c5.html'>Densest Subgraph (twice) of Warmuth's $C_5$ Class</a></li><li><a href='values/hamming_radius_warmuth_c5.html'>Hamming Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/oriented_diameter_warmuth_c5.html'>Oriented Diameter of Warmuth's $C_5$ Class</a></li><li><a href='values/threshold_dimension_warmuth_c5.html'>Threshold Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/path_dimension_warmuth_c5.html'>Path Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/degeneracy_warmuth_c5.html'>Degeneracy of Warmuth's $C_5$ Class</a></li><li><a href='values/largest_strongly_shattered_set_warmuth_c5.html'>Largest Strongly Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_positive_degree_warmuth_c5.html'>Maximum Positive Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_maximal_degree_warmuth_c5.html'>Projected Maximal Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_minimum_degree_warmuth_c5.html'>Projected Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_double_density_or_projected_average_degree_warmuth_c5.html'>Projected Double Density or Projected Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/effective_vc_radius_warmuth_c5.html'>Effective VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_largest_order_shattered_set_warmuth_c5.html'>Minimum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_teaching_set_size_warmuth_c5.html'>Minimum Teaching Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_teaching_set_size_warmuth_c5.html'>Maximum Teaching Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/teaching_dimension_warmuth_c5.html'>Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/recursive_teaching_dimension_warmuth_c5.html'>Recursive Teaching Dimension of Warmuth's $C_5$ Class</a></ $ Class</a></li><li><a href='values/membership_query_complexity_warmuth_c5.html'>Membership Query Complexity of Warmuth's $C_5$ Class</a></li><li><a href='values/littlestone_dimension_warmuth_c5.html'>Littlestone Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/equivalence_queries_complexity_warmuth_c5.html'>Equivalence Queries Complexity of Warmuth's $C_5$ Class</a></li><li><a href='values/interpolation_degree_warmuth_c5.html'>Interpolation Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/diameter_warmuth_c5.html'>Diameter of Warmuth's $C_5$ class</a></li><li><a href='values/relative_hitting_size_warmuth_c5.html'>Relative Hitting Size of Warmuth's $C_5$ class</a></li><li><a href='values/hitting_size_warmuth_c5.html'>Hitting Size of Warmuth's $C_5$ Class</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/minimum_largest_order_shattered_set_largest_strongly_shattered_set.html'>Minimum Largest Order Shattered Set / Largest Strongly Shattered Set</a></li><li><a href='relationships/minimum_teaching_set_size_effective_vc_radius.html'>Minimum Teaching Set Size / Effective VC Radius</a></li><li><a href='relationships/projected_maximal_degree_projected_minimum_degree.html'>Projected Maximal Degree / Projected Minimum Degree</a></li><li><a href='relationships/projected_strongly_shattered_dimension_largest_strongly_shattered_set.html'>Projected Strongly Shattered Dimension / Largest Strongly Shattered Set</a></li><li><a href='relationships/maximum_teaching_set_size_largest_strongly_shattered_set.html'>Maximum Teaching Set Size / Largest Strongly Shattered Set</a></li><li><a href='relationships/vc_dimension_densest_subgraph_twice.html'>VC Dimension / Densest Subgraph (twice)</a></li><li><a href='relationships/path_dimension_threshold_dimension.html'>Path Dimension / Threshold Dimension</a></li><li><a href='relationships/recursive_teaching_dimension_interpolation_degree.html'>Recursive Teaching Dimension / Interpolation degree</a></li><li><a href='relationships/diameter_oriented_diameter.html'>Diameter / Oriented Diameter</a></li><li><a href='relationships/recursive_teaching_dimension_effective_vc_radius.html'>Recursive Teaching Dimension / Effective VC Radius</a></li><li><a href='relationships/monotone_recursive_teaching_dimension_vc_dimension.html'>Projected Recursive Teaching Dimension / VC Dimension</a></li><li><a href='relationships/hamming_radius_oriented_diameter.html'>Hamming Radius / Oriented Diameter</a></li><li><a href='relationships/diameter_hamming_radius.html'>Diameter / Hamming Radius</a></li><li><a href='relationships/unlabeled_sample_compression_vc_dimension.html'>Unlabeled Sample Compression / VC Dimension</a></li><li><a href='relationships/diameter_littlestone_dimension.html'>Diameter / Littlestone Dimension</a></li><li><a href='relationships/maximum_teaching_set_size_maximum_degree.html'>Maximum Teaching-Set Size / Maximum Degree</a></li><li><a href='relationships/minimum_teaching_set_size_minimum_degree.html'>Minimum Teaching-Set Size / Minimum Degree</a></li><li><a href='relationships/star_number_vc_dimension.html'>Star Number / VC Dimension</a></li><li><a href='relationships/effective_range_star_number.html'>Effective Range / Star Number</a></li><li><a href='relationships/size_star_number.html'>Size / Star Number</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__120": "\n    <div class=\"table-card\" id=\"math-178\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/effective_range_monotonic_yang_dimension.html\" class=\"table-title-link\">Effective Range / Monotonic Yang Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Effective Range / Monotonic Yang Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/effective_range.html\">Effective Range</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/monotonic_yang_dimension.html\">Monotonic Yang Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Consequence of the max-over-subfamilies construction of monotonic Yang dimension.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>For every subfamily $\\mathcal G\\subseteq\\mathcal H$, the Yang bound gives $\\mathrm Y(\\mathcal G)\\le\\mathrm E(\\mathcal G)$.  Effective range is monotonic under subfamilies, so $\\mathrm E(\\mathcal G)\\le\\mathrm E(\\mathcal H)$.  Taking the maximum over $\\mathcal G$ yields $\\mathrm Y^*(\\mathcal H)\\le\\mathrm E(\\mathcal H)$.</p></div>\n\n<strong>Derivation:</strong><div class=\"text-field\"><p>max_subfamilies from <a href=\"relationships/effective_range_yang_dimension.html\">Effective Range / Yang dimension</a></p></div>\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#yang2018homological\">[yang2018homological]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__121": "\n    <div class=\"table-card\" id=\"math-179\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/size_monotonic_yang_dimension.html\" class=\"table-title-link\">size / monotonic_yang_dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>size / monotonic_yang_dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/size.html\">Size</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/monotonic_yang_dimension.html\">Monotonic Yang Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Consequence of the registered max-over-subfamilies construction.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>For every subfamily $\\mathcal G\\subseteq\\mathcal H$, $\\mathrm Y(\\mathcal G)\\le |\\mathcal G|\\le |\\mathcal H|$.  Taking the maximum over $\\mathcal G$ gives $\\mathrm Y^*(\\mathcal H)\\le |\\mathcal H|$.</p></div>\n\n<strong>Derivation:</strong><div class=\"text-field\"><p>max_subfamilies from <a href=\"relationships/size_yang_dimension.html\">Size / Yang dimension</a></p></div>\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#yang2018homological\">[yang2018homological]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__122": "\n    <div class=\"table-card\" id=\"math-180\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/size_hitting_size.html\" class=\"table-title-link\">Size / Hitting Size</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Size / Hitting Size</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/size.html\">Size</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/hitting_size.html\">Hitting Size</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>A hitting set can select one coordinate from each nonempty concept.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>For each nonempty $h\\in\\mathcal H$, choose one element $x_h\\in h$.  The set of chosen elements meets every nonempty concept, so $\\mathrm{HT}(\\mathcal H)\\le |\\mathcal H|$.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__123": "\n    <div class=\"table-card\" id=\"math-181\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/effective_range_covc_dimension.html\" class=\"table-title-link\">Effective Range / co-VC Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Effective Range / co-VC Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/effective_range.html\">Effective Range</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/covc_dimension.html\">co-VC dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>A hollow star can use only coordinates in the effective range.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>If a projected class contains a hollow $d$-star on S, then for each $x\\in S$ the star's realizable neighbours include labelings that differ at x.  Thus every x in S lies in the effective range, so $d\\le \\mathrm E(\\mathcal H)$.  Maximizing d gives $\\mathrm{coVC}(\\mathcal H)\\le\\mathrm E(\\mathcal H)$.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#bousquet2020proper\">[bousquet2020proper]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__124": "\n    <div class=\"table-card\" id=\"math-182\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/effective_range_log_size_ratio.html\" class=\"table-title-link\">Effective Range / Log Size Ratio</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Effective Range / Log Size Ratio</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/effective_range.html\">Effective Range</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/log_size_ratio.html\">Log Size Ratio</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Effective range controls both the number of varying coordinates and class size.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>All concepts agree outside the effective range, hence $|\\mathcal H|\\le 2^{\\mathrm E(\\mathcal H)}$.  For a nonempty domain, $\\log(n+1)\\ge1$, so $\\log(|\\mathcal H|-1)/\\log(n+1)\\le\\mathrm E(\\mathcal H)$.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__125": "\n    <div class=\"table-card\" id=\"math-183\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/size_information_complexity.html\" class=\"table-title-link\">Size / Information Complexity</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Size / Information Complexity</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/size.html\">Size</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/information_complexity.html\">Information Complexity</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>A finite class has a proper empirical-risk learner whose output carries at most its log-cardinality in information.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Fix a deterministic proper empirical-risk minimizer with a fixed tie-breaking order on $\\mathcal H$.  Its output takes at most $|\\mathcal H|$ values, hence $I(S;\\mathcal A(S))\\le H(\\mathcal A(S))\\le\\log_2|\\mathcal H|\\le|\\mathcal H|$ (with value 0 for a singleton class).  Taking the infimum in the definition of information complexity preserves this upper bound.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#pradeep2022information\">[pradeep2022information]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__126": "\n    <div class=\"table-card\" id=\"math-184\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/effective_range_oriented_diameter.html\" class=\"table-title-link\">Effective Range / Oriented Diameter</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Effective Range / Oriented Diameter</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/effective_range.html\">Effective Range</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/oriented_diameter.html\">Oriented Diameter</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Every coordinate in an oriented pair is active.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>If an oriented pair (\\emptyset,S) is realized in a projection, its two realizing concepts differ on every coordinate of S. Thus S is contained in the effective range. Maximizing gives (\\mathrm E(\\mathcal H)\\ge\\mathrm D^+(\\mathcal H)).</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__127": "\n    <div class=\"table-card\" id=\"math-188\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/effective_range_proper_stable_sample_compression.html\" class=\"table-title-link\">Effective Range / Proper Stable Sample Compression</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Effective Range / Proper Stable Sample Compression</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/effective_range.html\">Effective Range</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/proper_stable_sample_compression.html\">Proper Stable Sample Compression</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Retain all active-coordinate examples of the sample and reconstruct the least consistent member of the class. This is proper, discarding inactive examples preserves consistency, and retaining every remaining example makes stability immediate. Its size is at most (\\mathrm E(\\mathcal H)).</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__128": "\n    <div class=\"table-card\" id=\"math-192\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/size_sign_rank.html\" class=\"table-title-link\">Size / Sign Rank</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Size / Sign Rank</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/size.html\">Size</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/sign_rank.html\">Sign Rank</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>The rank of a matrix is at most its number of rows.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>The incidence sign matrix of (\\mathcal H) has (|\\mathcal H|) rows. Any real matrix realizing its sign pattern has rank at most its number of rows, so minimizing this rank gives (\\mathrm{SR}(\\mathcal H)\\le |\\mathcal H|).</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__129": "\n    <div class=\"table-card\" id=\"math-193\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/effective_range_minimum_teaching_set_size.html\" class=\"table-title-link\">Effective Range / Minimum Teaching Set Size</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Effective Range / Minimum Teaching Set Size</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/effective_range.html\">Effective Range</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/minimum_teaching_set_size.html\">Minimum Teaching Set Size</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Full active-coordinate samples identify every concept.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Two distinct concepts differ at an active coordinate. Thus the labels of any concept on the full effective range identify it within the class, giving it a teaching set of size at most (\\mathrm E(\\mathcal H)). In particular the minimum teaching-set size is at most that value.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__130": "\n    <div class=\"table-card\" id=\"math-197\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/effective_range_positive_recursive_teaching_dimension.html\" class=\"table-title-link\">Effective Range / Positive Recursive Teaching Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Effective Range / Positive Recursive Teaching Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/effective_range.html\">Effective Range</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/positive_recursive_teaching_dimension.html\">Positive Recursive Teaching Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Repeatedly remove an inclusion-maximal concept. Its positive labels on all active coordinates distinguish it from every remaining concept: no remaining concept can contain it, and each differs on a positive coordinate. These samples have size at most (\\mathrm E(\\mathcal H)), yielding a positive recursive teaching sequence with that bound.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__131": "\n    <div class=\"table-card\" id=\"math-198\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/effective_range_proper_ordered_sample_compression.html\" class=\"table-title-link\">Effective Range / Proper Ordered Sample Compression</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Effective Range / Proper Ordered Sample Compression</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/effective_range.html\">Effective Range</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/proper_ordered_sample_compression.html\">Proper Ordered Sample Compression</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Fix an order of the class, retain every active-coordinate example, and decode to the least class member consistent with it. The decoder is proper and remains consistent with the full sample because inactive coordinates have a common label. This proper order-compression scheme retains at most (\\mathrm E(\\mathcal H)) examples.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__132": "\n    <div class=\"table-card\" id=\"math-2\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/largest_shattered_set_minimum_largest_order_shattered_set.html\" class=\"table-title-link\">Largest Shattered Set / Minimum Largest Order Shattered Set</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Largest Shattered Set / Minimum Largest Order Shattered Set</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/largest_shattered_set.html\">Largest Shattered Set</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/minimum_largest_order_shattered_set.html\">Minimum Largest Order Shattered Set</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>The order-shattered sets are shattered sets.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Every order-shattered set is shattered, so the largest size of a shattered set is at least the corresponding order-shattering parameter.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#bollobas1995defect\">[bollobas1995defect]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__133": "\n    <div class=\"table-card\" id=\"math-3\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/minimum_largest_order_shattered_set_largest_strongly_shattered_set.html\" class=\"table-title-link\">Minimum Largest Order Shattered Set / Largest Strongly Shattered Set</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Minimum Largest Order Shattered Set / Largest Strongly Shattered Set</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/minimum_largest_order_shattered_set.html\">Minimum Largest Order Shattered Set</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/largest_strongly_shattered_set.html\">Largest Strongly Shattered Set</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Strong shattering is a special case of order shattering.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/warmuth_c5.html\">Warmuth's $C_5$ class</a></p>\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>A strongly shattered set contains a full subcube and hence satisfies the order-shattering condition.  Thus the order-shattering parameter is at least the largest strongly shattered set.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#bollobas1995defect\">[bollobas1995defect]</a></p></div>\n\n        </div>\n    </div>\n    ", "__label__133": "\n    <div class=\"table-card\" id=\"math-10\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/warmuth_c5.html\" class=\"table-title-link\">Warmuth's $C_5$ class</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Warmuth's $C_5$ class</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"C_5\">\n            \\[C_5\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Let the domain be the cyclic group $\\mathbb{Z}/5\\mathbb{Z}$.  A binary function belongs to $C_5$ precisely when, on some four consecutive cyclic positions, its values are $1,0,0,1$ in that order.  The value on the remaining position is unrestricted, so the class has ten functions.</p></div>\n<strong>Comments:</strong><div class=\"text-field\"><p>This is also called Warmuth's example.  It is a finite separation between unlabeled sample-compression size and VC dimension.</p></div>\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/vc_dimension_warmuth_c5.html'>VC Dimension of Warmuth's $C_5$ class</a></li><li><a href='values/unlabeled_sample_compression_warmuth_c5.html'>Unlabeled Sample Compression of Warmuth's $C_5$ class</a></li><li><a href='values/size_warmuth_c5.html'>Size of Warmuth's $C_5$ class</a></li><li><a href='values/effective_range_warmuth_c5.html'>Effective Range of Warmuth's $C_5$ class</a></li><li><a href='values/log_size_warmuth_c5.html'>Log Size of Warmuth's $C_5$ class</a></li><li><a href='values/largest_shattered_set_warmuth_c5.html'>Largest Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_largest_order_shattered_set_warmuth_c5.html'>Maximum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_vc_radius_warmuth_c5.html'>Projected VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_strongly_shattered_dimension_warmuth_c5.html'>Projected Strongly Shattered Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_degree_warmuth_c5.html'>Maximum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_degree_warmuth_c5.html'>Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/double_density_or_average_degree_warmuth_c5.html'>Double Density or Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/densest_subgraph_twice_warmuth_c5.html'>Densest Subgraph (twice) of Warmuth's $C_5$ Class</a></li><li><a href='values/hamming_radius_warmuth_c5.html'>Hamming Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/oriented_diameter_warmuth_c5.html'>Oriented Diameter of Warmuth's $C_5$ Class</a></li><li><a href='values/threshold_dimension_warmuth_c5.html'>Threshold Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/path_dimension_warmuth_c5.html'>Path Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/degeneracy_warmuth_c5.html'>Degeneracy of Warmuth's $C_5$ Class</a></li><li><a href='values/largest_strongly_shattered_set_warmuth_c5.html'>Largest Strongly Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_positive_degree_warmuth_c5.html'>Maximum Positive Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_maximal_degree_warmuth_c5.html'>Projected Maximal Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_minimum_degree_warmuth_c5.html'>Projected Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_double_density_or_projected_average_degree_warmuth_c5.html'>Projected Double Density or Projected Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/effective_vc_radius_warmuth_c5.html'>Effective VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_largest_order_shattered_set_warmuth_c5.html'>Minimum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_teaching_set_size_warmuth_c5.html'>Minimum Teaching Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_teaching_set_size_warmuth_c5.html'>Maximum Teaching Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/teaching_dimension_warmuth_c5.html'>Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/recursive_teaching_dimension_warmuth_c5.html'>Recursive Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/monotone_recursive_teaching_dimension_warmuth_c5.html'>Projected Recursive Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/monotonic_minimum_teaching_set_size_warmuth_c5.html'>Monotonic Minimum Teaching-Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/preferencebased_teaching_dimension_warmuth_c5.html'>Preference-Based Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/star_number_warmuth_c5.html'>Star Number of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_projected_teaching_set_size_warmuth_c5.html'>Maximum Projected Teaching-Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/log_shattering_warmuth_c5.html'>Log Shattering of Warmuth's $C_5$ Class</a></li><li><a href='values/log_size_ratio_warmuth_c5.html'>Log Size Ratio of Warmuth's $C_5$ Class</a></li><li><a href='values/membership_query_complexity_warmuth_c5.html'>Membership Query Complexity of Warmuth's $C_5$ Class</a></li><li><a href='values/littlestone_dimension_warmuth_c5.html'>Littlestone Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/equivalence_queries_complexity_warmuth_c5.html'>Equivalence Queries Complexity of Warmuth's $C_5$ Class</a></li><li><a href='values/interpolation_degree_warmuth_c5.html'>Interpolation Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/diameter_warmuth_c5.html'>Diameter of Warmuth's $C_5$ class</a></li><li><a href='values/relative_hitting_size_warmuth_c5.html'>Relative Hitting Size of Warmuth's $C_5$ class</a></li><li><a href='values/hitting_size_warmuth_c5.html'>Hitting Size of Warmuth's $C_5$ Class</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/minimum_largest_order_shattered_set_largest_strongly_shattered_set.html'>Minimum Largest Order Shattered Set / Largest Strongly Shattered Set</a></li><li><a href='relationships/minimum_teaching_set_size_effective_vc_radius.html'>Minimum Teaching Set Size / Effective VC Radius</a></li><li><a href='relationships/projected_maximal_degree_projected_minimum_degree.html'>Projected Maximal Degree / Projected Minimum Degree</a></li><li><a href='relationships/projected_strongly_shattered_dimension_largest_strongly_shattered_set.html'>Projected Strongly Shattered Dimension / Largest Strongly Shattered Set</a></li><li><a href='relationships/maximum_teaching_set_size_largest_strongly_shattered_set.html'>Maximum Teaching Set Size / Largest Strongly Shattered Set</a></li><li><a href='relationships/vc_dimension_densest_subgraph_twice.html'>VC Dimension / Densest Subgraph (twice)</a></li><li><a href='relationships/path_dimension_threshold_dimension.html'>Path Dimension / Threshold Dimension</a></li><li><a href='relationships/recursive_teaching_dimension_interpolation_degree.html'>Recursive Teaching Dimension / Interpolation degree</a></li><li><a href='relationships/diameter_oriented_diameter.html'>Diameter / Oriented Diameter</a></li><li><a href='relationships/recursive_teaching_dimension_effective_vc_radius.html'>Recursive Teaching Dimension / Effective VC Radius</a></li><li><a href='relationships/monotone_recursive_teaching_dimension_vc_dimension.html'>Projected Recursive Teaching Dimension / VC Dimension</a></li><li><a href='relationships/hamming_radius_oriented_diameter.html'>Hamming Radius / Oriented Diameter</a></li><li><a href='relationships/diameter_hamming_radius.html'>Diameter / Hamming Radius</a></li><li><a href='relationships/unlabeled_sample_compression_vc_dimension.html'>Unlabeled Sample Compression / VC Dimension</a></li><li><a href='relationships/diameter_littlestone_dimension.html'>Diameter / Littlestone Dimension</a></li><li><a href='relationships/maximum_teaching_set_size_maximum_degree.html'>Maximum Teaching-Set Size / Maximum Degree</a></li><li><a href='relationships/minimum_teaching_set_size_minimum_degree.html'>Minimum Teaching-Set Size / Minimum Degree</a></li><li><a href='relationships/star_number_vc_dimension.html'>Star Number / VC Dimension</a></li><li><a href='relationships/effective_range_star_number.html'>Effective Range / Star Number</a></li><li><a href='relationships/size_star_number.html'>Size / Star Number</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__134": "\n    <div class=\"table-card\" id=\"math-17\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/maximum_degree_minimum_degree.html\" class=\"table-title-link\">Maximum Degree / Minimum Degree</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Maximum Degree / Minimum Degree</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/maximum_degree.html\">Maximum Degree</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/minimum_degree.html\">Minimum Degree</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For every finite $1$-inclusion graph.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/tagged_singletons.html\">Tagged Singletons</a></p>\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>In any graph the maximum degree is at least the minimum degree.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#haussler1988predicting\">[haussler1988predicting]</a></p></div>\n\n        </div>\n    </div>\n    ", "__label__134": "\n    <div class=\"table-card\" id=\"math-6\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/tagged_singletons.html\" class=\"table-title-link\">Tagged Singletons</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Tagged Singletons</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\text{Tag}\">\n            \\[\\text{Tag}\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>(see <a href=\"bibliography.html#maass1992lower\">[maass1992lower]</a>): Define the function $f(i):=\\min {\\ell: i\\le \\sum_{j=1}^\\ell n2^{-j} + \\lceil \\log n \\rceil + 1}$. The class of tagged singletons is defined as $$\n        \\mathcal{H}:={\\emptyset} \\cup {{n+\\ell\\}:\\ell \\in [\\lceil\\log n\\rceil]} \\cup {{i,n+f(i)\\}:i\\in[n]}\n        $$</p>\n<p>So we have the empty set, singletons on $[n+1, n+\\lceil\\log n\\rceil]$, and then singletons on $[n]$ with a tag such that more than half have the first tag, more than one fourth have the second tag and so on.</p></div>\n\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/recursive_teaching_dimension_tagged_singletons.html'>Recursive Teaching Dimension of Tagged Singletons</a></li><li><a href='values/star_number_tagged_singletons.html'>Star number of Tagged Singletons</a></li><li><a href='values/covc_dimension_tagged_singletons.html'>co-VC dimension of Tagged Singletons</a></li><li><a href='values/maximum_degree_tagged_singletons.html'>Maximum Degree of Tagged Singletons</a></li><li><a href='values/size_tagged_singletons.html'>Size of Tagged Singletons</a></li><li><a href='values/vc_dimension_tagged_singletons.html'>VC Dimension of Tagged Singletons</a></li><li><a href='values/hamming_radius_tagged_singletons.html'>Hamming Radius of Tagged Singletons</a></li><li><a href='values/diameter_tagged_singletons.html'>Diameter of Tagged Singletons</a></li><li><a href='values/oriented_diameter_tagged_singletons.html'>Oriented Diameter of Tagged Singletons</a></li><li><a href='values/effective_range_tagged_singletons.html'>Effective Range of Tagged Singletons</a></li><li><a href='values/threshold_dimension_tagged_singletons.html'>Threshold Dimension of Tagged Singletons</a></li><li><a href='values/littlestone_dimension_tagged_singletons.html'>Littlestone Dimension of Tagged Singletons</a></li><li><a href='values/proper_equivalence_queries_complexity_tagged_singletons.html'>Proper Equivalence Queries Complexity of Tagged Singletons</a></li><li><a href='values/log_size_tagged_singletons.html'>Log Size of Tagged Singletons</a></li><li><a href='values/log_size_ratio_tagged_singletons.html'>Log Size Ratio of Tagged Singletons</a></li><li><a href='values/largest_shattered_set_tagged_singletons.html'>Largest Shattered Set of Tagged Singletons</a></li><li><a href='values/maximum_largest_order_shattered_set_tagged_singletons.html'>Maximum Largest Order Shattered Set of Tagged Singletons</a></li><li><a href='values/projected_vc_radius_tagged_singletons.html'>Projected VC Radius of Tagged Singletons</a></li><li><a href='values/projected_strongly_shattered_dimension_tagged_singletons.html'>Projected Strongly Shattered Dimension of Tagged Singletons</a></li><li><a href='values/maximum_projected_teaching_set_size_tagged_singletons.html'>Maximum Projected Teaching-Set Size of Tagged Singletons</a></li><li><a href='values/projected_maximal_degree_tagged_singletons.html'>Projected Maximal Degree of Tagged Singletons</a></li><li><a href='values/monotonic_minimum_teaching_set_size_tagged_singletons.html'>Monotonic Minimum Teaching-Set Size of Tagged Singletons</a></li><li><a href='values/preferencebased_teaching_dimension_tagged_singletons.html'>Preference-Based Teaching Dimension of Tagged Singletons</a></li><li><a href='values/equivalence_queries_complexity_tagged_singletons.html'>Equivalence Queries Complexity of Tagged Singletons</a></li><li><a href='values/hitting_size_tagged_singletons.html'>Hitting Size of Tagged Singletons</a></li><li><a href='values/interpolation_degree_tagged_singletons.html'>Interpolation Degree of Tagged Singletons</a></li><li><a href='values/effective_vc_radius_tagged_singletons.html'>Effective VC Radius of Tagged Singletons</a></li><li><a href='values/minimum_teaching_set_size_tagged_singletons.html'>Minimum Teaching-Set Size of Tagged Singletons</a></li><li><a href='values/positive_teaching_dimension_tagged_singletons.html'>Positive Teaching Dimension of Tagged Singletons</a></li><li><a href='values/positive_recursive_teaching_dimension_tagged_singletons.html'>Positive Recursive Teaching Dimension of Tagged Singletons</a></li><li><a href='values/positive_noclashing_teaching_dimension_tagged_singletons.html'>Positive No-Clashing Teaching Dimension of Tagged Singletons</a></li><li><a href='values/noclashing_teaching_dimension_tagged_singletons.html'>No-Clashing Teaching Dimension of Tagged Singletons</a></li><li><a href='values/minimum_degree_tagged_singletons.html'>Minimum Degree of Tagged Singletons</a></li><li><a href='values/double_density_or_average_degree_tagged_singletons.html'>Double Density or Average Degree of Tagged Singletons</a></li><li><a href='values/densest_subgraph_twice_tagged_singletons.html'>Densest Subgraph (twice) of Tagged Singletons</a></li><li><a href='values/log_shattering_tagged_singletons.html'>Log Shattering of Tagged Singletons</a></li><li><a href='values/largest_strongly_shattered_set_tagged_singletons.html'>Largest Strongly Shattered Set of Tagged Singletons</a></li><li><a href='values/teaching_dimension_tagged_singletons.html'>Teaching Dimension of Tagged Singletons</a></li><li><a href='values/maximum_teaching_set_size_tagged_singletons.html'>Maximum Teaching-Set Size of Tagged Singletons</a></li><li><a href='values/relative_hitting_size_tagged_singletons.html'>Relative Hitting Size of Tagged Singletons</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/maximum_degree_double_density_or_average_degree.html'>Maximum Degree / Double Density or Average Degree</a></li><li><a href='relationships/maximum_degree_minimum_degree.html'>Maximum Degree / Minimum Degree</a></li><li><a href='relationships/maximum_degree_densest_subgraph_twice.html'>Maximum Degree / Densest Subgraph (twice)</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__135": "\n    <div class=\"table-card\" id=\"math-39\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/maximum_degree_degeneracy.html\" class=\"table-title-link\">Maximum Degree / Degeneracy</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Maximum Degree / Degeneracy</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/maximum_degree.html\">Maximum Degree</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/degeneracy.html\">Degeneracy</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For every finite $1$-inclusion graph.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/halfintervals.html\">Half-intervals</a></p>\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Every induced subgraph has maximum degree at most the maximum degree of the original graph, and its minimum degree is at most that maximum.  Maximize over induced subgraphs in the definition of degeneracy.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#haussler1988predicting\">[haussler1988predicting]</a> <a href=\"bibliography.html#alon1992colorings\">[alon1992colorings]</a></p></div>\n\n        </div>\n    </div>\n    ", "__label__135": "\n    <div class=\"table-card\" id=\"math-5\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/halfintervals.html\" class=\"table-title-link\">Half-intervals</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Half-intervals</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\{[i]\\}_{1\\le i\\le n}\">\n            \\[\\{[i]\\}_{1\\le i\\le n}\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Initial segments or thresholds.</p></div>\n\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/recursive_teaching_dimension_halfintervals.html'>Recursive Teaching Dimension of Half-intervals</a></li><li><a href='values/covc_dimension_halfintervals.html'>co-VC dimension of Half-intervals</a></li><li><a href='values/largest_strongly_shattered_set_halfintervals.html'>Largest Strongly Shattered Set of Half-intervals</a></li><li><a href='values/star_number_halfintervals.html'>Star number of Half-intervals</a></li><li><a href='values/maximum_degree_halfintervals.html'>Maximum Degree of Half-intervals</a></li><li><a href='values/size_halfintervals.html'>Size of Half-intervals</a></li><li><a href='values/effective_range_halfintervals.html'>Effective Range of Half-intervals</a></li><li><a href='values/littlestone_dimension_halfintervals.html'>Littlestone Dimension of Half-intervals</a></li><li><a href='values/proper_equivalence_queries_complexity_halfintervals.html'>Proper Equivalence Queries Complexity of Half-intervals</a></li><li><a href='values/log_size_halfintervals.html'>Log Size of H
