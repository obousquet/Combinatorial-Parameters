als</a></li><li><a href='values/extended_teaching_dimension_halfintervals.html'>Extended Teaching Dimension of Half-intervals</a></li><li><a href='values/projected_minimum_degree_halfintervals.html'>Projected Minimum Degree of Half-intervals</a></li><li><a href='values/projected_double_density_or_projected_average_degree_halfintervals.html'>Projected Double Density or Projected Average Degree of Half-intervals</a></li><li><a href='values/order_sample_compression_halfintervals.html'>Order Sample Compression of Half-intervals</a></li><li><a href='values/proper_ordered_sample_compression_halfintervals.html'>Proper Ordered Sample Compression of Half-intervals</a></li><li><a href='values/unlabeled_sample_compression_halfintervals.html'>Unlabeled Sample Compression of Half-intervals</a></li><li><a href='values/proper_unlabeled_sample_compression_halfintervals.html'>Proper Unlabeled Sample Compression of Half-intervals</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/teaching_dimension_recursive_teaching_dimension.html'>Teaching Dimension / Recursive Teaching Dimension</a></li><li><a href='relationships/threshold_dimension_vc_dimension.html'>Threshold Dimension / VC Dimension</a></li><li><a href='relationships/log_shattering_effective_range.html'>Log Shattering / Effective Range</a></li><li><a href='relationships/vc_dimension_log_shattering.html'>VC Dimension / Log Shattering</a></li><li><a href='relationships/maximum_degree_degeneracy.html'>Maximum Degree / Degeneracy</a></li><li><a href='relationships/maximum_degree_maximum_positive_degree.html'>Maximum Degree / Maximum Positive Degree</a></li><li><a href='relationships/log_size_size.html'>Log Size / Size</a></li><li><a href='relationships/littlestone_dimension_vc_dimension.html'>Littlestone Dimension / VC Dimension</a></li><li><a href='relationships/size_proper_equivalence_queries_complexity.html'>Size / Proper Equivalence Queries Complexity</a></li><li><a href='relationships/threshold_dimension_littlestone_dimension.html'>Threshold Dimension / Littlestone Dimension</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__171": "\n    <div class=\"table-card\" id=\"math-176\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/hamming_radius_log_size.html\" class=\"table-title-link\">Hamming Radius / Log Size</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Hamming Radius / Log Size</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/hamming_radius.html\">Hamming Radius</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/log_size.html\">Log Size</a></p>\n<p><strong>Relationship Type:</strong> $P_1 \\ge \\frac{cP_2}{\\log n}$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes on a domain of size n at least 2, Hamming radius is at least log-size divided by log n.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n\n<strong>Full Proof:</strong><div class=\"text-field\"><p>Full proof in the LaTeX survey: Lemma <code>lem:basic-parameter-relationships</code>.</p></div>\n\n\n\n        </div>\n    </div>\n    ", "__edge__172": "\n    <div class=\"table-card\" id=\"math-12\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/degeneracy_minimum_degree.html\" class=\"table-title-link\">Degeneracy / Minimum Degree</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Degeneracy / Minimum Degree</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/degeneracy.html\">Degeneracy</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/minimum_degree.html\">Minimum Degree</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> Monotonic</p>\n<strong>Details:</strong><div class=\"text-field\"><p>For every finite $1$-inclusion graph.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Degeneracy is the maximum, over induced subgraphs, of their minimum degrees.  Taking the original graph as one candidate gives at least its minimum degree.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#haussler1988predicting\">[haussler1988predicting]</a> <a href=\"bibliography.html#alon1992colorings\">[alon1992colorings]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__173": "\n    <div class=\"table-card\" id=\"math-81\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/monotonic_projected_minimum_teaching_set_size_minimum_projected_teaching_set_size.html\" class=\"table-title-link\">Monotonic Projected Minimum Teaching Set Size / Minimum Projected Teaching Set Size</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Monotonic Projected Minimum Teaching Set Size / Minimum Projected Teaching Set Size</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/monotonic_projected_minimum_teaching_set_size.html\">Monotonic Projected Minimum Teaching Set Size</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/minimum_projected_teaching_set_size.html\">Minimum Projected Teaching Set Size</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> Monotonic</p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>The monotonic projected variant takes an additional maximum over subfamilies.  Taking the original class as the subfamily recovers the ordinary projected minimum teaching-set size.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__174": "\n    <div class=\"table-card\" id=\"math-141\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/monotonic_minimum_teaching_set_size_minimum_teaching_set_size.html\" class=\"table-title-link\">Monotonic Minimum Teaching Set Size / Minimum Teaching Set Size</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Monotonic Minimum Teaching Set Size / Minimum Teaching Set Size</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/monotonic_minimum_teaching_set_size.html\">Monotonic Minimum Teaching Set Size</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/minimum_teaching_set_size.html\">Minimum Teaching Set Size</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> Monotonic</p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>The monotonic variant maximizes the minimum teaching-set size over subfamilies, and the original class is among those subfamilies.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__175": "\n    <div class=\"table-card\" id=\"math-148\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/densest_subgraph_twice_double_density_or_average_degree.html\" class=\"table-title-link\">Densest Subgraph (twice) / Double Density or Average Degree</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Densest Subgraph (twice) / Double Density or Average Degree</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/densest_subgraph_twice.html\">Densest Subgraph (twice)</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/double_density_or_average_degree.html\">Double Density or Average Degree</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> Monotonic</p>\n<strong>Details:</strong><div class=\"text-field\"><p>For every finite $1$-inclusion graph.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>The densest-subgraph parameter maximizes average degree over subgraphs.  The original graph is one candidate, so its average degree cannot be larger.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__176": "\n    <div class=\"table-card\" id=\"math-165\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/monotonic_yang_dimension_yang_dimension.html\" class=\"table-title-link\">Monotonic Yang Dimension / Yang dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Monotonic Yang Dimension / Yang dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/monotonic_yang_dimension.html\">Monotonic Yang Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/yang_dimension.html\">Yang dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> Monotonic</p>\n<strong>Details:</strong><div class=\"text-field\"><p>Definition</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>The defining maximum for $\\mathrm Y^*(\\mathcal H)$ ranges over all subfamilies, including $\\mathcal H$ itself. Its value is therefore at least $\\mathrm Y(\\mathcal H)$.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__177": "\n    <div class=\"table-card\" id=\"math-61\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/maximum_degree_maximum_positive_degree.html\" class=\"table-title-link\">Maximum Degree / Maximum Positive Degree</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Maximum Degree / Maximum Positive Degree</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/maximum_degree.html\">Maximum Degree</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/maximum_positive_degree.html\">Maximum Positive Degree</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> Relative</p>\n<strong>Details:</strong><div class=\"text-field\"><p>For the oriented one-inclusion graph of every finite concept class.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/halfintervals.html\">Half-intervals</a></p>\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>For every vertex, its number of smaller neighbours is at most its total degree.  Taking maxima over vertices gives the inequality.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__label__177": "\n    <div class=\"table-card\" id=\"math-5\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/halfintervals.html\" class=\"table-title-link\">Half-intervals</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Half-intervals</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\{[i]\\}_{1\\le i\\le n}\">\n            \\[\\{[i]\\}_{1\\le i\\le n}\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Initial segments or thresholds.</p></div>\n\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/recursive_teaching_dimension_halfintervals.html'>Recursive Teaching Dimension of Half-intervals</a></li><li><a href='values/covc_dimension_halfintervals.html'>co-VC dimension of Half-intervals</a></li><li><a href='values/largest_strongly_shattered_set_halfintervals.html'>Largest Strongly Shattered Set of Half-intervals</a></li><li><a href='values/star_number_halfintervals.html'>Star number of Half-intervals</a></li><li><a href='values/maximum_degree_halfintervals.html'>Maximum Degree of Half-intervals</a></li><li><a href='values/size_halfintervals.html'>Size of Half-intervals</a></li><li><a href='values/effective_range_halfintervals.html'>Effective Range of Half-intervals</a></li><li><a href='values/littlestone_dimension_halfintervals.html'>Littlestone Dimension of Half-intervals</a></li><li><a href='values/proper_equivalence_queries_complexity_halfintervals.html'>Proper Equivalence Queries Complexity of Half-intervals</a></li><li><a href='values/log_size_halfintervals.html'>Log Size of Half-intervals</a></li><li><a href='values/threshold_dimension_halfintervals.html'>Threshold Dimension of Half-intervals</a></li><li><a href='values/oriented_diameter_halfintervals.html'>Oriented Diameter of Half-intervals</a></li><li><a href='values/diameter_halfintervals.html'>Diameter of Half-intervals</a></li><li><a href='values/hamming_radius_halfintervals.html'>Hamming Radius of Half-intervals</a></li><li><a href='values/path_dimension_halfintervals.html'>Path Dimension of Half-intervals</a></li><li><a href='values/log_shattering_halfintervals.html'>Log Shattering of Half-intervals</a></li><li><a href='values/vc_dimension_halfintervals.html'>VC Dimension of Half-intervals</a></li><li><a href='values/teaching_dimension_halfintervals.html'>Teaching Dimension of Half-intervals</a></li><li><a href='values/minimum_teaching_set_size_halfintervals.html'>Minimum Teaching Set Size of Half-intervals</a></li><li><a href='values/maximum_teaching_set_size_halfintervals.html'>Maximum Teaching Set Size of Half-intervals</a></li><li><a href='values/log_size_ratio_halfintervals.html'>Log Size Ratio of Half-intervals</a></li><li><a href='values/minimum_degree_halfintervals.html'>Minimum Degree of Half-intervals</a></li><li><a href='values/degeneracy_halfintervals.html'>Degeneracy of Half-intervals</a></li><li><a href='values/densest_subgraph_twice_halfintervals.html'>Densest Subgraph (twice) of Half-intervals</a></li><li><a href='values/double_density_or_average_degree_halfintervals.html'>Double Density or Average Degree of Half-intervals</a></li><li><a href='values/maximum_positive_degree_halfintervals.html'>Maximum Positive Degree of Half-intervals</a></li><li><a href='values/largest_shattered_set_halfintervals.html'>Largest Shattered Set of Half-intervals</a></li><li><a href='values/relative_hitting_size_halfintervals.html'>Relative Hitting Size of Half-intervals</a></li><li><a href='values/maximum_largest_order_shattered_set_halfintervals.html'>Maximum Largest Order Shattered Set of Half-intervals</a></li><li><a href='values/projected_vc_radius_halfintervals.html'>Projected VC Radius of Half-intervals</a></li><li><a href='values/projected_strongly_shattered_dimension_halfintervals.html'>Projected Strongly Shattered Dimension of Half-intervals</a></li><li><a href='values/maximum_projected_teaching_set_size_halfintervals.html'>Maximum Projected Teaching-Set Size of Half-intervals</a></li><li><a href='values/projected_maximal_degree_halfintervals.html'>Projected Maximal Degree of Half-intervals</a></li><li><a href='values/monotonic_minimum_teaching_set_size_halfintervals.html'>Monotonic Minimum Teaching-Set Size of Half-intervals</a></li><li><a href='values/preferencebased_teaching_dimension_halfintervals.html'>Preference-Based Teaching Dimension of Half-intervals</a></li><li><a href='values/equivalence_queries_complexity_halfintervals.html'>Equivalence Queries Complexity of Half-intervals</a></li><li><a href='values/hitting_size_halfintervals.html'>Hitting Size of Half-intervals</a></li><li><a href='values/membership_query_complexity_halfintervals.html'>Membership Query Complexity of Half-intervals</a></li><li><a href='values/distinguishing_range_halfintervals.html'>Distinguishing Range of Half-intervals</a></li><li><a href='values/interpolation_degree_halfintervals.html'>Interpolation Degree of Half-intervals</a></li><li><a href='values/minimum_largest_order_shattered_set_halfintervals.html'>Minimum Largest Order Shattered Set of Half-intervals</a></li><li><a href='values/effective_vc_radius_halfintervals.ht led Sample Compression of Half-intervals</a></li><li><a href='values/proper_unlabeled_sample_compression_halfintervals.html'>Proper Unlabeled Sample Compression of Half-intervals</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/teaching_dimension_recursive_teaching_dimension.html'>Teaching Dimension / Recursive Teaching Dimension</a></li><li><a href='relationships/threshold_dimension_vc_dimension.html'>Threshold Dimension / VC Dimension</a></li><li><a href='relationships/log_shattering_effective_range.html'>Log Shattering / Effective Range</a></li><li><a href='relationships/vc_dimension_log_shattering.html'>VC Dimension / Log Shattering</a></li><li><a href='relationships/maximum_degree_degeneracy.html'>Maximum Degree / Degeneracy</a></li><li><a href='relationships/maximum_degree_maximum_positive_degree.html'>Maximum Degree / Maximum Positive Degree</a></li><li><a href='relationships/log_size_size.html'>Log Size / Size</a></li><li><a href='relationships/littlestone_dimension_vc_dimension.html'>Littlestone Dimension / VC Dimension</a></li><li><a href='relationships/size_proper_equivalence_queries_complexity.html'>Size / Proper Equivalence Queries Complexity</a></li><li><a href='relationships/threshold_dimension_littlestone_dimension.html'>Threshold Dimension / Littlestone Dimension</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__178": "\n    <div class=\"table-card\" id=\"math-97\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/path_dimension_threshold_dimension.html\" class=\"table-title-link\">Path Dimension / Threshold Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Path Dimension / Threshold Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/path_dimension.html\">Path Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/threshold_dimension.html\">Threshold Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> Relative</p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes, path dimension dominates threshold dimension.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/warmuth_c5.html\">Warmuth's $C_5$ class</a></p>\n<p><strong>Status:</strong> Established</p>\n\n<strong>Full Proof:</strong><div class=\"text-field\"><p>Full proof in the LaTeX survey: Lemma <code>lem:elementary-parameter-hierarchy</code>.</p></div>\n\n\n\n        </div>\n    </div>\n    ", "__label__178": "\n    <div class=\"table-card\" id=\"math-10\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/warmuth_c5.html\" class=\"table-title-link\">Warmuth's $C_5$ class</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Warmuth's $C_5$ class</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"C_5\">\n            \\[C_5\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Let the domain be the cyclic group $\\mathbb{Z}/5\\mathbb{Z}$.  A binary function belongs to $C_5$ precisely when, on some four consecutive cyclic positions, its values are $1,0,0,1$ in that order.  The value on the remaining position is unrestricted, so the class has ten functions.</p></div>\n<strong>Comments:</strong><div class=\"text-field\"><p>This is also called Warmuth's example.  It is a finite separation between unlabeled sample-compression size and VC dimension.</p></div>\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/vc_dimension_warmuth_c5.html'>VC Dimension of Warmuth's $C_5$ class</a></li><li><a href='values/unlabeled_sample_compression_warmuth_c5.html'>Unlabeled Sample Compression of Warmuth's $C_5$ class</a></li><li><a href='values/size_warmuth_c5.html'>Size of Warmuth's $C_5$ class</a></li><li><a href='values/effective_range_warmuth_c5.html'>Effective Range of Warmuth's $C_5$ class</a></li><li><a href='values/log_size_warmuth_c5.html'>Log Size of Warmuth's $C_5$ class</a></li><li><a href='values/largest_shattered_set_warmuth_c5.html'>Largest Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_largest_order_shattered_set_warmuth_c5.html'>Maximum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_vc_radius_warmuth_c5.html'>Projected VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_strongly_shattered_dimension_warmuth_c5.html'>Projected Strongly Shattered Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_degree_warmuth_c5.html'>Maximum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_degree_warmuth_c5.html'>Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/double_density_or_average_degree_warmuth_c5.html'>Double Density or Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/densest_subgraph_twice_warmuth_c5.html'>Densest Subgraph (twice) of Warmuth's $C_5$ Class</a></li><li><a href='values/hamming_radius_warmuth_c5.html'>Hamming Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/oriented_diameter_warmuth_c5.html'>Oriented Diameter of Warmuth's $C_5$ Class</a></li><li><a href='values/threshold_dimension_warmuth_c5.html'>Threshold Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/path_dimension_warmuth_c5.html'>Path Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/degeneracy_warmuth_c5.html'>Degeneracy of Warmuth's $C_5$ Class</a></li><li><a href='values/largest_strongly_shattered_set_warmuth_c5.html'>Largest Strongly Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_positive_degree_warmuth_c5.html'>Maximum Positive Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_maxi     function normalizeLatex(latex) {
        // The catalogue has historically accepted both bare TeX and TeX
        // already wrapped in a math delimiter.  This renderer owns the
        // display delimiter, so remove exactly one outer pair first.
        latex = (latex || '').trim();
        const delimiters = [['$$', '$$'], ['\\[', '\\]'], ['\\(', '\\)'], ['$', '$']];
        for (const [opening, closing] of delimiters) {
            if (latex.startsWith(opening) && latex.endsWith(closing)
                && latex.length > opening.length + closing.length) {
                return latex.slice(opening.length, -closing.length).trim();
            }
        }
        return latex;
    }

        content.querySelectorAll('.latex-equation').forEach(function(equation) {

            if (latex) equation.textContent = '$$' + latex + '$$';

                    } else {
                        // Regular node
                        var modal = document.getElementById('node-modal');
                        var content = document.getElementById('node-modal-content');
                        content.innerHTML = nodeCards[node_id] || '<div class="table-card"><h3>' + node_id + '</h3></div>';
                        modal.style.display = 'block';
                        typesetModalContent(content);
                    }
                });
            });
        
        // Render legend table when legend button is clicked
        let legendRendered = false;
        document.getElementById('legend-button').addEventListener('click', function() {
            if (!legendRendered) {
                const legendTable = document.getElementById('legend-table');
                
                // Create table rows for each legend item
                legendItems.forEach(function(item, idx) {
                    const row = document.createElement('tr');
                    row.style.borderBottom = '1px solid #eee';
                    
                    // SVG cell
                    const svgCell = document.createElement('td');
                    svgCell.style.padding = '5px';
                    svgCell.style.width = '100px';
                    svgCell.style.verticalAlign = 'middle';
                    const svgDiv = document.createElement('div');
                    svgDiv.id = 'legend-item-' + idx;
                    svgDiv.style.width = '100%';
                    svgDiv.style.height = '40px';
                    svgCell.appendChild(svgDiv);
                    
                    // Text cell
                    const textCell = document.createElement('td');
                    textCell.style.padding = '5px';
                    textCell.style.verticalAlign = 'middle';
                    textCell.style.fontSize = '0.9em';
                    textCell.textContent = item.text;
                    
                    row.appendChild(svgCell);
                    row.appendChild(textCell);
                    legendTable.appendChild(row);
                    
                    // Render the individual graph for this item (without worker to avoid conflicts)
                    d3.select('#legend-item-' + idx)
                        .graphviz({useWorker: false})
                        .width(100)
                        .height(40)
                        .fit(true)
                        .renderDot(item.dot_src);
                });
                
                legendRendered = true;
            }
        });
        
        // Close modals when clicking outside
        document.addEventListener('mousedown', function(e) {
            var nodeModal = document.getElementById('node-modal');
            var legendModal = document.getElementById('legend-modal');
            
            if (nodeModal.style.display === 'block' && !nodeModal.contains(e.target)) {
                nodeModal.style.display = 'none';
            }
            
            if (legendModal.style.display === 'block' && !legendModal.contains(e.target)) {
                legendModal.style.display = 'none';
            }
        });
    });
    </script>
    
    </body>
    </html>
