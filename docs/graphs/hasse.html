    <script>
    const nodeCards = {"#parameters/1": "<div class=\"table-card\"><h3><a href=\"parameters/effective_range.html\" class=\"table-title-link\">Effective Range</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\mathrm{E}\">\n            \\[\\mathrm{E}\\]\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The <strong>effective range</strong> $E(\\mathcal{H})$ of a family $\\mathcal{H}$ is the number of elements that can be distinguished by members of $\\mathcal{H}$: $$ E(\\mathcal{H}):= |{x:x\\in\\mathcal{X|,\\, \\exists h_1,h_2\\in\\mathcal{H},\\, x\\in h_1 \\Delta h_2}} $$</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/effective_range_yang_dimension.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{Y}$</a></li><li><a href=\"relationships/log_shattering_effective_range.html\" class=\"relationship-statement\">$\\log \\mathrm{sh} \\ge c\\log \\mathrm{E}$</a></li><li><a href=\"relationships/effective_range_distinguishing_range.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{R}$</a></li><li><a href=\"relationships/effective_range_vc_dimension.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{VC}$</a></li><li><a href=\"relationships/effective_range_diameter.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{D}$</a></li><li><a href=\"relationships/effective_range_hamming_radius.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{B}$</a></li><li><a href=\"relationships/effective_range_log_shattering.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\log \\mathrm{sh}$</a></li><li><a href=\"relationships/effective_range_projected_membership_queries_complexity.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{Q}_{\\mathrm{m}}^p$</a></li><li><a href=\"relationships/effective_range_star_number.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{S}$</a></li><li><a href=\"relationships/effective_range_monotonic_yang_dimension.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{Y}^*$</a></li><li><a href=\"relationships/effective_range_covc_dimension.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{coVC}$</a></li><li><a href=\"relationships/effective_range_log_size_ratio.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\frac{\\log (\\mathrm{H}-1)}{\\log (n+1)}$</a></li><li><a href=\"relationships/effective_range_oriented_diameter.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{D}^+$</a></li><li><a href=\"relationships/effective_range_threshold_dimension.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{T}$</a></li><li><a href=\"relationships/effective_range_monotone_recursive_teaching_dimension.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{RTD}^p$</a></li><li><a href=\"relationships/effective_range_order_sample_compression.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{OSC}$</a></li><li><a href=\"relationships/effective_range_proper_stable_sample_compression.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{psUSC}$</a></li><li><a href=\"relationships/effective_range_proper_unlabeled_sample_compression.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{pUSC}$</a></li><li><a href=\"relationships/effective_range_proper_labeled_sample_compression.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{pLSC}$</a></li><li><a href=\"relationships/effective_range_proper_stable_labeled_sample_compression.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{psLSC}$</a></li><li><a href=\"relationships/effective_range_minimum_teaching_set_size.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{TS}_{\\min}$</a></li><li><a href=\"relationships/effective_range_maximum_positive_degree.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{d}^+_{\\max}$</a></li><li><a href=\"relationships/effective_range_positive_noclashing_teaching_dimension.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{NCTD}^+$</a></li><li><a href=\"relationships/effective_range_positive_recursive_teaching_dimension.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{RTD}^+$</a></li><li><a href=\"relationships/effective_range_proper_ordered_sample_compression.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{pOSC}$</a></li></ul></p></div></div>", "#parameters/2": "<div class=\"table-card\"><h3><a href=\"parameters/size.html\" class=\"table-title-link\">Size</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\mathrm{H}\">\n            \\[\\mathrm{H}\\]\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The <strong>size</strong> of a family $\\mathcal{H}$ is simply the  cardinality, $$  |\\mathcal{H|} $$</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/log_size_size.html\" class=\"relationship-statement\">$\\log \\mathrm{H} \\ge c\\log \\mathrm{H}$</a></li><li><a href=\"relationships/size_vc_dimension.html\" class=\"relationship-statement\">$\\mathrm{H} \\ge \\mathrm{VC}$</a></li><li><a href=\"relationships/size_path_dimension.html\" class=\"relationship-statement\">$\\mathrm{H} \\ge \\mathrm{P}$</a></li><li><a href=\"relationships/size_littlestone_dimension.html\" class=\"relationship-statement\">$\\mathrm{H} \\ge \\mathrm{L}$</a></li><li><a href=\"relationships/size_yang_dimension.html\" class=\"relationship-statement\">$\\mathrm{H} \\ge \\mathrm{Y}$</a></li><li><a href=\"relationships/size_proper_equivalence_queries_complexity.html\" class=\"relationship-statement\">$\\mathrm{H} \\ge \\mathrm{Q}_{\\mathrm{peq}}$</a></li><li><a href=\"relationships/size_projected_membership_queries_complexity.html\" class=\"relationship-statement\">$\\mathrm{H} \\ge \\mathrm{Q}_{\\mathrm{m}}^p$</a></li><li><a href=\"relationships/size_star_number.html\" class=\"relationship-statement\">$\\mathrm{H} \\ge \\mathrm{S}$</a></li><li><a href=\"relationships/size_monotonic_yang_dimension.html\" class=\"relationship-statement\">$\\mathrm{H} \\ge \\mathrm{Y}^*$</a></li><li><a href=\"relationships/size_hitting_size.html\" class=\"relationship-statement\">$\\mathrm{H} \\ge \\mathrm{HT}$</a></li><li><a href=\"relationships/size_information_complexity.html\" class=\"relationship-statement\">$\\mathrm{H} \\ge \\mathrm{IC}$</a></li><li><a href=\"relationships/size_sign_rank.html\" class=\"relationship-statement\">$\\mathrm{H} \\ge \\mathrm{SR}$</a></li><li><a href=\"relationships/size_dual_sign_rank.html\" class=\"relationship-statement\">$\\mathrm{H} \\ge \\mathrm{DSR}$</a></li></ul></p></div></div>", "#parameters/3": "<div class=\"table-card\"><h3><a href=\"parameters/oriented_diameter.html\" class=\"table-title-link\">Oriented Diameter</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\mathrm{D}^+\">\n            \\[\\mathrm{D}^+\\]\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The <strong>oriented diameter</strong> $\\mathrm{D}^+(\\mathcal{H})$ of a family $\\mathcal{H}$ is defined as $$ \\mathrm{D}^+(\\mathcal{H}):= \\max{|S|: {\\emptyset, S}\\subset \\mathcal{H}_{|S}} $$</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/oriented_diameter_threshold_dimension.html\" class=\"relationship-statement\">$\\mathrm{D}^+ \\ge \\mathrm{T}$</a></li><li><a href=\"relationships/diameter_oriented_diameter.html\" class=\"relationship-statement\">$\\mathrm{D} \\ge \\mathrm{D}^+$ <span class=\"relationship-variant\">(relative)</span></a></li><li><a href=\"relationships/oriented_diameter_diameter.html\" class=\"relationship-statement\">$\\mathrm{D}^+ \\ge c\\mathrm{D}$</a></li><li><a href=\"relationships/hamming_radius_oriented_diameter.html\" class=\"relationship-statement\">$\\mathrm{B} \\ge c\\mathrm{D}^+$</a></li><li><a href=\"relationships/oriented_diameter_hamming_radius.html\" class=\"relationship-statement\">$\\mathrm{D}^+ \\ge c\\mathrm{B}$</a></li><li><a href=\"relationships/effective_range_oriented_diameter.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{D}^+$</a></li></ul></p></div></div>", "#parameters/4": "<div class=\"table-card\"><h3><a href=\"parameters/diameter.html\" class=\"table-title-link\">Diameter</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\mathrm{D}\">\n            \\[\\mathrm{D}\\]\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The <strong>diameter</strong> $D(\\mathcal{H})$ of a family $\\mathcal{H}$ is the largest distance between two elements of the family, i.e. $$ D(\\mathcal{H}):= \\max_{h_1,h_2\\in\\mathcal{H}} |h_1\\Delta h_2| $$</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/diameter_path_dimension.html\" class=\"relationship-statement\">$\\mathrm{D} \\ge \\mathrm{P}$</a></li><li><a href=\"relationships/effective_range_diameter.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{D}$</a></li><li><a href=\"relationships/diameter_oriented_diameter.html\" class=\"relationship-statement\">$\\mathrm{D} \\ge \\mathrm{D}^+$ <span class=\"relationship-variant\">(relative)</span></a></li><li><a href=\"relationships/oriented_diameter_diameter.html\" class=\"relationship-statement\">$\\mathrm{D}^+ \\ge c\\mathrm{D}$</a></li><li><a href=\"relationships/hamming_radius_diameter.html\" class=\"relationship-statement\">$\\mathrm{B} \\ge c\\mathrm{D}$</a></li><li><a href=\"relationships/diameter_hamming_radius.html\" class=\"relationship-statement\">$\\mathrm{D} \\ge \\mathrm{B}$</a></li><li><a href=\"relationships/diameter_littlestone_dimension.html\" class=\"relationship-statement\">$\\mathrm{D} \\ge \\mathrm{L}$</a></li></ul></p></div></div>", "#parameters/5": "<div class=\"table-card\"><h3><a href=\"parameters/hamming_radius.html\" class=\"table-title-link\">Hamming Radius</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\mathrm{B}\">\n            \\[\\mathrm{B}\\]\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The <strong>Hamming Radius</strong> $B(\\mathcal{H})$ of a family $\\mathcal{H}$ is the smallest radius of an enclosing Hamming ball, defined as $$ B(\\mathcal{H}):= \\min{d: \\exists T\\subset \\mathcal{X},\\, \\forall h\\in \\mathcal{H},\\, |h\\Delta T|\\le d} $$</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/effective_range_hamming_radius.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{B}$</a></li><li><a href=\"relationships/hamming_radius_oriented_diameter.html\" class=\"relationship-statement\">$\\mathrm{B} \\ge c\\mathrm{D}^+$</a></li><li><a href=\"relationships/hamming_radius_diameter.html\" class=\"relationship-statement\">$\\mathrm{B} \\ge c\\mathrm{D}$</a></li><li><a href=\"relationships/diameter_hamming_radius.html\" class=\"relationship-statement\">$\\mathrm{D} \\ge \\mathrm{B}$</a></li><li><a href=\"relationships/oriented_diameter_hamming_radius.html\" class=\"relationship-statement\">$\\mathrm{D}^+ \\ge c\\mathrm{B}$</a></li><li><a href=\"relationships/hamming_radius_littlestone_dimension.html\" class=\"relationship-statement\">$\\mathrm{B} \\ge \\mathrm{L}$</a></li><li><a href=\"relationships/hamming_radius_log_size.html\" class=\"relationship-statement\">$\\mathrm{B} \\ge \\frac{c\\log \\mathrm{H}}{\\log n}$</a></li></ul></p></div></div>", "#parameters/6": "<div class=\"table-card\"><h3><a href=\"parameters/threshold_dimension.html\" class=\"table-title-link\">Threshold Dimension</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\mathrm{T}\">\n            \\[\\mathrm{T}\\]\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The <strong>Threshold dimension</strong> of a family $\\mathcal{H}$, denoted by $T(\\mathcal{H})$, is the largest integer $d$ such that there exists a set $S\\subset \\mathcal{X}$, of size $d$ such that $\\mathcal{H}_{|S}$ contains thresholds, i.e. there is an ordering $x_1,\\ldots,x_d$ of the elements of $S$ such that $$ \\forall 0\\le k\\le d,\\, {x_1,\\ldots,x_k} \\in \\mathcal{H}_{|S}\\,. $$</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/threshold_dimension_vc_dimension.html\" class=\"relationship-statement\">$\\mathrm{T} \\ge \\mathrm{VC}$</a></li><li><a href=\"relationships/threshold_dimension_path_dimension.html\" class=\"relationship-statement\">$\\mathrm{T} \\ge c\\mathrm{P}$</a></li><li><a href=\"relationships/path_dimension_threshold_dimension.html\" class=\"relationship-statement\">$\\mathrm{P} \\ge \\mathrm{T}$ <span class=\"relationship-variant\">(relative)</span></a></li><li><a href=\"relationships/oriented_diameter_threshold_dimension.html\" class=\"relationship-statement\">$\\mathrm{D}^+ \\ge \\mathrm{T}$</a></li><li><a href=\"relationships/threshold_dimension_littlestone_dimension.html\" class=\"relationship-statement\">$\\mathrm{T} \\ge c\\log \\mathrm{L}$</a></li><li><a href=\"relationships/effective_range_threshold_dimension.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{T}$</a></li></ul></p></div></div>", "#parameters/7": "<div class=\"table-card\"><h3><a href=\"parameters/path_dimension.html\" class=\"table-title-link\">Path Dimension</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\mathrm{P}\">\n            \\[\\mathrm{P}\\]\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The <strong>Path dimension</strong> of a family $\\mathcal{H}$, denoted by $P(\\mathcal{H})$, is the largest integer $d$ such that there exists a set $S\\subset \\mathcal{X}$, of size $d$ such that $\\mathcal{H}_{|S}$ contains a full path, i.e. there is an ordering $x_1,\\ldots,x_d$ of the elements of $S$ and a subset $T\\subset S$ such that $$ \\forall 0\\le k\\le d,\\, T\\Delta {x_1,\\ldots,x_k} \\in \\mathcal{H}_{|S}\\,. $$</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/size_path_dimension.html\" class=\"relationship-statement\">$\\mathrm{H} \\ge \\mathrm{P}$</a></li><li><a href=\"relationships/threshold_dimension_path_dimension.html\" class=\"relationship-statement\">$\\mathrm{T} \\ge c\\mathrm{P}$</a></li><li><a href=\"relationships/path_dimension_threshold_dimension.html\" class=\"relationship-statement\">$\\mathrm{P} \\ge \\mathrm{T}$ <span class=\"relationship-variant\">(relative)</span></a></li><li><a href=\"relationships/diameter_path_dimension.html\" class=\"relationship-statement\">$\\mathrm{D} \\ge \\mathrm{P}$</a></li></ul></p></div></div>", "#parameters/8": "<div class=\"table-card\"><h3><a href=\"parameters/densest_subgraph_twice.html\" class=\"table-title-link\">Densest Subgraph (twice)</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\mathrm{dens}^*\">\n            \\[\\mathrm{dens}^*\\]\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The <strong>densest subgraph dimension</strong> of a concept class is equal to twice the density of the densest subgraph (a.k.a. <strong>subgraph density</strong>) of its $1$-inclusion graph.</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/densest_subgraph_twice_degeneracy.html\" class=\"relationship-statement\">$\\mathrm{dens}^* \\ge \\mathrm{d}^*_{\\min}$</a></li><li><a href=\"relationships/maximum_degree_densest_subgraph_twice.html\" class=\"relationship-statement\">$\\mathrm{d}_{\\max} \\ge \\mathrm{dens}^*$</a></li><li><a href=\"relationships/noclashing_teaching_dimension_densest_subgraph_twice.html\" class=\"relationship-statement\">$\\mathrm{NCTD} \\ge \\mathrm{dens}^*$</a></li><li><a href=\"relationships/vc_dimension_densest_subgraph_twice.html\" class=\"relationship-statement\">$\\mathrm{VC} \\ge c\\mathrm{dens}^*$</a></li><li><a href=\"relationships/densest_subgraph_twice_double_density_or_average_degree.html\" class=\"relationship-statement\">$\\mathrm{dens}^* \\ge \\mathrm{dens}$ <span class=\"relationship-variant\">(monotonic)</span></a></li></ul></p></div></div>", "#parameters/9": "<div class=\"table-card\"><h3><a href=\"parameters/double_density_or_average_degree.html\" class=\"table-title-link\">Double Density or Average Degree</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\mathrm{dens}\">\n            \\[\\mathrm{dens}\\]\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The <strong>double-density</strong> of a concept class is defined as twice the density of its $1$-inclusion graph, i.e twice the ratio of edges to vertices, or equivalently the average degree.</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/maximum_degree_double_density_or_average_degree.html\" class=\"relationship-statement\">$\\mathrm{d}_{\\max} \\ge \\mathrm{dens}$</a></li><li><a href=\"relationships/projected_double_density_or_projected_average_degree_double_density_or_average_degree.html\" class=\"relationship-statement\">$\\mathrm{dens}^p \\ge \\mathrm{dens}$ <span class=\"relationship-variant\">(p_monotonic)</span></a></li><li><a href=\"relationships/noclashing_teaching_dimension_double_density_or_average_degree.html\" class=\"relationship-statement\">$\\mathrm{NCTD} \\ge c\\mathrm{dens}$</a></li><li><a href=\"relationships/densest_subgraph_twice_double_density_or_average_degree.html\" class=\"relationship-statement\">$\\mathrm{dens}^* \\ge \\mathrm{dens}$ <span class=\"relationship-variant\">(monotonic)</span></a></li><li><a href=\"relationships/double_density_or_average_degree_minimum_degree.html\" class=\"relationship-statement\">$\\mathrm{dens} \\ge \\mathrm{d}_{\\min}$</a></li></ul></p></div></div>", "#parameters/10": "<div class=\"table-card\"><h3><a href=\"parameters/minimum_degree.html\" class=\"table-title-link\">Minimum Degree</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\mathrm{d}_{\\min}\">\n            \\[\\mathrm{d}_{\\min}\\]\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The <strong>minimum degree</strong> of a concept class is defined as the minimum degree of its $1$-inclusion graph.</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/degeneracy_minimum_degree.html\" class=\"relationship-statement\">$\\mathrm{d}^*_{\\min} \\ge \\mathrm{d}_{\\min}$ <span class=\"relationship-variant\">(monotonic)</span></a></li><li><a href=\"relationships/maximum_degree_minimum_degree.html\" class=\"relationship-statement\">$\\mathrm{d}_{\\max} \\ge \\mathrm{d}_{\\min}$</a></li><li><a href=\"relationships/projected_minimum_degree_minimum_degree.html\" class=\"relationship-statement\">$\\mathrm{d}^p_{\\min} \\ge \\mathrm{d}_{\\min}$ <span class=\"relationship-variant\">(p_monotonic)</span></a></li><li><a href=\"relationships/double_density_or_average_degree_minimum_degree.html\" class=\"relationship-statement\">$\\mathrm{dens} \\ge \\mathrm{d}_{\\min}$</a></li><li><a href=\"relationships/minimum_teaching_set_size_minimum_degree.html\" class=\"relationship-statement\">$\\mathrm{TS}_{\\min} \\ge \\mathrm{d}_{\\min}$</a></li></ul></p></div></div>", "#parameters/11": "<div class=\"table-card\"><h3><a href=\"parameters/log_shattering.html\" class=\"table-title-link\">Log Shattering</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\log \\mathrm{sh}\">\n            \\[\\log \\mathrm{sh}\\]\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The <strong>Log Shattering</strong> of a family $\\mathcal{H}$ is the (binary) log of the number of its shattered sets, $$ \\log |sh{\\mathcal{H|}} $$</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/log_shattering_log_size.html\" class=\"relationship-statement\">$\\log \\mathrm{sh} \\ge \\log \\mathrm{H}$</a></li><li><a href=\"relationships/log_shattering_effective_range.html\" class=\"relationship-statement\">$\\log \\mathrm{sh} \\ge c\\log \\mathrm{E}$</a></li><li><a href=\"relationships/vc_dimension_log_shattering.html\" class=\"relationship-statement\">$\\mathrm{VC} \\ge \\frac{c\\log \\mathrm{sh}}{\\log n}$</a></li><li><a href=\"relationships/effective_range_log_shattering.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\log \\mathrm{sh}$</a></li><li><a href=\"relationships/log_shattering_majority_complexity.html\" class=\"relationship-statement\">$\\log \\mathrm{sh} \\ge \\mathrm{Maj}$</a></li></ul></p></div></div>", "#parameters/61": "<div class=\"table-card\"><h3><a href=\"parameters/largest_shattered_set.html\" class=\"table-title-link\">Largest Shattered Set</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\mathrm{SH}\">\n            \\[\\mathrm{SH}\\]\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The largest number of coordinates on which every labeling is realized.</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/largest_shattered_set_minimum_largest_order_shattered_set.html\" class=\"relationship-statement\">$\\mathrm{SH} \\ge \\mathrm{OSH}_{\\min}$</a></li><li><a href=\"relationships/largest_shattered_set_vc_dimension.html\" class=\"relationship-statement\">$\\mathrm{SH} = \\mathrm{VC}$</a></li></ul></p></div></div>", "#parameters/13": "<div class=\"table-card\"><h3><a href=\"parameters/effective_vc_radius.html\" class=\"table-title-link\">Effective VC Radius</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\mathrm{VCR}\">\n            \\[\\mathrm{VCR}\\]\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>For a family $\\mathcal{H}\\subset 2^\\mathcal{X}$, we define the <strong>effective VC radius</strong> as the largest integer $k$ such that all subsets of size $k$ of the effective range of $\\mathcal{H}$, i.e. $\\bigcup {h\\Delta h': h,h'\\in \\mathcal{H}}$ are shattered by $\\mathcal{H}$.</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/vc_dimension_effective_vc_radius.html\" class=\"relationship-statement\">$\\mathrm{VC} \\ge \\mathrm{VCR}$ <span class=\"relationship-variant\">(p_monotonic)</span></a></li><li><a href=\"relationships/minimum_largest_order_shattered_set_effective_vc_radius.html\" class=\"relationship-statement\">$\\mathrm{OSH}_{\\min} \\ge \\mathrm{VCR}$</a></li><li><a href=\"relationships/minimum_teaching_set_size_effective_vc_radius.html\" class=\"relationship-statement\">$\\mathrm{TS}_{\\min} \\ge \\mathrm{VCR}$</a></li><li><a href=\"relationships/projected_vc_radius_effective_vc_radius.html\" class=\"relationship-statement\">$\\mathrm{VCR}^p \\ge \\mathrm{VCR}$ <span class=\"relationship-variant\">(p_monotonic)</span></a></li><li><a href=\"relationships/covc_dimension_effective_vc_radius.html\" class=\"relationship-statement\">$\\mathrm{coVC} \\ge \\mathrm{VCR}$</a></li><li><a href=\"relationships/recursive_teaching_dimension_effective_vc_radius.html\" class=\"relationship-statement\">$\\mathrm{RTD} \\ge \\mathrm{VCR}$</a></li></ul></p></div></div>", "#parameters/14": "<div class=\"table-card\"><h3><a href=\"parameters/yang_dimension.html\" class=\"table-title-link\">Yang dimension</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\mathrm{Y}\">\n            \\[\\mathrm{Y}\\]\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>Projective dimension, equivalently minimal-resolution length, of the class's associated ideal.</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/effective_range_yang_dimension.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{Y}$</a></li><li><a href=\"relationships/yang_dimension_vc_dimension.html\" class=\"relationship-statement\">$\\mathrm{Y} \\ge \\mathrm{VC}$</a></li><li><a href=\"relationships/yang_dimension_covc_dimension.html\" class=\"relationship-statement\">$\\mathrm{Y} \\ge \\mathrm{coVC}$</a></li><li><a href=\"relationships/size_yang_dimension.html\" class=\"relationship-statement\">$\\mathrm{H} \\ge \\mathrm{Y}$</a></li><li><a href=\"relationships/monotonic_yang_dimension_yang_dimension.html\" class=\"relationship-statement\">$\\mathrm{Y}^* \\ge \\mathrm{Y}$ <span class=\"relationship-variant\">(monotonic)</span></a></li></ul></p></div></div>", "#parameters/15": "<div class=\"table-card\"><h3><a href=\"parameters/interpolation_degree.html\" class=\"table-title-link\">Interpolation degree</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\mathrm{intdeg}\">\n            \\[\\mathrm{intdeg}\\]\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The least polynomial degree sufficient to interpolate arbitrary functions on the class.</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/interpolation_degree_largest_strongly_shattered_set.html\" class=\"relationship-statement\">$\\mathrm{intdeg} \\ge \\mathrm{ST}$</a></li><li><a href=\"relationships/minimum_largest_order_shattered_set_interpolation_degree.html\" class=\"relationship-statement\">$\\mathrm{OSH}_{\\min} \\ge \\mathrm{intdeg}$</a></li><li><a href=\"relationships/recursive_teaching_dimension_interpolation_degree.html\" class=\"relationship-statement\">$\\mathrm{RTD} \\ge \\mathrm{intdeg}$</a></li><li><a href=\"relationships/interpolation_degree_log_size_ratio.html\" class=\"relationship-statement\">$\\mathrm{intdeg} \\ge c\\frac{\\log (\\mathrm{H}-1)}{\\log (n+1)}$</a></li></ul></p></div></div>", "#parameters/16": "<div class=\"table-card\"><h3><a href=\"parameters/unlabeled_sample_compression.html\" class=\"table-title-link\">Unlabeled sample compression</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\mathrm{USC}\">\n            \\[\\mathrm{USC}\\]\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>Smallest number of unlabeled sample instances sufficient for consistent reconstruction.</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/stable_unlabeled_complexity_unlabeled_sample_compression.html\" class=\"relationship-statement\">$\\mathrm{sUSC} \\ge \\mathrm{USC}$</a></li><li><a href=\"relationships/unlabeled_sample_compression_labeled_sample_compression.html\" class=\"relationship-statement\">$\\mathrm{USC} \\ge \\mathrm{LSC}$</a></li><li><a href=\"relationships/proper_unlabeled_sample_compression_unlabeled_sample_compression.html\" class=\"relationship-statement\">$\\mathrm{pUSC} \\ge \\mathrm{USC}$</a></li><li><a href=\"relationships/occasional_onesided_getback_unlabeled_sample_compression.html\" class=\"relationship-statement\">$\\mathrm{M}_{\\mathrm{o1g}} \\ge \\mathrm{USC}$</a></li><li><a href=\"relationships/unlabeled_sample_compression_vc_dimension.html\" class=\"relationship-statement\">$\\mathrm{USC} \\ge \\mathrm{VC}$</a></li></ul></p></div></div>", "#parameters/17": "<div class=\"table-card\"><h3><a href=\"parameters/recursive_teaching_dimension.html\" class=\"table-title-link\">Recursive Teaching Dimension</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\mathrm{RTD}\">\n            \\[\\mathrm{RTD}\\]\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>Smallest worst-case teaching-set size in a recursive teaching sequence.</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/preferencebased_teaching_dimension_recursive_teaching_dimension.html\" class=\"relationship-statement\">$\\mathrm{PBTD} = \\mathrm{RTD}$</a></li><li><a href=\"relationships/monotone_recursive_teaching_dimension_recursive_teaching_dimension.html\" class=\"relationship-statement\">$\\mathrm{RTD}^p \\ge \\mathrm{RTD}$ <span class=\"relationship-variant\">(p_monotonic)</span></a></li><li><a href=\"relationships/teaching_dimension_recursive_teaching_dimension.html\" class=\"relationship-statement\">$\\mathrm{TD} \\ge \\mathrm{RTD}$</a></li><li><a href=\"relationships/positive_recursive_teaching_dimension_recursive_teaching_dimension.html\" class=\"relationship-statement\">$\\mathrm{RTD}^+ \\ge \\mathrm{RTD}$</a></li><li><a href=\"relationships/recursive_teaching_dimension_interpolation_degree.html\" class=\"relationship-statement\">$\\mathrm{RTD} \\ge \\mathrm{intdeg}$</a></li><li><a href=\"relationships/selfdirected_queries_complexity_recursive_teaching_dimension.html\" class=\"relationship-statement\">$\\mathrm{M}_{\\mathrm{sd}} \\ge \\mathrm{RTD}$</a></li><li><a href=\"relationships/recursive_teaching_dimension_effective_vc_radius.html\" class=\"relationship-statement\">$\\mathrm{RTD} \\ge \\mathrm{VCR}$</a></li><li><a href=\"relationships/recursive_teaching_dimension_monotonic_minimum_teaching_set_size.html\" class=\"relationship-statement\">$\\mathrm{RTD} = \\mathrm{TS}_{\\min}^*$</a></li></ul></p></div></div>", "#parameters/44": "<div class=\"table-card\"><h3><a href=\"parameters/equivalence_queries_complexity.html\" class=\"table-title-link\">Equivalence Queries Complexity</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\mathrm{Q}_{\\mathrm{eq}}\">\n            \\[\\mathrm{Q}_{\\mathrm{eq}}\\]\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>Minimum worst-case number of arbitrary equivalence queries needed to identify the target.</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/equivalence_queries_complexity_littlestone_dimension.html\" class=\"relationship-statement\">$\\mathrm{Q}_{\\mathrm{eq}} = \\mathrm{L}$</a></li><li><a href=\"relationships/proper_equivalence_queries_complexity_equivalence_queries_complexity.html\" class=\"relationship-statement\">$\\mathrm{Q}_{\\mathrm{peq}} \\ge \\mathrm{Q}_{\\mathrm{eq}}$</a></li></ul></p></div></div>", "#parameters/66": "<div class=\"table-card\"><h3><a href=\"parameters/projected_maximal_degree.html\" class=\"table-title-link\">Projected Maximal Degree</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\mathrm{d}^p_{\\max}\">\n            \\[\\mathrm{d}^p_{\\max}\\]\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>Largest maximum degree among coordinate projections; equal to the star number.</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/projected_maximal_degree_star_number.html\" class=\"relationship-statement\">$\\mathrm{d}^p_{\\max} = \\mathrm{S}$</a></li><li><a href=\"relationships/projected_maximal_degree_maximum_degree.html\" class=\"relationship-statement\">$\\mathrm{d}^p_{\\max} \\ge \\mathrm{d}_{\\max}$ <span class=\"relationship-variant\">(p_monotonic)</span></a></li><li><a href=\"relationships/projected_maximal_degree_projected_minimum_degree.html\" class=\"relationship-statement\">$\\mathrm{d}^p_{\\max} \\ge \\mathrm{d}^p_{\\min}$</a></li><li><a href=\"relationships/projected_maximal_degree_projected_double_density_or_projected_average_degree.html\" class=\"relationship-statement\">$\\mathrm{d}^p_{\\max} \\ge \\mathrm{dens}^p$</a></li></ul></p></div></div>", "#parameters/20": "<div class=\"table-card\"><h3><a href=\"parameters/monotone_recursive_teaching_dimension.html\" class=\"table-title-link\">Projected Recursive Teaching Dimension</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\mathrm{RTD}^p\">\n            \\[\\mathrm{RTD}^p\\]\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>Largest recursive teaching dimension among coordinate projections.</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/monotone_recursive_teaching_dimension_recursive_teaching_dimension.html\" class=\"relationship-statement\">$\\mathrm{RTD}^p \\ge \\mathrm{RTD}$ <span class=\"relationship-variant\">(p_monotonic)</span></a></li><li><a href=\"relationships/vc_dimension_monotone_recursive_teaching_dimension.html\" class=\"relationship-statement\">$\\mathrm{VC} \\ge c\\sqrt{\\mathrm{RTD}^p}$</a></li><li><a href=\"relationships/order_sample_compression_monotone_recursive_teaching_dimension.html\" class=\"relationship-statement\">$\\mathrm{OSC} \\ge \\mathrm{RTD}^p$</a></li><li><a href=\"relationships/monotone_recursive_teaching_dimension_vc_dimension.html\" class=\"relationship-statement\">$\\mathrm{RTD}^p \\ge \\mathrm{VC}$</a></li><li><a href=\"relationships/effective_range_monotone_recursive_teaching_dimension.html\" class=\"relationship-statement\">$\\mathrm{E} \\ge \\mathrm{RTD}^p$</a></li></ul></p></div></div>", "#parameters/21": "<div class=\"table-card\"><h3><a href=\"parameters/teaching_dimension.html\" class=\"table-title-link\">Teaching Dimension</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\mathrm{TD}\">\n            \\[\\mathrm{TD}\\]\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>Largest, over concepts, of the minimum number of labeled examples that uniquely identifies the concept.</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/teaching_dimension_recursive_teaching_dimension.html\" class=\"relationship-statement\">$\\mathrm{TD} \\ge \\mathrm{RTD}$</a></li><li><a href=\"relationships/teaching_dimension_maximum_teaching_set_size.html\" class=\"relationship-statement\">$\\mathrm{TD} = \\mathrm{TS}_{\\max}$</a></li><li><a href=\"relationships/positive_teaching_dimension_teaching_dimension.html\" class=\"relationship-statement\">$\\mathrm{TD}^+ \\ge \\mathrm{TD}$</a></li><li><a href=\"relationships/teaching_dimension_relative_hitting_size.html\" class=\"relationship-statement\">$\\mathrm{TD} = \\mathrm{RHT}$</a></li><li><a href=\"relationships/extended_teaching_dimension_teaching_dimension.html\" class=\"relationship-statement\">$\\mathrm{XTD} \\ge \\mathrm{TD}$</a></li></ul></p></div></div>", "#parameters/22": "<div class=\"table-card\"><h3><a href=\"parameters/hitting_size.html\" class=\"table-title-link\">Hitting Size</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\mathrm{HT}\">\n            \\[\\mathrm{HT}\\]\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>The smallest set of coordinates meeting every nonempty concept.</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/relative_hitting_size_hitting_size.html\" class=\"relationship-statement\">$\\mathrm{RHT} \\ge \\mathrm{HT}$ <span class=\"relationship-variant\">(relative)</span></a></li><li><a href=\"relationships/size_hitting_size.html\" class=\"relationship-statement\">$\\mathrm{H} \\ge \\mathrm{HT}$</a></li></ul></p></div></div>", "#parameters/24": "<div class=\"table-card\"><h3><a href=\"parameters/membership_query_complexity.html\" class=\"table-title-link\">Membership Query Complexity</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\mathrm{Q}_m\">\n            \\[\\mathrm{Q}_m\\]\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>Minimum worst-case number of membership queries needed to identify the target.</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/distinguishing_range_membership_query_complexity.html\" class=\"relationship-statement\">$\\mathrm{R} \\ge \\mathrm{Q}_m$</a></li><li><a href=\"relationships/projected_membership_queries_complexity_membership_query_complexity.html\" class=\"relationship-statement\">$\\mathrm{Q}_{\\mathrm{m}}^p \\ge \\mathrm{Q}_m$ <span class=\"relationship-variant\">(p_monotonic)</span></a></li><li><a href=\"relationships/membership_query_complexity_relative_hitting_size.html\" class=\"relationship-statement\">$\\mathrm{Q}_m \\ge \\mathrm{RHT}$</a></li><li><a href=\"relationships/membership_query_complexity_log_size.html\" class=\"relationship-statement\">$\\mathrm{Q}_m \\ge \\log \\mathrm{H}$</a></li><li><a href=\"relationships/membership_query_complexity_membership_and_proper_equivalence_queries_complexity.html\" class=\"relationship-statement\">$\\mathrm{Q}_m \\ge \\mathrm{Q}_{\\mathrm{mpeq}}$</a></li><li><a href=\"relationships/membership_query_complexity_extended_teaching_dimension.html\" class=\"relationship-statement\">$\\mathrm{Q}_m \\ge \\mathrm{XTD}$</a></li></ul></p></div></div>", "#parameters/25": "<div class=\"table-card\"><h3><a href=\"parameters/proper_equivalence_queries_complexity.html\" class=\"table-title-link\">Proper Equivalence Queries Complexity</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\mathrm{Q}_{\\mathrm{peq}}\">\n            \\[\\mathrm{Q}_{\\mathrm{peq}}\\]\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>Minimum worst-case number of equivalence queries when every proposed hypothesis is in the class.</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/size_proper_equivalence_queries_complexity.html\" class=\"relationship-statement\">$\\mathrm{H} \\ge \\mathrm{Q}_{\\mathrm{peq}}$</a></li><li><a href=\"relationships/proper_equivalence_queries_complexity_random_proper_equivalence_queries_complexity.html\" class=\"relationship-statement\">$\\mathrm{Q}_{\\mathrm{peq}} \\ge \\mathrm{Q}_{\\mathrm{rpeq}}$</a></li><li><a href=\"relationships/proper_equivalence_queries_complexity_membership_and_proper_equivalence_queries_complexity.html\" class=\"relationship-statement\">$\\mathrm{Q}_{\\mathrm{peq}} \\ge \\mathrm{Q}_{ } \\ge \\mathrm{DSR}$</a></li><li><a href=\"relationships/size_dual_sign_rank.html\" class=\"relationship-statement\">$\\mathrm{H} \\ge \\mathrm{DSR}$</a></li></ul></p></div></div>", "#parameters/72": "<div class=\"table-card\"><h3><a href=\"parameters/projected_vc_radius.html\" class=\"table-title-link\">Projected VC Radius</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\mathrm{VCR}^p\">\n            \\[\\mathrm{VCR}^p\\]\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>Largest effective VC radius among coordinate projections; equal to VC dimension.</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/projected_vc_radius_vc_dimension.html\" class=\"relationship-statement\">$\\mathrm{VCR}^p = \\mathrm{VC}$</a></li><li><a href=\"relationships/projected_vc_radius_effective_vc_radius.html\" class=\"relationship-statement\">$\\mathrm{VCR}^p \\ge \\mathrm{VCR}$ <span class=\"relationship-variant\">(p_monotonic)</span></a></li></ul></p></div></div>", "#parameters/73": "<div class=\"table-card\"><h3><a href=\"parameters/projected_strongly_shattered_dimension.html\" class=\"table-title-link\">Projected Strongly Shattered Dimension</a></h3><strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\mathrm{ST}^p\">\n            \\[\\mathrm{ST}^p\\]\n        </div>\n    </div>\n    <strong>Summary:</strong><div class=\"text-field\"><p>Largest strongly-shattered-set size among coordinate projections; equal to VC dimension.</p></div><div class=\"reference-field\"><p><strong>Relationships:</strong><ul class=\"fields-list\"><li><a href=\"relationships/projected_strongly_shattered_dimension_vc_dimension.html\" class=\"relationship-statement\">$\\mathrm{ST}^p = \\mathrm{VC}$</a></li><li><a href=\"relationships/projected_strongly_shattered_dimensi     const edgeCards = {"__edge__0": "\n    <div class=\"table-card\" id=\"math-1\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/vc_dimension_effective_vc_radius.html\" class=\"table-title-link\">VC Dimension / Effective VC Radius</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>VC Dimension / Effective VC Radius</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/vc_dimension.html\">VC Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/effective_vc_radius.html\">Effective VC Radius</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> P-Monotonic</p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes; this is immediate from the definition of effective VC radius.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/addressing.html\">Addressing</a></p>\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>If the effective VC radius is $k$, then every $k$-subset of the effective range is shattered.  In particular one such subset is shattered, so the VC dimension is at least $k$.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#vapnik1971uniform\">[vapnik1971uniform]</a></p></div>\n\n        </div>\n    </div>\n    ", "__label__0": "\n    <div class=\"table-card\" id=\"math-8\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/addressing.html\" class=\"table-title-link\">Addressing</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Addressing</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\text{Add}\">\n            \\[\\text{Add}\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>(see <a href=\"bibliography.html#maass1992lower\">[maass1992lower]</a>): define the addressing function $f(S)$ that maps the characteristic vector of the set $S$ to its value as a binary number, then the Addressing family is defined as $$\\mathcal{H}:= { {f(S)+1\\}\\cup S : S \\subset {n+1,\\ldots,n+\\lfloor \\log n \\rfloor}}$$\n        In other words, we have singletons on $[n]$ followed by the index of the singleton encoded in binary. So this class has VC $\\lfloor\\log n\\rfloor$. Any parameter that is $p$-monotonic will be larger than its value for singletons on $[n]$ and than a full cube on $[\\log n]$. This class also has $coVC=\\Omega(n)$</p></div>\n\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/recursive_teaching_dimension_addressing.html'>Recursive Teaching Dimension of Addressing</a></li><li><a href='values/star_number_addressing.html'>Star number of Addressing</a></li><li><a href='values/covc_dimension_addressing.html'>co-VC dimension of Addressing</a></li><li><a href='values/largest_strongly_shattered_set_addressing.html'>Largest Strongly Shattered Set of Addressing</a></li><li><a href='values/maximum_degree_addressing.html'>Maximum Degree of Addressing</a></li><li><a href='values/size_addressing.html'>Size of Addressing</a></li><li><a href='values/effective_range_addressing.html'>Effective Range of Addressing</a></li><li><a href='values/vc_dimension_addressing.html'>VC Dimension of Addressing</a></li><li><a href='values/littlestone_dimension_addressing.html'>Littlestone Dimension of Addressing</a></li><li><a href='values/proper_equivalence_queries_complexity_addressing.html'>Proper Equivalence Queries Complexity of Addressing</a></li><li><a href='values/log_size_addressing.html'>Log Size of Addressing</a></li><li><a href='values/threshold_dimension_addressing.html'>Threshold Dimension of Addressing</a></li><li><a href='values/projected_maximal_degree_addressing.html'>Projected Maximal Degree of Addressing</a></li><li><a href='values/log_size_ratio_addressing.html'>Log Size Ratio of Addressing</a></li><li><a href='values/largest_shattered_set_addressing.html'>Largest Shattered Set of Addressing</a></li><li><a href='values/maximum_largest_order_shattered_set_addressing.html'>Maximum Largest Order Shattered Set of Addressing</a></li><li><a href='values/projected_vc_radius_addressing.html'>Projected VC Radius of Addressing</a></li><li><a href='values/projected_strongly_shattered_dimension_addressing.html'>Projected Strongly Shattered Dimension of Addressing</a></li><li><a href='values/maximum_projected_teaching_set_size_addressing.html'>Maximum Projected Teaching-Set Size of Addressing</a></li><li><a href='values/monotonic_minimum_teaching_set_size_addressing.html'>Monotonic Minimum Teaching-Set Size of Addressing</a></li><li><a href='values/preferencebased_teaching_dimension_addressing.html'>Preference-Based Teaching Dimension of Addressing</a></li><li><a href='values/equivalence_queries_complexity_addressing.html'>Equivalence Queries Complexity of Addressing</a></li><li><a href='values/hitting_size_addressing.html'>Hitting Size of Addressing</a></li><li><a href='values/membership_query_complexity_addressing.html'>Membership Query Complexity of Addressing</a></li><li><a href='values/distinguishing_range_addressing.html'>Distinguishing Range of Addressing</a></li><li><a href='values/interpolation_degree_addressing.html'>Interpolation Degree of Addressing</a></li><li><a href='values/effective_vc_radius_addressing.html'>Effective VC Radius of Addressing</a></li><li><a href='values/minimum_teaching_set_size_addressing.html'>Minimum Teaching-Set Size of Addressing</a></li><li><a href='values/positive_teaching_dimension_addressing.html'>Positive Teaching Dimension of Addressing</a></li><li><a href='values/positive_recursive_teaching_dimension_addressing.html'>Positive Recursive Teaching Dimension of Addressing</a></li><li><a href='values/positive_noclashing_teaching_dimension_addressing.html'>Positive No-Clashing Teaching Dimension of Addressing</a></li><li><a href='values/noclashing_teaching_dimension_addressing.html'>No-Clashing Teaching Dimension of Addressing</a></li><li><a href='values/minimum_degree_addressing.html'>Minimum Degree of Addressing</a></li><li><a href='values/double_density_or_average_degree_addressing.html'>Double Density or Average Degree of Addressing</a></li><li><a href='values/densest_subgraph_twice_addressing.html'>Densest Subgraph (twice) of Addressing</a></li><li><a href='values/teaching_dimension_addressing.html'>Teaching Dimension of Addressing</a></li><li><a href='values/maximum_teaching_set_size_addressing.html'>Maximum Teaching-Set Size of Addressing</a></li><li><a href='values/relative_hitting_size_addressing.html'>Relative Hitting Size of Addressing</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/vc_dimension_effective_vc_radius.html'>VC Dimension / Effective VC Radius</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__1": "\n    <div class=\"table-card\" id=\"math-15\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/projected_maximal_degree_maximum_degree.html\" class=\"table-title-link\">Projected Maximal Degree / Maximum Degree</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Projected Maximal Degree / Maximum Degree</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/projected_maximal_degree.html\">Projected Maximal Degree</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/maximum_degree.html\">Maximum Degree</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> P-Monotonic</p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/singletons.html\">Singletons</a></p>\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>The projected maximal degree maximizes maximum degree over projections.  The full-domain projection is the original class, so it is one of the candidates.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__label__1": "\n    <div class=\"table-card\" id=\"math-2\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/singletons.html\" class=\"table-title-link\">Singletons</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Singletons</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\{\\{i\\}\\}_{1\\le i\\le n}\">\n            \\[\\{\\{i\\}\\}_{1\\le i\\le n}\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Singletons</p></div>\n\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/recursive_teaching_dimension_singletons.html'>Recursive Teaching Dimension of Singletons</a></li><li><a href='values/star_number_singletons.html'>Star number of Singletons</a></li><li><a href='values/covc_dimension_singletons.html'>co-VC dimension of Singletons</a></li><li><a href='values/oriented_diameter_singletons.html'>Oriented Diameter of Singletons</a></li><li><a href='values/maximum_degree_singletons.html'>Maximum Degree of Singletons</a></li><li><a href='values/log_shattering_singletons.html'>Log Shattering of Singletons</a></li><li><a href='values/order_sample_compression_singletons.html'>Order Sample Compression of Singletons</a></li><li><a href='values/proper_ordered_sample_compression_singletons.html'>Proper Ordered Sample Compression of Singletons</a></li><li><a href='values/effective_vc_radius_singletons.html'>Effective VC Radius of Singletons</a></li><li><a href='values/yang_dimension_singletons.html'>Yang dimension of Singletons</a></li><li><a href='values/partial_equivalenc tons.html'>Hamming Radius of Singletons</a></li><li><a href='values/path_dimension_singletons.html'>Path Dimension of Singletons</a></li><li><a href='values/extended_teaching_dimension_singletons.html'>Extended Teaching Dimension of Singletons</a></li><li><a href='values/maximum_teaching_set_size_singletons.html'>Maximum Teaching Set Size of Singletons</a></li><li><a href='values/noclashing_teaching_dimension_singletons.html'>No-Clashing Teaching Dimension of Singletons</a></li><li><a href='values/positive_noclashing_teaching_dimension_singletons.html'>Positive No-Clashing Teaching Dimension of Singletons</a></li><li><a href='values/minimum_degree_singletons.html'>Minimum Degree of Singletons</a></li><li><a href='values/degeneracy_singletons.html'>Degeneracy of Singletons</a></li><li><a href='values/densest_subgraph_twice_singletons.html'>Densest Subgraph (twice) of Singletons</a></li><li><a href='values/double_density_or_average_degree_singletons.html'>Double Density or Average Degree of Singletons</a></li><li><a href='values/maximum_positive_degree_singletons.html'>Maximum Positive Degree of Singletons</a></li><li><a href='values/projected_maximal_degree_singletons.html'>Projected Maximal Degree of Singletons</a></li><li><a href='values/projected_double_density_or_projected_average_degree_singletons.html'>Projected Double Density or Projected Average Degree of Singletons</a></li><li><a href='values/projected_minimum_degree_singletons.html'>Projected Minimum Degree of Singletons</a></li><li><a href='values/largest_shattered_set_singletons.html'>Largest Shattered Set of Singletons</a></li><li><a href='values/relative_hitting_size_singletons.html'>Relative Hitting Size of Singletons</a></li><li><a href='values/maximum_largest_order_shattered_set_singletons.html'>Maximum Largest Order Shattered Set of Singletons</a></li><li><a href='values/projected_vc_radius_singletons.html'>Projected VC Radius of Singletons</a></li><li><a href='values/projected_strongly_shattered_dimension_singletons.html'>Projected Strongly Shattered Dimension of Singletons</a></li><li><a href='values/maximum_projected_teaching_set_size_singletons.html'>Maximum Projected Teaching-Set Size of Singletons</a></li><li><a href='values/monotonic_minimum_teaching_set_size_singletons.html'>Monotonic Minimum Teaching-Set Size of Singletons</a></li><li><a href='values/preferencebased_teaching_dimension_singletons.html'>Preference-Based Teaching Dimension of Singletons</a></li><li><a href='values/minimum_projected_teaching_set_size_singletons.html'>Minimum Projected Teaching-Set Size of Singletons</a></li><li><a href='values/equivalence_queries_complexity_singletons.html'>Equivalence Queries Complexity of Singletons</a></li><li><a href='values/hitting_size_singletons.html'>Hitting Size of Singletons</a></li><li><a href='values/distinguishing_range_singletons.html'>Distinguishing Range of Singletons</a></li><li><a href='values/minimum_largest_order_shattered_set_singletons.html'>Minimum Largest Order Shattered Set of Singletons</a></li><li><a href='values/positive_teaching_dimension_singletons.html'>Positive Teaching Dimension of Singletons</a></li><li><a href='values/positive_recursive_teaching_dimension_singletons.html'>Positive Recursive Teaching Dimension of Singletons</a></li><li><a href='values/labeled_sample_compression_singletons.html'>Labeled Sample Compression of Singletons</a></li><li><a href='values/proper_labeled_sample_compression_singletons.html'>Proper Labeled Sample Compression of Singletons</a></li><li><a href='values/majority_complexity_singletons.html'>Majority Complexity of Singletons</a></li><li><a href='values/unlabeled_sample_compression_singletons.html'>Unlabeled Sample Compression of Singletons</a></li><li><a href='values/proper_unlabeled_sample_compression_singletons.html'>Proper Unlabeled Sample Compression of Singletons</a></li><li><a href='values/stable_unlabeled_complexity_singletons.html'>Stable Unlabeled Complexity of Singletons</a></li><li><a href='values/stable_labeled_sample_compression_singletons.html'>Stable Labeled Sample Compression of Singletons</a></li><li><a href='values/interpolation_degree_singletons.html'>Interpolation Degree of Singletons</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/projected_maximal_degree_maximum_degree.html'>Projected Maximal Degree / Maximum Degree</a></li><li><a href='relationships/yang_dimension_vc_dimension.html'>Yang dimension / VC Dimension</a></li><li><a href='relationships/proper_ordered_sample_compression_order_sample_compression.html'>Proper Ordered Sample Compression / Order Sample Compression</a></li><li><a href='relationships/projected_minimum_degree_minimum_degree.html'>Projected Minimum Degree / Minimum Degree</a></li><li><a href='relationships/projected_double_density_or_projected_average_degree_double_density_or_average_degree.html'>Projected Double Density or Projected Average Degree / Double Density or Average Degree</a></li><li><a href='relationships/yang_dimension_covc_dimension.html'>Yang dimension / co-VC dimension</a></li><li><a href='relationships/effective_range_vc_dimension.html'>Effective Range / VC Dimension</a></li><li><a href='relationships/effective_range_diameter.html'>Effective Range / Diameter</a></li><li><a href='relationships/effective_range_hamming_radius.html'>Effective Range / Hamming Radius</a></li><li><a href='relationships/size_littlestone_dimension.html'>Size / Littlestone Dimension</a></li><li><a href='relationships/size_yang_dimension.html'>Size / Yang dimension</a></li><li><a href='relationships/effective_range_log_shattering.html'>Effective Range / Log Shattering</a></li><li><a href='relationships/membership_query_complexity_log_size.html'>Membership Query Complexity / Log Size</a></li><li><a href='relationships/membership_and_proper_equivalence_queries_complexity_membership_and_equivalence_queries_complexity.html'>Membership and Proper Equivalence Queries Complexity / Membership and Equivalence Queries Complexity</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__2": "\n    <div class=\"table-card\" id=\"math-20\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/monotone_recursive_teaching_dimension_recursive_teaching_dimension.html\" class=\"table-title-link\">Projected Recursive Teaching Dimension / Recursive Teaching Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Projected Recursive Teaching Dimension / Recursive Teaching Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/monotone_recursive_teaching_dimension.html\">Projected Recursive Teaching Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/recursive_teaching_dimension.html\">Recursive Teaching Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> P-Monotonic</p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>The monotone/projection variant takes the maximum recursive teaching dimension over projections.  The full-domain projection is the original class, giving the inequality.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#doliwa2014recursive\">[doliwa2014recursive]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__3": "\n    <div class=\"table-card\" id=\"math-21\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/maximum_projected_teaching_set_size_maximum_teaching_set_size.html\" class=\"table-title-link\">Maximum Projected Teaching Set Size / Maximum Teaching Set Size</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Maximum Projected Teaching Set Size / Maximum Teaching Set Size</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/maximum_projected_teaching_set_size.html\">Maximum Projected Teaching Set Size</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/maximum_teaching_set_size.html\">Maximum Teaching Set Size</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> P-Monotonic</p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>The projected maximum teaching-set size maximizes over projections.  The full-domain projection is the original class, and hence supplies the ordinary maximum teaching-set size as a candidate.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__4": "\n    <div class=\"table-card\" id=\"math-42\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/projected_minimum_degree_minimum_degree.html\" class=\"table-title-link\">Projected Minimum Degree / Minimum Degree</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Projected Minimum Degree / Minimum Degree</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/projected_minimum_degree.html\">Projected Minimum Degree</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/minimum_degree.html\">Minimum Degree</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> P-Monotonic</p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/singletons.html\">Singletons</a></p>\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>The projected parameter maximizes the minimum degree over projections, and the full-domain projection recovers the original $1$-inclusion graph.<
