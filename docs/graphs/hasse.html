als</a></li><li><a href='values/stable_labeled_sample_compression_halfintervals.html'>Stable Labeled Sample Compression of Half-intervals</a></li><li><a href='values/proper_stable_labeled_sample_compression_halfintervals.html'>Proper Stable Labeled Sample Compression of Half-intervals</a></li><li><a href='values/monotone_recursive_teaching_dimension_halfintervals.html'>Projected Recursive Teaching Dimension of Half-intervals</a></li><li><a href='values/extended_teaching_dimension_halfintervals.html'>Extended Teaching Dimension of Half-intervals</a></li><li><a href='values/projected_minimum_degree_halfintervals.html'>Projected Minimum Degree of Half-intervals</a></li><li><a href='values/projected_double_density_or_projected_average_degree_halfintervals.html'>Projected Double Density or Projected Average Degree of Half-intervals</a></li><li><a href='values/order_sample_compression_halfintervals.html'>Order Sample Compression of Half-intervals</a></li><li><a href='values/proper_ordered_sample_compression_halfintervals.html'>Proper Ordered Sample Compression of Half-intervals</a></li><li><a href='values/unlabeled_sample_compression_halfintervals.html'>Unlabeled Sample Compression of Half-intervals</a></li><li><a href='values/proper_unlabeled_sample_compression_halfintervals.html'>Proper Unlabeled Sample Compression of Half-intervals</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/teaching_dimension_recursive_teaching_dimension.html'>Teaching Dimension / Recursive Teaching Dimension</a></li><li><a href='relationships/threshold_dimension_vc_dimension.html'>Threshold Dimension / VC Dimension</a></li><li><a href='relationships/log_shattering_effective_range.html'>Log Shattering / Effective Range</a></li><li><a href='relationships/vc_dimension_log_shattering.html'>VC Dimension / Log Shattering</a></li><li><a href='relationships/maximum_degree_degeneracy.html'>Maximum Degree / Degeneracy</a></li><li><a href='relationships/maximum_degree_maximum_positive_degree.html'>Maximum Degree / Maximum Positive Degree</a></li><li><a href='relationships/log_size_size.html'>Log Size / Size</a></li><li><a href='relationships/littlestone_dimension_vc_dimension.html'>Littlestone Dimension / VC Dimension</a></li><li><a href='relationships/size_proper_equivalence_queries_complexity.html'>Size / Proper Equivalence Queries Complexity</a></li><li><a href='relationships/threshold_dimension_littlestone_dimension.html'>Threshold Dimension / Littlestone Dimension</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__79": "\n    <div class=\"table-card\" id=\"math-116\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/labeled_sample_compression_vc_dimension.html\" class=\"table-title-link\">Labeled Sample Compression / VC Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Labeled Sample Compression / VC Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/labeled_sample_compression.html\">Labeled Sample Compression</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/vc_dimension.html\">VC Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge cP_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Floyd--Warmuth lower bound for general sample compression.</p></div>\n\n<p><strong>Status:</strong> </p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>A labeled compression scheme is a general sample compression scheme.  Floyd and Warmuth prove that every general compression scheme for a class of VC dimension $d$ has size at least $\\lceil d/5\\rceil$.  Hence $\\mathrm{LSC}(\\mathcal H)\\ge (1/5)\\mathrm{VC}(\\mathcal H)$.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#FW1995\">[FW1995]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__80": "\n    <div class=\"table-card\" id=\"math-117\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/order_sample_compression_monotone_recursive_teaching_dimension.html\" class=\"table-title-link\">Order Sample Compression / Projected Recursive Teaching Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Order Sample Compression / Projected Recursive Teaching Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/order_sample_compression.html\">Order Sample Compression</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/monotone_recursive_teaching_dimension.html\">Projected Recursive Teaching Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes; projected recursive teaching dimension is a lower bound for order compression.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#darnstadt2016order\">[darnstadt2016order]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__81": "\n    <div class=\"table-card\" id=\"math-118\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/monotone_recursive_teaching_dimension_vc_dimension.html\" class=\"table-title-link\">Projected Recursive Teaching Dimension / VC Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Projected Recursive Teaching Dimension / VC Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/monotone_recursive_teaching_dimension.html\">Projected Recursive Teaching Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/vc_dimension.html\">VC Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Projected recursive teaching dimension is the maximum recursive teaching dimension over coordinate projections.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/warmuth_c5.html\">Warmuth's $C_5$ class</a></p>\n<p><strong>Status:</strong> Established</p>\n\n<strong>Full Proof:</strong><div class=\"text-field\"><p>Full proof in the LaTeX survey: Lemma <code>lem:projected-rtd-vc</code>.</p></div>\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#doliwa2014recursive\">[doliwa2014recursive]</a></p></div>\n\n        </div>\n    </div>\n    ", "__label__81": "\n    <div class=\"table-card\" id=\"math-10\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/warmuth_c5.html\" class=\"table-title-link\">Warmuth's $C_5$ class</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Warmuth's $C_5$ class</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"C_5\">\n            \\[C_5\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Let the domain be the cyclic group $\\mathbb{Z}/5\\mathbb{Z}$.  A binary function belongs to $C_5$ precisely when, on some four consecutive cyclic positions, its values are $1,0,0,1$ in that order.  The value on the remaining position is unrestricted, so the class has ten functions.</p></div>\n<strong>Comments:</strong><div class=\"text-field\"><p>This is also called Warmuth's example.  It is a finite separation between unlabeled sample-compression size and VC dimension.</p></div>\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/vc_dimension_warmuth_c5.html'>VC Dimension of Warmuth's $C_5$ class</a></li><li><a href='values/unlabeled_sample_compression_warmuth_c5.html'>Unlabeled Sample Compression of Warmuth's $C_5$ class</a></li><li><a href='values/size_warmuth_c5.html'>Size of Warmuth's $C_5$ class</a></li><li><a href='values/effective_range_warmuth_c5.html'>Effective Range of Warmuth's $C_5$ class</a></li><li><a href='values/log_size_warmuth_c5.html'>Log Size of Warmuth's $C_5$ class</a></li><li><a href='values/largest_shattered_set_warmuth_c5.html'>Largest Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_largest_order_shattered_set_warmuth_c5.html'>Maximum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_vc_radius_warmuth_c5.html'>Projected VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_strongly_shattered_dimension_warmuth_c5.html'>Projected Strongly Shattered Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_degree_warmuth_c5.html'>Maximum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_degree_warmuth_c5.html'>Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/double_density_or_average_degree_warmuth_c5.html'>Double Density or Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/densest_subgraph_twice_warmuth_c5.html'>Densest Subgraph (twice) of Warmuth's $C_5$ Class</a></li><li><a href='values/hamming_radius_warmuth_c5.html'>Hamming Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/oriented_diameter_warmuth_c5.html'>Oriented Diameter of Warmuth's $C_5$ Class</a></li><li><a href='values/threshold_dimension_warmuth_c5.html'>Threshold Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/path_dimension_warmuth_c5.html'>Path Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/degeneracy_warmuth_c5.html'>Degeneracy of Warmuth's $C_5$ Class</a></li><li><a href='values/largest_strongly_shattered_set_warmuth_c5.html'>Largest Strongly Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_positive_degree_warmuth_c5.html'>Maximum Positive Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_maximal_degree_warmuth_c5.html'>Projected Maximal Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_minimum_degree_warmuth_c5.html'>Projected Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_double_density_or_projected_average_degree_warmuth_c5.html'>Projected Double Density or Projected Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/effective_vc_radius_warmuth_c5.html'>Effective VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_largest_order_shattered_set_warmuth_c5.html'>Minimum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_teaching_set_size_warmuth_c5.html'>Minimum Teaching Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_teaching_set_size_warmuth_c5.html'>Maximum Teaching Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/teaching_dimension_warmuth_c5.html'>Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/recursive_teaching_dimension_warmuth_c5.html'>Recursive Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/monotone_recursive_teaching_dimension_warmuth_c5.html'>Projected Recursive Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/monotonic_minimum_teaching_set_size_warmuth_c5.html'>Monotonic Minimum Teaching-Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/preferencebased_teaching_dimension_warmuth_c5.html'>Preference-Based Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/star_number_warmuth_c5.html'>Star Number of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_projected_teaching_set_size_warmuth_c5.html'>Maximum Projected Teaching-Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/log_shattering_warmuth_c5.html'>Log Shattering of Warmuth's $C_5$ Class</a></li><li><a href='values/log_size_ratio_warmuth_c5.html'>Log Size Ratio of Warmuth's $C_5$ Class</a></li><li><a href='values/membership_query_complexity_warmuth_c5.html'>Membership Query Complexity of Warmuth's $C_5$ Class</a></li><li><a href='values/littlestone_dimension_warmuth_c5.html'>Littlestone Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/equivalence_queries_complexity_warmuth_c5.html'>Equivalence Queries Complexity of Warmuth's $C_5$ Class</a></li><li><a href='values/interpolation_degree_warmuth_c5.html'>Interpolation Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/diameter_warmuth_c5.html'>Diameter of Warmuth's $C_5$ class</a></li><li><a href='values/relative_hitting_size_warmuth_c5.html'>Relative Hitting Size of Warmuth's $C_5$ class</a></li><li><a href='values/hitting_size_warmuth_c5.html'>Hitting Size of Warmuth's $C_5$ Class</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/minimum_largest_order_shattered_set_largest_strongly_shattered_set.html'>Minimum Largest Order Shattered Set / Largest Strongly Shattered Set</a></li><li><a href='relationships/minimum_teaching_set_size_effective_vc_radius.html'>Minimum Teaching Set Size / Effective VC Radius</a></li><li><a href='relationships/projected_maximal_degree_projected_minimum_degree.html'>Projected Maximal Degree / Projected Minimum Degree</a></li><li><a href='relationships/projected_strongly_shattered_dimension_largest_strongly_shattered_set.html'>Projected Strongly Shattered Dimension / Largest Strongly Shattered Set</a></li><li><a href='relationships/maximum_teaching_set_size_largest_strongly_shattered_set.html'>Maximum Teaching Set Size / Largest Strongly Shattered Set</a></li><li><a href='relationships/vc_dimension_densest_subgraph_twice.html'>VC Dimension / Densest Subgraph (twice)</a></li><li><a href='relationships/path_dimension_threshold_dimension.html'>Path Dimension / Threshold Dimension</a></li><li><a href='relationships/recursive_teaching_dimension_interpolation_degree.html'>Recursive Teaching Dimension / Interpolation degree</a></li><li><a href='relationships/diameter_oriented_diameter.html'>Diameter / Oriented Diameter</a></li><li><a href='relationships/recursive_teaching_dimension_effective_vc_radius.html'>Recursive Teaching Dimension / Effective VC Radius</a></li><li><a href='relationships/monotone_recursive_teaching_dimension_vc_dimension.html'>Projected Recursive Teaching Dimension / VC Dimension</a></li><li><a href='relationships/hamming_radius_oriented_diameter.html'>Hamming Radius / Oriented Diameter</a></li><li><a href='relationships/diameter_hamming_radius.html'>Diameter / Hamming Radius</a></li><li><a href='relationships/unlabeled_sample_compression_vc_dimension.html'>Unlabeled Sample Compression / VC Dimension</a></li><li><a href='relationships/diameter_littlestone_dimension.html'>Diameter / Littlestone Dimension</a></li><li><a href='relationships/maximum_teaching_set_size_maximum_degree.html'>Maximum Teaching-Set Size / Maximum Degree</a></li><li><a href='relationships/minimum_teaching_set_size_minimum_degree.html'>Minimum Teaching-Set Size / Minimum Degree</a></li><li><a href='relationships/star_number_vc_dimension.html'>Star Number / VC Dimension</a></li><li><a href='relationships/effective_range_star_number.html'>Effective Range / Star Number</a></li><li><a href='relationships/size_star_number.html'>Size / Star Number</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__82": "\n    <div class=\"table-card\" id=\"math-119\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/littlestone_dimension_worst_mistakes.html\" class=\"table-title-link\">Littlestone Dimension / Worst Mistakes</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Littlestone Dimension / Worst Mistakes</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/littlestone_dimension.html\">Littlestone Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/worst_mistakes.html\">Worst Mistakes</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite classes, the unrestricted tree rank defining Littlestone dimension dominates the regular-tree rank defining worst mistakes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#ben1997online\">[ben1997online]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__83": "\n    <div class=\"table-card\" id=\"math-120\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/worst_mistakes_best_mistakes.html\" class=\"table-title-link\">Worst Mistakes / Best Mistakes</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Worst Mistakes / Best Mistakes</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/worst_mistakes.html\">Worst Mistakes</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/best_mistakes.html\">Best Mistakes</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>An adversarial presentation is at least as hard as a presentation chosen favorably to the learner.</p></div>\n\n<p><strong>Status:</strong> </p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>The worst-mistakes game takes the maximum over all presentation sequences, whereas the best-mistakes game permits a favorable choice of sequence.  Taking a maximum over a superset of sequences cannot decrease the optimal worst-case mistake count, so $\\mathrm{M}<em _mathrm_best=\"\\mathrm{best\">{\\mathrm{worst}}(\\mathcal{H})\\ge\\mathrm{M}</em>)$.}}(\\mathcal{H</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#ben1997online\">[ben1997online]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__84": "\n    <div class=\"table-card\" id=\"math-122\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/log_size_majority_complexity.html\" class=\"table-title-link\">Log Size / Majority Complexity</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Log Size / Majority Complexity</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/log_size.html\">Log Size</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/majority_complexity.html\">Majority Complexity</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite nonempty concept classes, with logarithms base $2$.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>On an incorrect pointwise-majority equivalence query, at least the ceiling half of the current version space disagrees with the proposal and is eliminated, leaving at most its floor half. The halving algorithm therefore needs at most $\\lfloor\\log_2|\\mathcal H|\\rfloor$ informative queries.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#maass1992lower\">[maass1992lower]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__85": "\n    <div class=\"table-card\" id=\"math-123\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/hamming_radius_oriented_diameter.html\" class=\"table-title-link\">Hamming Radius / Oriented Diameter</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Hamming Radius / Oriented Diameter</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/hamming_radius.html\">Hamming Radius</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/oriented_diameter.html\">Oriented Diameter</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge cP_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite classes, this is the metric inequality $B(\\mathcal H)\\ge D^+(\\mathcal H)/2$.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/warmuth_c5.html\">Warmuth's $C_5$ class</a></p>\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>An oriented-diameter witness of size $d$ gives two concepts whose traces differ on all $d$ witness coordinates. For any Hamming-ball center, at least one of those concepts is at distance at least $d/2$ from it. Hence $B(\\mathcal H)\\ge \\tfrac12 D^+(\\mathcal H)$.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__label__85": "\n    <div class=\"table-card\" id=\"math-10\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/warmuth_c5.html\" class=\"table-title-link\">Warmuth's $C_5$ class</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Warmuth's $C_5$ class</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"C_5\">\n            \\[C_5\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Let the domain be the cyclic group $\\mathbb{Z}/5\\mathbb{Z}$.  A binary function belongs to $C_5$ precisely when, on some four consecutive cyclic positions, its values are $1,0,0,1$ in that order.  The value on the remaining position is unrestricted, so the class has ten functions.</p></div>\n<strong>Comments:</strong><div class=\"text-field\"><p>This is also called Warmuth's example.  It is a finite separation between unlabeled sample-compression size and VC dimension.</p></div>\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/vc_dimension_warmuth_c5.html'>VC Dimension of Warmuth's $C_5$ class</a></li><li><a href='values/unlabeled_sample_compression_warmuth_c5.html'>Unlabeled Sample Compression of Warmuth's $C_5$ class</a></li><li><a href='values/size_warmuth_c5.html'>Size of Warmuth's $C_5$ class</a></li><li><a href='values/effective_range_warmuth_c5.html'>Effective Range of Warmuth's $C_5$ class</a></li><li><a href='values/log_size_warmuth_c5.html'>Log Size of Warmuth's $C_5$ class</a></li><li><a href='values/largest_shattered_set_warmuth_c5.html'>Largest Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_largest_order_shattered_set_warmuth_c5.html'>Maximum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_vc_radius_warmuth_c5.html'>Projected VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_strongly_shattered_dimension_warmuth_c5.html'>Projected Strongly Shattered Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_degree_warmuth_c5.html'>Maximum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_degree_warmuth_c5.html'>Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/double_density_or_average_degree_warmuth_c5.html'>Double Density or Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/densest_subgraph_twice_warmuth_c5.html'>Densest Subgraph (twice) of Warmuth's $C_5$ Class</a></li><li><a href='values/hamming_radius_warmuth_c5.html'>Hamming Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/oriented_diameter_warmuth_c5.html'>Oriented Diameter of Warmuth's $C_5$ Class</a></li><li><a href='values/threshold_dimension_warmuth_c5.html'>Threshold Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/path_dimension_warmuth_c5.html'>Path Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/degeneracy_warmuth_c5.html'>Degeneracy of Warmuth's $C_5$ Class</a></li><li><a href='values/largest_strongly_shattered_set_warmuth_c5.html'>Largest Strongly Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_positive_degree_warmuth_c5.html'>Maximum Positive Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_maximal_degree_warmuth_c5.html'>Projected Maximal Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_minimum_degree_warmuth_c5.html'>Projected Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_double_density_or_projected_average_degree_warmuth_c5.html'>Projected Double Density or Projected Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/effective_vc_radius_warmuth_c5.html'>Effective VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_largest_order_shattered_set_warmuth_c5.html'>Minimum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_teaching_set_size_warmuth_c5.html'>Minimum Teaching Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_teaching_set_size_warmuth_c5.html'>Maximum Teaching Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/teaching_dimension_warmuth_c5.html'>Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/recursive_teaching_dimension_warmuth_c5.html'>Recursive Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/monotone_recursive_teaching_dimension_warmuth_c5.html'>Projected Recursive Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/monotonic_minimum_teaching_set_size_warmuth_c5.html'>Monotonic Minimum Teaching-Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/preferencebased_teaching_dimension_warmuth_c5.html'>Preference-Based Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/star_number_warmuth_c5.html'>Star Number of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_projected_teaching_set_size_warmuth_c5.html'>Maximum Projected Teaching-Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/log_shattering_warmuth_c5.html'>Log Shattering of Warmuth's $C_5$ Class</a></li><li><a href='values/log_size_ratio_warmuth_c5.html'>Log Size Ratio of Warmuth's $C_5$ Class</a></li><li><a href='values/membership_query_complexity_warmuth_c5.html'>Membership Query Complexity of Warmuth's $C_5$ Class</a></li><li><a href='values/littlestone_dimension_warmuth_c5.html'>Littlestone Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/equivalence_queries_complexity_warmuth_c5.html'>Equivalence Queries Complexity of Warmuth's $C_5$ Class</a></li><li><a href='values/interpolation_degree_warmuth_c5.html'>Interpolation Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/diameter_warmuth_c5.html'>Diameter of Warmuth's $C_5$ class</a></li><li><a href='values/relative_hitting_size_warmuth_c5.html'>Relative Hitting Size of Warmuth's $C_5$ class</a></li><li><a href='values/hitting_size_warmuth_c5.html'>Hitting Size of Warmuth's $C_5$ Class</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/minimum_largest_order_shattered_set_largest_strongly_shattered_set.html'>Minimum Largest Order Shattered Set / Largest Strongly Shattered Set</a></li><li><a href='relationships/minimum_teaching_set_size_effective_vc_radius.html'>Minimum Teaching Set Size / Effective VC Radius</a></li><li><a href='relationships/projected_maximal_degree_projected_minimum_degree.html'>Projected Maximal Degree / Projected Minimum Degree</a></li><li><a href='relationships/projected_strongly_shattered_dimension_largest_strongly_shattered_set.html'>Projected Strongly Shattered Dimension / Largest Strongly Shattered Set</a></li><li><a href='relationships/maximum_teaching_set_size_largest_strongly_shattered_set.html'>Maximum Teaching Set Size / Largest Strongly Shattered Set</a></li><li><a href='relationships/vc_dimension_densest_subgraph_twice.html'>VC Dimension / Densest Subgraph (twice)</a></li><li><a href='relationships/path_dimension_threshold_dimension.html'>Path Dimension / Threshold Dimension</a></li><li><a href='relationships/recursive_teaching_dimension_interpolation_degree.html'>Recursive Teaching Dimension / Interpolation degree</a></li><li><a href='relationships/diameter_oriented_diameter.html'>Diameter / Oriented Diameter</a></li><li><a href='relationships/recursive_teaching_dimension_effective_vc_radius.html'>Recursive Teaching Dimension / Effective VC Radius</a></li><li><a href='relationships/monotone_recursive_teaching_dimension_vc_dimension.html'>Projected Recursive Teaching Dimension / VC Dimension</a></li><li><a href='relationships/hamming_radius_oriented_diameter.html'>Hamming Radius / Oriented Diameter</a></li><li><a href='relationships/diameter_hamming_radius.html'>Diameter / Hamming Radius</a></li><li><a href='relationships/unlabeled_sample_compression_vc_dimension.html'>Unlabeled Sample Compression / VC Dimension</a></li><li><a href='relationships/diameter_littlestone_dimension.html'>Diameter / Littlestone Dimension</a></li><li><a href='relationships/maximum_teaching_set_size_maximum_degree.html'>Maximum Teaching-Set Size / Maximum Degree</a></li><li><a href='relationships/minimum_teaching_set_size_minimum_degree.html'>Minimum Teaching-Set Size / Minimum Degree</a></li><li><a href='relationships/star_number_vc_dimension.html'>Star Number / VC Dimension</a></li><li><a href='relationships/effective_range_star_number.html'>Effective Range / Star Number</a></li><li><a href='relationships/size_star_number.html'>Size / Star Number</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__86": "\n    <div class=\"table-card\" id=\"math-124\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/hamming_radius_diameter.html\" class=\"table-title-link\">Hamming Radius / Diameter</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Hamming Radius / Diameter</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/hamming_radius.html\">Hamming Radius</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/diameter.html\">Diameter</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge cP_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite classes, this is the metric inequality $B(\\mathcal H)\\ge D(\\mathcal H)/2$.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n\n<strong>Full Proof:</strong><div class=\"text-field\"><p>LaTeX survey, metric diameter/radius lemma (lem:metric-diameter-radius).</p></div>\n\n\n\n        </div>\n    </div>\n    ", "__edge__87": "\n    <div class=\"table-card\" id=\"math-128\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/interpolation_degree_log_size_ratio.html\" class=\"table-title-link\">Interpolation degree / Log Size Ratio</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Interpolation degree / Log Size Ratio</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/interpolation_degree.html\">Interpolation degree</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/log_size_ratio.html\">Log Size Ratio</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge cP_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Theorem</p></div>\n\n<p><strong>Status:</strong> </p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>If $d=\\mathrm{intdeg}(\\mathcal H)$, monomials supported on at most $d$ of the $n$ coordinates span every function on $\\mathcal H$.  Since the function space has dimension $|\\mathcal H|$, we have $|\\mathcal H|\\le\\sum_{i=0}^{d}\\binom ni\\le(n+1)^d$.  Hence $d\\ge\\log(|\\mathcal H|)/\\log(n+1)$, up to the Log Size Ratio normalization.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__88": "\n    <div class=\"table-card\" id=\"math-130\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/projected_membership_queries_complexity_star_number.html\" class=\"table-title-link\">Projected Membership Queries Complexity / Star number</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Projected Membership Queries Complexity / Star number</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/projected_membership_queries_complexity.html\">Projected Membership Queries Complexity</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/star_number.html\">Star number</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>A star witness forces one membership query per spoke.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>On a projected $d$-star with centre $h_0$ and leaves $h_i$ differing from $h_0$ only at $x_i$, an identification algorithm must query every $x_i$: if it omits $x_i$, the answers are identical for $h_0$ and $h_i$.  Hence the membership-query complexity of that projection is at least $d$.  Maximizing over projections gives $\\mathrm{Q}_m^p(\\mathcal H)\\ge\\mathrm{S}(\\mathcal H)$.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#hanneke2015minimax\">[hanneke2015minimax]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__89": "\n    <div class=\"table-card\" id=\"math-131\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/effective_range_projected_membership_queries_complexity.html\" class=\"table-title-link\">Effective Range / Projected Membership Queries Complexity</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Effective Range / Projected Membership Queries Complexity</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/effective_range.html\">Effective Range</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/projected_membership_queries_complexity.html\">Projected Membership Queries Complexity</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Each coordinate projection can be learned by querying only its effective coordinates.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/trivial_concepts.html\">Trivial concepts</a></p>\n<p><strong>Status:</strong> </p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>For every coordinate projection $\\mathcal{G}$ of $\\mathcal{H}$, querying all coordinates in the effective range of $\\mathcal{G}$ distinguishes every pair of its concepts.  Thus $\\mathrm{Q}_m(\\mathcal{G})\\le\\mathrm{E}(\\mathcal{G})\\le\\mathrm{E}(\\mathcal{H})$.  Maximizing over projections gives $\\mathrm{Q}_m^p(\\mathcal{H})\\le\\mathrm{E}(\\mathcal{H})$.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__label__89": "\n    <div class=\"table-card\" id=\"math-1\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/trivial_concepts.html\" class=\"table-title-link\">Trivial concepts</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Trivial concepts</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\{\\emptyset, [n]\\}\">\n            \\[\\{\\emptyset, [n]\\}\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Class containing the empty and the full concept.</p></div>\n\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/effective_range_trivial_concepts.html'>Effective Range of Trivial concepts</a></li><li><a href='values/log_shattering_trivial_concepts.html'>Log Shattering of Trivial concepts</a></li><li><a href='values/membership_and_proper_equivalence_queries_complexity_trivial_concepts.html'>Membership and Proper Equivalence Queries Complexity of Trivial concepts</a></li><li><a href='values/membership_query_complexity_trivial_concepts.html'>Membership Query Complexity of Trivial concepts</a></li><li><a href='values/projected_membership_queries_complexity_trivial_concepts.html'>Projected Membership Queries Complexity of Trivial concepts</a></li><li><a href='values/recursive_teaching_dimension_trivial_concepts.html'>Recursive Teaching Dimension of Trivial concepts</a></li><li><a href='values/teaching_dimension_trivial_concepts.html'>Teaching Dimension of Trivial concepts</a></li><li><a href='values/star_number_trivial_concepts.html'>Star number of Trivial concepts</a></li><li><a href='values/covc_dimension_trivial_concepts.html'>co-VC dimension of Trivial concepts</a></li><li><a href='values/monotone_recursive_teaching_dimension_trivial_concepts.html'>Projected Recursive Teaching Dimension of Trivial concepts</a></li><li><a href='values/minimum_teaching_set_size_trivial_concepts.html'>Minimum Teaching Set Size of Trivial concepts</a></li><li><a href='values/membership_and_equivalence_queries_complexity_trivial_concepts.html'>Membership and Equivalence Queries Complexity of Trivial concepts</a></li><li><a href='values/maximum_degree_trivial_concepts.html'>Maximum Degree of Trivial concepts</a></li><li><a href='values/order_sample_compression_trivial_concepts.html'>Order Sample Compression of Trivial concepts</a></li><li><a href='values/proper_ordered_sample_compression_trivial_concepts.html'>Proper Ordered Sample Compression of Trivial concepts</a></li><li><a href='values/projected_vc_radius_trivial_concepts.html'>Projected VC Radius of Trivial concepts</a></li><li><a href='values/effective_vc_radius_trivial_concepts.html'>Effective VC Radius of Trivial concepts</a></li><li><a href='values/yang_dimension_trivial_concepts.html'>Yang dimension of Trivial concepts</a></li><li><a href='values/partial_equivalence_queries_complexity_trivial_concepts.html'>Partial Equivalence Queries Complexity of Trivial concepts</a></li><li><a href='values/largest_strongly_shattered_set_trivial_concepts.html'>Largest Strongly Shattered Set of Trivial concepts</a></li><li><a href='values/path_dimension_trivial_concepts.html'>Path Dimension of Trivial concepts</a></li><li><a href='values/threshold_dimension_trivial_concepts.html'>Threshold Dimension of Trivial concepts</a></li><li><a href='values/hamming_radius_trivial_concepts.html'>Hamming Radius of Trivial concepts</a></li><li><a href='values/diameter_trivial_concepts.html'>Diameter of Trivial concepts</a></li><li><a href='values/oriented_diameter_trivial_concepts.html'>Oriented Diameter of Trivial concepts</a></li><li><a href='values/size_trivial_concepts.html'>Size of Trivial concepts</a></li><li><a href='values/vc_dimension_trivial_concepts.html'>VC Dimension of Trivial concepts</a></li><li><a href='values/littlestone_dimension_trivial_concepts.html'>Littlestone Dimension of Trivial concepts</a></li><li><a href='values/proper_equivalence_queries_complexity_trivial_concepts.html'>Proper Equivalence Queries Complexity of Trivial concepts</a></li><li><a href='values/log_size_ratio_trivial_concepts.html'>Log Size Ratio of Trivial concepts</a></li><li><a href='values/log_size_trivial_concepts.html'>Log Size of Trivial concepts</a></li><li><a href='values/extended_teaching_dimension_trivial_concepts.html'>Extended Teaching Dimension of Trivial concepts</a></li><li><a href='values/maximum_teaching_set_size_trivial_concepts.html'>Maximum Teaching Set Size of Trivial concepts</a></li><li><a href='values/noclashing_teaching_dimension_trivial_concepts.html'>No-Clashing Teaching Dimension of Trivial concepts</a></li><li><a href='values/positive_noclashing_teaching_dimension_trivial_concepts.html'>Positive No-Clashing Teaching Dimension of Trivial concepts</a></li><li><a href='values/minimum_degree_trivial_concepts.html'>Minimum Degree of Trivial concepts</a></li><li><a href='values/degeneracy_trivial_concepts.html'>Degeneracy of Trivial concepts</a></li><li><a href='values/densest_subgraph_twice_trivial_concepts.html'>Densest Subgraph (twice) of Trivial concepts</a></li><li><a href='values/double_density_or_average_degree_trivial_concepts.html'>Double Density or Average Degree of Trivial concepts</a></li><li><a href='values/maximum_positive_degree_trivial_concepts.html'>Maximum Positive Degree of Trivial concepts</a></li><li><a href='values/projected_maximal_degree_trivial_concepts.html'>Projected Maximal Degree of Trivial concepts</a></li><li><a href='values/projected_double_density_or_projected_average_degree_trivial_concepts.html'>Projected Double Density or Projected Average Degree of Trivial concepts</a></li><li><a href='values/projected_minimum_degree_trivial_concepts.html'>Projected Minimum Degree of Trivial concepts</a></li><li><a href='values/largest_shattered_set_trivial_concepts.html'>Largest Shattered Set of Trivial Concepts</a></li><li><a href='values/relative_hitting_size_trivial_concepts.html'>Relative Hitting Size of Trivial Concepts</a></li><li><a href='values/maximum_largest_order_shattered_set_trivial_concepts.html'>Maximum Largest Order Shattered Set of Trivial Concepts</a></li><li><a href='values/projected_strongly_shattered_dimension_trivial_concepts.html'>Projected Strongly Shattered Dimension of Trivial Concepts</a></li><li><a href='values/minimum_largest_order_shattered_set_trivial_concepts.html'>Minimum Largest Order Shattered Set of Trivial Concepts</a></li><li><a href='values/maximum_projected_teaching_set_size_trivial_concepts.html'>Maximum Projected Teaching-Set Size of Trivial Concepts</a></li><li><a href='values/monotonic_minimum_teaching_set_size_trivial_concepts.html'>Monotonic Minimum Teaching-Set Size of Trivial Concepts</a></li><li><a href='values/preferencebased_teaching_dimension_trivial_concepts.html'>Preference-Based Teaching Dimension of Trivial Concepts</a></li><li><a href='values/minimum_projected_teaching_set_size_trivial_concepts.html'>Minimum Projected Teaching-Set Size of Trivial Concepts</a></li><li><a href='values/monotonic_projected_minimum_teaching_set_size_trivial_concepts.html'>Monotonic Projected Minimum Teaching-Set Size of Trivial Concepts</a></li><li><a href='values/equivalence_queries_complexity_trivial_concepts.html'>Equivalence Queries Complexity of Trivial Concepts</a></li><li><a href='values/hitting_size_trivial_concepts.html'>Hitting Size of Trivial Concepts</a></li><li><a href='values/2littlestone_dimension_trivial_concepts.html'>2-Littlestone Dimension of Trivial Concepts</a></li><li><a href='values/3littlestone_dimension_trivial_concepts.html'>3-Littlestone Dimension of Trivial Concepts</a></li><li><a href='values/klittlestone_dimension_kge3_trivial_concepts.html'>$k$-Littlestone Dimension of Trivial Concepts</a></li><li><a href='values/best_mistakes_trivial_concepts.html'>Best Mistakes of Trivial Concepts</a></li><li><a href='values/worst_mistakes_trivial_concepts.html'>Worst Mistakes of Trivial Concepts</a></li><li><a href='values/selfdirected_queries_complexity_trivial_concepts.html'>Self-Directed Queries Complexity of Trivial Concepts</a></li><li><a href='values/occasional_onesided_getback_trivial_concepts.html'>Occasional One-Sided Getback of Trivial Concepts</a></li><li><a href='values/distinguishing_range_trivial_concepts.html'>Distinguishing Range of Trivial Concepts</a></li><li><a href='values/sign_rank_trivial_concepts.html'>Sign Rank of Trivial Concepts</a></li><li><a href='values/dual_sign_rank_trivial_concepts.html'>Dual Sign Rank of Trivial Concepts</a></li><li><a href='values/interpolation_degree_trivial_concepts.html'>Interpolation Degree of Trivial Concepts</a></li><li><a href='values/positive_teaching_dimension_trivial_concepts.html'>Positive Teaching Dimension of Trivial Concepts</a></li><li><a href='values/positive_recursive_teaching_dimension_trivial_concepts.html'>Positive Recursive Teaching Dimension of Trivial Concepts</a></li><li><a href='values/labeled_sample_compression_trivial_concepts.html'>Labeled Sample Compression of Trivial concepts</a></li><li><a href='values/proper_labeled_sample_compression_trivial_concepts.html'>Proper Labeled Sample Compression of Trivial concepts</a></li><li><a href='values/stable_labeled_sample_compression_trivial_concepts.html'>Stable Labeled Sample Compression of Trivial concepts</a></li><li><a href='values/proper_stable_labeled_sample_compression_trivial_concepts.html'>Proper Stable Labeled Sample Compression of Trivial concepts</a></li><li><a href='values/majority_complexity_trivial_concepts.html'>Majority Complexity of Trivial concepts</a></li><li><a href='values/random_equivalence_queries_complexity_trivial_concepts.html'>Random Equivalence Queries Complexity of Trivial concepts</a></li><li><a href='values/random_proper_equivalence_queries_complexity_trivial_concepts.html'>Random Proper Equivalence Queries Complexity of Trivial concepts</a></li><li><a href='values/unlabeled_sample_compression_trivial_concepts.html'>Unlabeled Sample Compression of Trivial concepts</a></li><li><a href='values/proper_unlabeled_sample_compression_trivial_concepts.html'>Proper Unlabeled Sample Compression of Trivial concepts</a></li><li><a href='values/stable_unlabeled_complexity_trivial_concepts.html'>Stable Unlabeled Complexity of Trivial concepts</a></li><li><a href='values/proper_stable_sample_compression_trivial_concepts.html'>Proper Stable Sample Compression of Trivial concepts</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/effective_range_yang_dimension.html'>Effective Range / Yang dimension</a></li><li><a href='relationships/proper_stable_labeled_sample_compression_covc_dimension.html'>Proper Stable Labeled Sample Compression / co-VC dimension</a></li><li><a href='relationships/log_shattering_log_size.html'>Log Shattering / Log Size</a></li><li><a href='relationships/positive_noclashing_teaching_dimension_maximum_positive_degree.html'>Positive No-Clashing Teaching Dimension / Maximum Positive Degree</a></li><li><a href='relationships/noclashing_teaching_dimension_densest_subgraph_twice.html'>No-Clashing Teaching Dimension / Densest Subgraph (twice)</a></li><li><a href='relationships/noclashing_teaching_dimension_double_density_or_average_degree.html'>No-Clashing Teaching Dimension / Double Density or Average Degree</a></li><li><a href='relationships/oriented_diameter_threshold_dimension.html'>Oriented Diameter / Threshold Dimension</a></li><li><a href='relationships/diameter_path_dimension.html'>Diameter / Path Dimension</a></li><li><a href='relationships/effective_range_projected_membership_queries_complexity.html'>Effective Range / Projected Membership Queries Complexity</a></li></ul></p></div>\n\n        </div>\n    </div>\n    ", "__edge__90": "\n    <div class=\"table-card\" id=\"math-132\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/size_projected_membership_queries_complexity.html\" class=\"table-title-link\">Size / Projected Membership Queries Complexity</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Size / Projected Membership Queries Complexity</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/size.html\">Size</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/projected_membership_queries_complexity.html\">Projected Membership Queries Complexity</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>Membership queries can eliminate at least one remaining candidate concept at each nonterminal step.</p></div>\n\n<p><strong>Status:</strong> </p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>For any finite projection $\\mathcal{G}$ of $\\mathcal{H}$, repeatedly choose a coordinate on which two remaining concepts disagree.  The answer eliminates at least one candidate, so at most $|\\mathcal{G}|-1\\le |\\mathcal{H}|-1$ queries suffice.  Hence $\\mathrm{Q}_m^p(\\mathcal{H})\\le |\\mathcal{H}|$.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__91": "\n    <div class=\"table-card\" id=\"math-133\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/log_size_random_proper_equivalence_queries_complexity.html\" class=\"table-title-link\">Log Size / Random Proper Equivalence Queries Complexity</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Log Size / Random Proper Equivalence Queries Complexity</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/log_size.html\">Log Size</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/random_proper_equivalence_queries_complexity.html\">Random Proper Equivalence Queries Complexity</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>A proper random-counterexample strategy halves the expected version-space size.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>At each stage, query a hypothesis minimizing its $L_1$ distance to the pointwise average of the current version space.  For every target, a uniformly random counterexample leaves at most half the current hypotheses in expectation.  Induction and Jensen's inequality for the concave logarithm then give expected remaining query cost at most $\\log|\\mathcal H|$.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__92": "\n    <div class=\"table-card\" id=\"math-134\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/proper_equivalence_queries_complexity_random_proper_equivalence_queries_complexity.html\" class=\"table-title-link\">Proper Equivalence Queries Complexity / Random Proper Equivalence Queries Complexity</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Proper Equivalence Queries Complexity / Random Proper Equivalence Queries Complexity</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/proper_equivalence_queries_complexity.html\">Proper Equivalence Queries Complexity</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/random_proper_equivalence_queries_complexity.html\">Random Proper Equivalence Queries Complexity</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Every deterministic proper equivalence-query algorithm is a randomized one with degenerate randomness.  Allowing randomization cannot increase the optimum, so deterministic complexity is at least randomized complexity.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__93": "\n    <div class=\"table-card\" id=\"math-135\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/random_proper_equivalence_queries_complexity_random_equivalence_queries_complexity.html\" class=\"table-title-link\">Random Proper Equivalence Queries Complexity / Random Equivalence Queries Complexity</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Random Proper Equivalence Queries Complexity / Random Equivalence Queries Complexity</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/random_proper_equivalence_queries_complexity.html\">Random Proper Equivalence Queries Complexity</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/random_equivalence_queries_complexity.html\">Random Equivalence Queries Complexity</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Random proper equivalence-query algorithms are restricted to hypotheses from the class, whereas random equivalence-query algorithms may use arbitrary hypotheses.  The restriction cannot lower the optimal expected or worst-case query complexity.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__94": "\n    <div class=\"table-card\" id=\"math-138\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/proper_equivalence_queries_complexity_membership_and_proper_equivalence_queries_complexity.html\" class=\"table-title-link\">Proper Equivalence Queries Complexity / Membership and Proper Equivalence Queries Complexity</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Proper Equivalence Queries Complexity / Membership and Proper Equivalence Queries Complexity</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/proper_equivalence_queries_complexity.html\">Proper Equivalence Queries Complexity</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/membership_and_proper_equivalence_queries_complexity.html\">Membership and Proper Equivalence Queries Complexity</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>Any learner using only proper equivalence queries is a valid learner in the model that additionally permits membership queries.  The larger set of permitted queries cannot increase optimal complexity.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__95": "\n    <div class=\"table-card\" id=\"math-139\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/proper_equivalence_queries_complexity_equivalence_queries_complexity.html\" class=\"table-title-link\">Proper Equivalence Queries Complexity / Equivalence Queries Complexity</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Proper Equivalence Queries Complexity / Equivalence Queries Complexity</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/proper_equivalence_queries_complexity.html\">Proper Equivalence Queries Complexity</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/equivalence_queries_complexity.html\">Equivalence Queries Complexity</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>A proper equivalence-query learner may query only hypotheses from the class, whereas unrestricted equivalence queries allow arbitrary hypotheses.  The restriction cannot decrease the optimal worst-case query complexity.</p></div>\n\n\n\n\n        </div>\n    </div>\n    ", "__edge__96": "\n    <div class=\"table-card\" id=\"math-140\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/littlestone_dimension_occasional_onesided_getback.html\" class=\"table-title-link\">Littlestone Dimension / Occasional One-Sided Getback</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Littlestone Dimension / Occasional One-Sided Getback</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/littlestone_dimension.html\">Littlestone Dimension</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/occasional_onesided_getback.html\">Occasional One-Sided Getback</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>The occasional one-sided favorable game is a restricted tree/mistake game: the learner chooses the presentation and the adversary may only signal mistakes.</p></div>\n\n<p><strong>Status:</strong> Established</p>\n\n<strong>Full Proof:</strong><div class=\"text-field\"><p>LaTeX survey, OOG/compression lemma (lem:oog-compression).</p></div>\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#ben1997online\">[ben1997online]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__97": "\n    <div class=\"table-card\" id=\"math-143\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/3littlestone_dimension_klittlestone_dimension_kge3.html\" class=\"table-title-link\">$k$-Littlestone Dimension ($k\\ge3$) / 3-Littlestone Dimension</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>$k$-Littlestone Dimension ($k\\ge3$) / 3-Littlestone Dimension</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/klittlestone_dimension_kge3.html\">$k$-Littlestone Dimension ($k\\ge3$)</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/3littlestone_dimension.html\">3-Littlestone Dimension</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For $k\\ge3$, every 3-realizable branch is $k$-realizable.</p></div>\n\n<p><strong>Status:</strong> </p>\n<strong>Proof or Proof Sketch:</strong><div class=\"text-field\"><p>If $k\\ge3$, every tree whose branches have at most three disagreements with a hypothesis also has branches with at most $k$ disagreements.  Hence $\\mathrm{L}_k(\\mathcal{H})\\ge\\mathrm{L}_3(\\mathcal{H})$.</p></div>\n\n\n<strong>References:</strong><div class=\"text-field\"><p><a href=\"bibliography.html#filmus2023randomized\">[filmus2023randomized]</a></p></div>\n\n        </div>\n    </div>\n    ", "__edge__98": "\n    <div class=\"table-card\" id=\"math-144\" style=\"position:relative;\">\n        \n        <h3><a href=\"relationships/membership_query_complexity_log_size.html\" class=\"table-title-link\">Membership Query Complexity / Log Size</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Membership Query Complexity / Log Size</p>\n<p><strong>Parameter 1: </strong><a href=\"parameters/membership_query_complexity.html\">Membership Query Complexity</a></p>\n<p><strong>Parameter 2: </strong><a href=\"parameters/log_size.html\">Log Size</a></p>\n<p><strong>Relationship Type:</strong> $P_1\\ge P_2$</p>\n<p><strong>Variant:</strong> </p>\n<strong>Details:</strong><div class=\"text-field\"><p>For finite concept classes, membership-query complexity is at least log-size.</p></div>\n<p><strong>Witness: </strong><a href=\"classes/singletons.html\">Singletons</a></p>\n<p><strong>Status:</strong> Established</p>\n\n<strong>Full Proof:</strong><div class=\"text-field\"><p>LaTeX survey, membership-query/log-size lemma (lem:membership-query-log-size).</p></div>\n\n\n\n        </div>\n    </div>\n    ", "__label__98": "\n    <div class=\"table-card\" id=\"math-2\" style=\"position:relative;\">\n        \n        <h3><a href=\"classes/singletons.html\" class=\"table-title-link\">Singletons</a></h3>\n        <div class=\"table-details\">\n        <p><strong>Name: </strong>Singletons</p>\n<strong>Symbol:</strong>\n    <div class=\"table-display\">\n        <div class=\"latex-equation\" data-latex=\"\\{\\{i\\}\\}_{1\\le i\\le n}\">\n            \\[\\{\\{i\\}\\}_{1\\le i\\le n}\\]\n        </div>\n    </div>\n    \n<strong>Definition:</strong><div class=\"text-field\"><p>Singletons</p></div>\n\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/recursive_teaching_dimension_singletons.html'>Recursive Teaching Dimension of Singletons</a></li><li><a href='values/star_number_singletons.html'>Star number of Singletons</a></li><li><a href='values/covc_dimension_single ain be the cyclic group $\\mathbb{Z}/5\\mathbb{Z}$.  A binary function belongs to $C_5$ precisely when, on some four consecutive cyclic positions, its values are $1,0,0,1$ in that order.  The value on the remaining position is unrestricted, so the class has ten functions.</p></div>\n<strong>Comments:</strong><div class=\"text-field\"><p>This is also called Warmuth's example.  It is a finite separation between unlabeled sample-compression size and VC dimension.</p></div>\n<div class=\"reference-field\"><p><strong>Related Values:</strong><ul class='fields-list'><li><a href='values/vc_dimension_warmuth_c5.html'>VC Dimension of Warmuth's $C_5$ class</a></li><li><a href='values/unlabeled_sample_compression_warmuth_c5.html'>Unlabeled Sample Compression of Warmuth's $C_5$ class</a></li><li><a href='values/size_warmuth_c5.html'>Size of Warmuth's $C_5$ class</a></li><li><a href='values/effective_range_warmuth_c5.html'>Effective Range of Warmuth's $C_5$ class</a></li><li><a href='values/log_size_warmuth_c5.html'>Log Size of Warmuth's $C_5$ class</a></li><li><a href='values/largest_shattered_set_warmuth_c5.html'>Largest Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_largest_order_shattered_set_warmuth_c5.html'>Maximum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_vc_radius_warmuth_c5.html'>Projected VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_strongly_shattered_dimension_warmuth_c5.html'>Projected Strongly Shattered Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_degree_warmuth_c5.html'>Maximum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_degree_warmuth_c5.html'>Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/double_density_or_average_degree_warmuth_c5.html'>Double Density or Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/densest_subgraph_twice_warmuth_c5.html'>Densest Subgraph (twice) of Warmuth's $C_5$ Class</a></li><li><a href='values/hamming_radius_warmuth_c5.html'>Hamming Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/oriented_diameter_warmuth_c5.html'>Oriented Diameter of Warmuth's $C_5$ Class</a></li><li><a href='values/threshold_dimension_warmuth_c5.html'>Threshold Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/path_dimension_warmuth_c5.html'>Path Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/degeneracy_warmuth_c5.html'>Degeneracy of Warmuth's $C_5$ Class</a></li><li><a href='values/largest_strongly_shattered_set_warmuth_c5.html'>Largest Strongly Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_positive_degree_warmuth_c5.html'>Maximum Positive Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_maximal_degree_warmuth_c5.html'>Projected Maximal Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_minimum_degree_warmuth_c5.html'>Projected Minimum Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/projected_double_density_or_projected_average_degree_warmuth_c5.html'>Projected Double Density or Projected Average Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/effective_vc_radius_warmuth_c5.html'>Effective VC Radius of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_largest_order_shattered_set_warmuth_c5.html'>Minimum Largest Order Shattered Set of Warmuth's $C_5$ Class</a></li><li><a href='values/minimum_teaching_set_size_warmuth_c5.html'>Minimum Teaching Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_teaching_set_size_warmuth_c5.html'>Maximum Teaching Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/teaching_dimension_warmuth_c5.html'>Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/recursive_teaching_dimension_warmuth_c5.html'>Recursive Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/monotone_recursive_teaching_dimension_warmuth_c5.html'>Projected Recursive Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/monotonic_minimum_teaching_set_size_warmuth_c5.html'>Monotonic Minimum Teaching-Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/preferencebased_teaching_dimension_warmuth_c5.html'>Preference-Based Teaching Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/star_number_warmuth_c5.html'>Star Number of Warmuth's $C_5$ Class</a></li><li><a href='values/maximum_projected_teaching_set_size_warmuth_c5.html'>Maximum Projected Teaching-Set Size of Warmuth's $C_5$ Class</a></li><li><a href='values/log_shattering_warmuth_c5.html'>Log Shattering of Warmuth's $C_5$ Class</a></li><li><a href='values/log_size_ratio_warmuth_c5.html'>Log Size Ratio of Warmuth's $C_5$ Class</a></li><li><a href='values/membership_query_complexity_warmuth_c5.html'>Membership Query Complexity of Warmuth's $C_5$ Class</a></li><li><a href='values/littlestone_dimension_warmuth_c5.html'>Littlestone Dimension of Warmuth's $C_5$ Class</a></li><li><a href='values/equivalence_queries_complexity_warmuth_c5.html'>Equivalence Queries Complexity of Warmuth's $C_5$ Class</a></li><li><a href='values/interpolation_degree_warmuth_c5.html'>Interpolation Degree of Warmuth's $C_5$ Class</a></li><li><a href='values/diameter_warmuth_c5.html'>Diameter of Warmuth's $C_5$ class</a></li><li><a href='values/relative_hitting_size_warmuth_c5.html'>Relative Hitting Size of Warmuth's $C_5$ class</a></li><li><a href='values/hitting_size_warmuth_c5.html'>Hitting Size of Warmuth's $C_5$ Class</a></li></ul></p></div>\n<div class=\"reference-field\"><p><strong>Related Relationships:</strong><ul class='fields-list'><li><a href='relationships/minimum_largest_order_shattered_set_largest_strongly_shattered_set.html'>Minimum Largest Order Shattered Set / Largest Strongly Shattered Set</a></li><li><a href='relationships/minimum_teaching_set_size_effective_vc_radius.html'>Minimum Teaching Set Size / Effective VC Radius<
